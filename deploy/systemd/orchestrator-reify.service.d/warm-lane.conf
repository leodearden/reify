# drop-in: orchestrator-reify.service.d/warm-lane.conf
#
# DA5 fail-open: Wants= (NOT Requires=) so a missing/failed warm-lane mount
# degrades to the cold path (inv.6) and never blocks orchestrator startup.
# After= establishes ordering (orchestrator starts after provisioning completes)
# without making the mount a hard dependency.
#
# This drop-in is owned by the reify repo and installed by
# scripts/install-warm-lane-units.sh.  It adds the warm-lane service to the
# orchestrator's After/Wants additively, without editing the dark-factory-owned
# base orchestrator-reify.service unit.
#
# task 4988: reify-warm-base-health.service (the boot self-heal ladder for the
# CoW seed base) is added the same way — Wants=/After= only, NEVER Requires=.
# Its rung 3 cold-build backgrounds itself by default, so After= here can never
# stall orchestrator startup for the multi-hour build (inv.6 fail-open).

[Unit]
Wants=reify-warm-lane.service
After=reify-warm-lane.service
Wants=reify-warm-base-health.service
After=reify-warm-base-health.service

# ── warm-lane leak-status oracle (REIFY_LANE_LEAK_STATUS_CMD, task 5177 seam) ──
# The warm-lane leak machinery — warm-lane-preflight.sh Check 6,
# warm-lane-degenerate-ref-check.sh, and warm-lane-audit.sh classification —
# resolves a lane's backing-task terminal status via the REIFY_LANE_LEAK_STATUS_CMD
# oracle (the 4749 seam; opt-in by design, activated here at DEPLOYMENT rather
# than by changing the scripts' advisory-opt-in default). dark-factory invokes
# those scripts from the orchestrator's own background loops with the orchestrator
# process environment ({**os.environ}; it passes NO --status-cmd flag), so the
# oracle must be present in THIS unit's environment. Without it every stale lane
# classifies as leak_unknown (never confirmed LEAKED) and the leak detectors go
# dark. lane-task-status.sh reads the canonical Taskmaster store READ-ONLY and
# fail-safes to empty output (=> unknown => preserve) on any error, so a live
# lane is never mis-classified.
# NOTE (task 5326): warm-lane-gc.sh no longer consults this oracle — its Tier-3
# terminal-task reclaim is subsumed by the Pass-1 always-reclaim policy and its
# --status-cmd flag / oracle reads were removed; the remaining consumers above
# still need the export.
[Service]
Environment=REIFY_LANE_LEAK_STATUS_CMD=/home/leo/src/reify/scripts/lane-task-status.sh
