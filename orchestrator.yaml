# Reify orchestrator configuration
# Rust + Tauri/TypeScript (GUI) project

# Concurrency
# 24→48 (2026-06-23, Leo via escalation-watcher, esc-4743-43): reverted to 48 to
# relieve warm-lane task-pool exhaustion (warm_lane_pool.task_pool_size derives
# from this cap). Leo's rationale: the PSI/token admission-control guards added
# since the 2026-06-04 cut (compile_gate, psi_gate, agent cpu-admit, held-slot
# semaphore) now backstop the oversubscription that caused the original livelock.
# NOTE (corrected 2026-06-29, /deb root-cause): the original in-memory lane-leak
# (esc-4743-43: release bound only to DONE+on-main) was FIXED by dark-factory 1881
# (broadened terminal release + status-keyed reconciler) and 1912-1914 (branch-ref
# decouple). Both are LIVE and confirmed working — the pool cycles (0 exhaustion events
# since the 2026-06-27 restart; 36 acquires / 58 releases; release_lane_for_terminal_task
# firing). The earlier "true cause is a lane-leak / stuck-ASSIGNED bug" claim is STALE: a
# FREE lane retains its last task's branch ref (intended branch-decouple artifact), which
# looks like a stuck assignment in `git worktree list` but is not. Two residual issues
# remain, NEITHER a saturating leak: (a) ACUTE — a `git clean` TOCTOU race against reify's
# async target.reseed-trash.<pid> dir during _reset_warm_lane hard-faults a dispatch
# (this was the actual 2026-06-29 task-4892 block; reify 4896 relocates the trash,
# dark-factory 1931 excludes it + tolerates the benign ENOENT, 1932 makes a transient
# acquire-fault retryable instead of BLOCK); (b) LATENT — the terminal-lane reconciler
# reclaims only done/cancelled, so lanes pinned to blocked/non-dispatched tasks are freed
# only lazily on the next acquire (dark-factory 1933 adds a reclaim-on-exhaustion safety
# valve). `spare_warm_lanes` below is the interim headroom margin. The stale
# `warm_lane_pool.enabled: false` that gated off the invariant-6 cold-fallback was removed
# 2026-06-23.
# History: 48→24 on 2026-06-04 because 48 concurrent tasks on a 32-thread box
# livelocked the SERIAL merge queue (post-merge verifies timed out exit 124 from
# 20:06-22:00, main froze 2h at full CPU burn; 24 left the merge verify ~half the
# box). Re-cut toward 24 if the merge-latency livelock recurs.
max_concurrent_tasks: 48
# spare_warm_lanes (added 2026-06-29, /deb): effective warm task-lane pool
# N = max_concurrent_tasks + spare_warm_lanes (dark-factory OrchestratorConfig field
# `spare_warm_lanes`, config.py; read ONCE at startup → requires a restart to take effect).
# 8 spare gives acquire headroom so a transient stuck-ASSIGNED / non-dispatched-pinned lane
# does not exhaust the pool and force the inv.6 cold-fallback under light load. INTERIM
# margin until the lazy reclaim-on-exhaustion safety valve (dark-factory task 1933) lands.
# This is a TOP-LEVEL key (sibling of max_concurrent_tasks), NOT nested under warm_lane_pool.
spare_warm_lanes: 8
max_per_module: 1
# lock_depth 4→10 (Leo 2026-06-18): make module locks effectively file-granular. At
# depth 4 a file path DEEPER than 4 components (e.g. crates/reify-eval/src/compute_targets/
# form_find.rs) coarsened to its 4-comp ancestor dir lock (crates/reify-eval/src/
# compute_targets), serializing the whole compute_targets/ hot anchor (5 files). Empirical
# max real path depth = 6, so depth 10 is pure headroom — identical lock granularity to 6
# for every current path, no path coarsens. SAFE: correctness rests on BRE (acquire-before-
# edit) + full-workspace merge-verify, NOT lock coarseness; finer locks only shift more
# weight onto BRE re-pends + merge-verify RED-requeue (accepted cost). Orthogonal to the
# declaration-honesty guard (docs/prds/task-lock-charter-lifecycle.md): raising depth does
# NOT fix bare directory strings (≤depth, untouched by truncation); that guard does NOT fix
# deep-file coarsening. The residual shared-dispatch-registry contention (compute_targets/
# mod.rs, engine_build match family) needs data-driven dispatch tables, not lock depth.
lock_depth: 10

# TEMP (Leo 2026-06-18): bumped the per-task verify timeout 1800 (package default) -> 3600 for cold-cache
# verify-timeout relief until the Phase 6 warm-lane CoW pool (#4665) is live. REVERT at #4665.
# See docs/prds/warm-lane-pool-cow-seeding.md. (cold default verify_cold_command_timeout_secs=5400 unchanged.)
# 2026-06-19 (Leo): further bumped 3600 -> 7200 alongside the test-semaphore re-tune (N=2 + WAIT=3600
# in verify_env below). The slot-acquire WAIT (3600) counts against this command budget, so WAIT must
# stay < this value while DF does not implement clock-stop: a task that acquires the slot late still
# gets ~3600s for nextest and exits cleanly (exit-75 → BLOCKED, pre-seam) rather than exit-124 hard
# timeout mid-test. Post-seam (dark_factory:1916, task 4838): the @@REIFY_CLOCK_*@@ marker span is
# excluded from this budget, so WAIT can safely flip to unlimited (task 4838). NB the cold default
# (5400) is now < this warm budget; if cold-cache verifies under saturation start hitting exit-124,
# add verify_cold_command_timeout_secs >= 7200.
verify_command_timeout_secs: 7200
# Clock-stop seam — ACTIVATED 2026-06-26 via task 4838.
# dark_factory:1916 deployed; @@REIFY_CLOCK_*@@ span excluded from
# verify_command_timeout_secs (continuous wait no longer counts against this budget).
# Markers default to @@REIFY_CLOCK_{STOP,HEARTBEAT,START}@@ in DF defaults.yaml
# (byte-match reify's lib_clock_stop.sh emitter — no marker override needed).
# 2026-07-08 (task 5156, Leo-approved verify-flakiness survey follow-up): bumped
# 180 -> 600. The 180s backstop false-killed verifies whose clock-stop span was
# followed by a long SILENT native-crate compile/link with no heartbeat (32
# escalations across ~12 tasks 06-27..07-06; worst observed false-kill at wall
# time 329.9s, 0 assertion failures). 600 gives ~1.8x margin over that worst case;
# a genuinely wedged wait is now caught in 10min instead of 3, which is
# acceptable since live waits heartbeat every 30s and the 7200s
# verify_command_timeout_secs outer wall still bounds everything. Durable fix
# (per-test slow-timeout attribution so this can be tightened again) is task 5141.
verify_clock_stop_enabled: true
verify_clock_stop_heartbeat_idle_max: 600

# Verification commands — thin delegations to scripts/verify.sh, the single
# source of truth shared with the git hooks (hooks/project-checks +
# hooks/pre-merge-commit). All the logic lives in verify.sh: a single
# `cargo nextest run --workspace` pass (OCCT crates folded into the pool via
# the nextest occt test-group max-threads=4; task 4451), the release-sensitive
# crate nextest pass, the sccache/jobserver/OCCT LD_LIBRARY_PATH env, the
# per-invocation timeout budgets, the tree-sitter generate prereq, and the
# npm/infra steps. `verify.sh --print-plan` emits the exact ordered command
# list it will run; the infra drift tests assert against that oracle.
# Authoritative OCCT crate list: scripts/occt-touching-crates.txt
# (shared via scripts/occt-scope-lib.sh). See `scripts/verify.sh --help`.
#
# --scope branch narrows per-task verification to files changed since
# merge-base(main, HEAD) (committed + uncommitted task work). This keeps
# per-task TDD iterations fast: a docs-only task runs no cargo, a
# frontend-only task skips the Rust pipeline, etc.
#
# The merge path (DF_VERIFY_ROLE=merge) keeps full scope: hooks/pre-merge-commit
# uses --scope all explicitly, and the orchestrator merge pipeline does not
# invoke test_command / lint_command below.
#
# No --profile here: verify.sh derives the profile from DF_VERIFY_ROLE (task 4078).
# Per-task verifies run with DF_VERIFY_ROLE=task => profile=debug (fast feedback).
# The orchestrator merge path injects DF_VERIFY_ROLE=merge => profile=both,
# exercising release-only tests (the 4055 sweep test, 4 large-DOF Euler tests,
# and the cfg(debug_assertions)-gated buckling/eigensolve tests in
# reify-solver-elastic) without slowing every per-task TDD iteration.
# hooks/pre-merge-commit pins --profile both explicitly for the local manual-merge
# gate (git merge on main) and is unchanged.
#
# DF_VERIFY_ROLE=merge also exempts the run from the held-slot test-run semaphore
# (scripts/lib_test_semaphore.sh test_semaphore_acquire) in addition to the
# psi_gate() bypass. The merge gate never waits behind a task slot.
#
# PREMISE CORRECTION (PRD verify-admission-wait-clock-stop §2, task 4837):
# DF does NOT requeue a verify exit-75 — _classify_failure falls it through to
# unknown_test_failure → debugfix loop → BLOCKED (the true mechanism behind task
# 4800 and the esc-3891-45/esc-4673-31/esc-4552 cluster).
#
# Real fix: both admission gates (semaphore + PSI gate) use a continuous
# in-process blocking wait with @@REIFY_CLOCK_{STOP,HEARTBEAT,START}@@ markers
# emitted to stderr. dark_factory:1916 (task 4838) consumes these markers to
# exclude the wait span from verify_command_timeout_secs. REIFY_TEST_SEMAPHORE_WAIT
# and REIFY_PSI_GATE_MAX_WAIT accept "unlimited" to activate the continuous wait.
# CLOCK-STOP SEAM ACTIVATED 2026-06-26 (task 4838): WAIT=unlimited on both gates;
# @@REIFY_CLOCK_*@@ span excluded from verify_command_timeout_secs by dark_factory:1916.
test_command: "./scripts/verify.sh test --scope branch --include-infra"
lint_command: "./scripts/verify.sh lint --scope branch --include-infra"
# type_check_command is a passing no-op (task 4063).
# Rationale: lint_command's `cargo clippy --workspace --all-targets -- -D warnings` is a
# STRICT SUPERSET of `cargo check --workspace --tests` — clippy runs the full compiler
# frontend and reports every type error cargo check would, plus lint warnings. The
# orchestrator invokes test_command / lint_command / type_check_command as THREE SEPARATE
# verify.sh processes; verify.sh's own intra-process clippy-vs-cargo-check dedup (the
# DO_TYPECHECK && !DO_LINT guard at verify.sh:351) does NOT bridge across these separate
# invocations. So the standalone `verify.sh typecheck` pass was pure redundant compile
# (~20 min cargo check --workspace --tests) on every task iteration. No-op'd here.
#
# ACCEPTED COST: type errors now fail the LINT (clippy) phase rather than a distinct
# typecheck phase, so per-phase failure attribution loses the "type errors" bucket.
# Acceptable: clippy is the stricter signal and catches everything cargo check does.
# verify.sh's `typecheck` action remains a valid standalone/manual entry point unchanged.
type_check_command: "true"

# Run test/lint/type sequentially in one verify invocation.
# Rust workspaces take an advisory lock on target/.cargo-lock, so the three
# concurrent cargo subcommands serialize anyway — parallelism just wastes CPU.
concurrent_verify: false

# Env injected into verify subprocesses (merged on top of os.environ).
# sccache caches rustc output across worktrees; CARGO_INCREMENTAL=0 is required
# because incremental and sccache are mutually exclusive.
verify_env:
  REIFY_RUN_ALL_EXCLUDE_HOST_INFRA: "1"
  REIFY_GATE_EXCLUDE_HEAVY: "1"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  # CARGO_MAKEFLAGS is owned solely by scripts/verify.sh apply_env() (single source,
  # contract C3 / task 4518 δ). It is NOT injected here; apply_env selects the role
  # FIFO at runtime (merge→/tmp/reify-jobserver-merge, task→/tmp/reify-jobserver-task).
  # Test-run semaphore knobs (REIFY_TEST_SEMAPHORE_*): tuned up from the safe
  # defaults (N=1, WAIT=1800s; scripts/lib_test_semaphore.sh) to relieve
  # sustained test-slot starvation under concurrent-verify oversubscription
  # (esc-3891-45 / esc-4673-31 / esc-4552 cluster: many code-complete tasks hit
  # exit-75 acquire timeouts). See docs/prds/test-run-concurrency-semaphore.md §5
  # for the historical knob contract (§4/§6/§7 exit-75→requeue claim is superseded
  # by docs/prds/verify-admission-wait-clock-stop.md; DF does NOT requeue exit-75).
  # 2→3 (Leo, 2026-06-25): N=2 still starved out task 4800 (and the exit-75
  # cluster) because the held slot spans the *entire* `cargo nextest run`
  # (test-binary compile+link, NOT just execution), and that compile crawls under
  # the merge-favored 8-token task jobserver pool (task_baseline=nproc//4) whenever
  # a merge verify is running. Two slots then cling for tens of minutes while ~5+
  # task verifies wait the full WAIT and exit-75. N=3 = up to 3 concurrent
  # full-workspace nextests (OCCT/manifold/openvdb heavy) — watch host RSS for OOM
  # (125G host; merge verifies run concurrently and bypass the semaphore).
  # CLOCK-STOP SEAM ACTIVATED 2026-06-26 (task 4837/4838):
  # Both admission gates now use a continuous blocking wait with
  # @@REIFY_CLOCK_{STOP,HEARTBEAT,START}@@ markers emitted to stderr;
  # dark_factory:1916 excludes this wait span from verify_command_timeout_secs.
  # WAIT=unlimited is safe post-seam: the @@REIFY_CLOCK_*@@ span is EXCLUDED
  # from verify_command_timeout_secs, so the sequential-budget constraint
  # (pre-seam: sum ≈5700 must stay < 7200) no longer applies to these waits.
  # A genuinely-wedged wait (no heartbeat within 180s idle-max) is still killed.
  # 3→2 (Leo, 2026-06-27 design-recheck): drop back to N=2. The 2→3 bump above was
  # to relieve exit-75 slot starvation — but that starvation is now handled
  # structurally by the clock-stop seam (WAIT=unlimited + @@REIFY_CLOCK_*@@): a
  # slot-starved task WAITS gracefully instead of exit-75→BLOCKED, so N's starvation
  # downside is gone. Meanwhile MEMORY is the binding constraint under load (mem PSI
  # full≈28%, 161 GiB swap on the 125 GiB host): N=3 = up to 3 concurrent
  # OCCT/manifold/openvdb-heavy nextests (≈24 OCCT threads × ~2 GiB each) over-commits
  # RAM (3×48≈144 GiB > 125), blowing the task-4503 headroom basis (proven at N=2:
  # 2×48≈96 GiB < 125). N=2 restores that headroom. Paired with the new memory-PSI
  # admission gate (task 4861) and the pending 4839 revert (task 4862 — build back
  # inside the slot).
  REIFY_TEST_SEMAPHORE_CONCURRENCY: "2"
  REIFY_TEST_SEMAPHORE_WAIT: "unlimited"
  REIFY_PSI_GATE_MAX_WAIT: "unlimited"

# Agent inner-loop jobserver wiring (dark_factory:1745). Injects CARGO_MAKEFLAGS
# into architect/implementer/debugger subprocesses so the cargo build/test/metadata
# calls the agents run DURING their TDD/plan turns draw from the shared task-pool
# FIFO instead of each running at private -j(nproc). This is a SECOND oversubscription
# source, distinct from the verify-phase wiring above: verify_env/verify.sh govern the
# verify cargo; this governs the AGENT cargo. Without it, ~24 task lanes' uncoordinated
# inner-loop rustc sustained load 104-137 on this 32-core host and starved agent CLI
# spawns pre-first-turn (the df:1745 / df:1739 0-turn wedge). JobserverConfig defaults
# enabled:false, so reify MUST opt in here — the dark-factory task could not edit this
# reify-owned file (its docstring assumed this block; it had been missing).
# Graceful degradation: agent_env() guards on `[ -p task_fifo ]` (mirrors verify.sh:431),
# so when reify-jobserver.service is down the FIFO is absent and agents fall back to the
# private pool. This therefore does NOT substitute for jobserver+canary durability; it
# only bounds agent cargo while the pool is healthy.
jobserver:
  enabled: true
  task_fifo: /tmp/reify-jobserver-task  # task-role FIFO; matches verify.sh + scripts/jobserver-balancer.py

# CPU governance — agent-launch CPU-time-share + PSI-admission config (#4633).
#
# Reify SHIPS the primitives:
#   α  scripts/cpu-admit.sh         — PSI-admission core (verify + agent paths)
#   β  scripts/agent-bin/cargo      — per-command PSI shim for agents (task 4631)
#   γ  scripts/cpu-governed-exec.sh — cgroup cpu.weight placement wrapper (task 4632)
#
# Dark-factory's ζ WIRES the agent-launch path by reading these values to:
#   1. Wrap each spawned agent in `cpu-governed-exec.sh --role <task|merge>` (γ).
#   2. Set DF_AGENT_CPU_GOVERN=<value below> in the agent environment to activate
#      the β agent-bin/cargo PSI shim inside the agent.
#
# The reify orchestrator's own Pydantic config model uses extra='ignore', so this
# unknown top-level block is tolerated at startup and is INERT until ζ reads it.
# Empirical evidence for extra='ignore': the orchestrator already runs tolerating
# similarly unknown top-level keys — 'fairness:', 'merge_train_former_enabled',
# 'merge_train_coalesce_enabled' — none of which caused a crash-loop when first
# added; extra='forbid' would have rejected them.  To confirm from dark-factory
# source: grep the ProjectConfig Pydantic model for model_config / class Config
# and verify extra='ignore' (not 'forbid').
# It is the single source of truth for knob defaults; knob NAMES here MUST match
# the env vars the scripts read, and knob VALUES must match the :-fallback defaults
# in those scripts (tests/infra/test_cpu_governance_config.sh cross-checks both).
cpu_governance:
  enabled: true
  weights:
    task: 100   # REIFY_CPU_GOVERN_W_TASK (scripts/cpu-governed-exec.sh) — task agents get weight 100
    merge: 300  # REIFY_CPU_GOVERN_W_MERGE (scripts/cpu-governed-exec.sh) — ≈3:1 merge:task, mirrors jobserver baseline
  agent_admit:
    enabled: true
    threshold: 50  # REIFY_CPU_ADMIT_AGENT_THRESHOLD (scripts/agent-bin/cargo) — avg10 % PSI ceiling for heavy cargo subcommands
  DF_AGENT_CPU_GOVERN: 1  # reify-owned value dark-factory ζ reads to enable the agent-launch spawn prefix
  # fleet_load_detector (task 5135): host-aggregate loadavg/PSI oversubscription
  # DETECTOR (scripts/fleet-load-detector.sh) — observes ALL concurrently-
  # dispatched lanes via host-global /proc/loadavg + /proc/pressure/cpu, no
  # per-lane enumeration needed. Knob VALUES below MUST match the script's
  # :-fallback defaults (cross-checked by tests/infra/test_fleet_load_detector
  # .sh Block I, kept self-contained rather than enlarging
  # test_cpu_governance_config.sh). `enabled` is DF-consumed (not grep-checked
  # against a reify script, exactly like DF_AGENT_CPU_GOVERN above) — dark-
  # factory L3b (out of scope for reify; docs/prds/run-all-pool-contention-
  # tiering-fix.md §9) reads this block to wire the periodic invocation +
  # dispatch-admission cap/escalation action. orchestrator.yaml loads once at
  # startup, so a config edit needs commit-then-restart to take effect on the
  # DF side (deploy-time concern, not verified here).
  fleet_load_detector:
    enabled: true
    ratio_threshold: 4.0  # REIFY_FLEET_LOAD_RATIO_THRESHOLD (scripts/fleet-load-detector.sh)
    avg10_threshold: 80   # REIFY_FLEET_LOAD_AVG10_THRESHOLD (scripts/fleet-load-detector.sh)

# ── Warm-lane CoW pool (Phase 6, task ε #4663) ───────────────────────────────
# reify ships the primitives: scripts/{provision-warm-lane-fs,seed-warm-lane,
# refresh-warm-base,warm-lane-preflight}.sh.  Dark-factory ζ (#1788 task-dispatch),
# ν (#1820 re-wire to D10), and η (#1789 merge-speculation, gated on Lever C) wire
# the consumers by reading these knobs + the §9.5 lifecycle contract documented in
# CLAUDE.md "Warm-lane CoW pool" and docs/prds/warm-lane-pool-cow-seeding.md §9.3/§9.5.
# This block is LIVE: DF ζ task-dispatch wiring now reads it (pool ACTIVATED
# 2026-06-20, #4665 — see `warm_lane_pool: true` in the worktree-base section below).
# The stale `enabled: false` was removed 2026-06-23 (esc-4743-43): with ζ reading
# the block, enabled:false was a split-brain that gated off the invariant-6 cold-
# fallback, so acquire_lane hard-requeued on pool exhaustion instead of falling back
# to a cold worktree — wedging task dispatch fleet-wide.
# Knob VALUES must match owning-script defaults and the cited REIFY_* NAME must appear
# in the owning script (cross-checked by tests/infra/test_warm_lane_pool_config.sh).
warm_lane_pool:
  task_pool_size_source: max_concurrent_tasks  # D9: DERIVED from the max_concurrent_tasks cap above, read once at startup — NOT a duplicated constant
  merge_spec_pool_size_source: _MERGE_AHEAD_BOUND  # K merge-spec slots (=1 serial today; grows with Lever C)
  substrate:
    image_path: /media/leo/data_lv_1/leo/reify-warm-lanes.img  # provision-warm-lane-fs.sh --img / IMG= default
    size_gib: 4096                             # provision-warm-lane-fs.sh --size-gib / SIZE_GIB= default
    mount_env: REIFY_WARM_LANE_MOUNT           # mount-dir override env provision-warm-lane-fs.sh reads
  defrag_extent_threshold: 64                  # refresh-warm-base.sh --frag-threshold / FRAG_THRESHOLD= default
  # Disk-pressure admission knobs (task 5175, PRD warm-lane-pool-sizing-lifecycle.md
  # §9.4) for scripts/warm-lane-disk-guard.sh. hard = space-safety ε (#4716):
  # below-floor is EX_TEMPFAIL 75 (requeue). soft = proactive throttle ε (#5175):
  # below-floor (but still above hard) is exit 3, consumed by dark-factory's θ
  # dispatch throttle to back off admission BEFORE the hard floor is ever hit.
  # soft > hard on both axes is a hard invariant (E1) enforced by `check --soft`
  # itself (exit 2 if violated). Values cross-checked against the script's `:-`
  # fallback defaults by tests/infra/test_warm_lane_pool_config.sh (B7).
  min_free_gib: 50                # REIFY_WARM_LANE_DISK_GUARD_MIN_FREE_GIB (hard floor, exit 75) (scripts/warm-lane-disk-guard.sh)
  min_free_inodes: 500000         # REIFY_WARM_LANE_DISK_GUARD_MIN_FREE_INODES (hard floor, exit 75) (scripts/warm-lane-disk-guard.sh)
  soft_free_gib: 500              # REIFY_WARM_LANE_DISK_GUARD_SOFT_FREE_GIB (soft throttle floor, exit 3; §13 Q1 tuning) (scripts/warm-lane-disk-guard.sh)
  soft_free_inodes: 5000000       # REIFY_WARM_LANE_DISK_GUARD_SOFT_FREE_INODES (soft throttle floor, exit 3) (scripts/warm-lane-disk-guard.sh)

# A′ coupling-tolerant merge train former — enabled per the s(N) go/no-go gate
# (reify esc-4455-16: GO at N=3; s(3)=0.962 ≫ 1/3, observed coupling-failure 0/104).
# Batches line-stackable merge-ready tasks into ONE full-scope merge verify to relieve
# the serial-queue backlog. Correctness is the same gate as single merges (the train tip
# is verified by verify.sh --scope all before advance). df tasks 1704-1708 landed the code.
merge_train_former_enabled: true
merge_train_coalesce_enabled: true  # dark_factory:1722; user-authorized 2026-06-10
merge_train_max_members: 3  # already the default; explicit per GO-N3

# Per-role turn budgets. Raising the architect budget is a direct response to
# silent max_turns exits on large-scope tasks (e.g. reify 1749): the architect
# now has headroom to verify premises and produce a plan without the CLI
# truncating mid-tool-call.
max_turns:
  architect: 120

# Per-role agent wall-clock timeout overrides (task 5157, 2026-07-08, Leo
# approved — verify-flakiness survey follow-up, esc-4827 class).
#
# Root cause (established by /deb; see the DF fix task "Working-regime
# progress-extended deadline + truthful ceiling-kill reporting", which
# SUPERSEDES this stopgap once landed): dark-factory kills agent runs at an
# ABSOLUTE per-role wall-clock ceiling regardless of progress
# (defaults.yaml timeouts: implementer/debugger=1200s, unblock_auto.
# timeout_seconds=600s). Reify's compile-heavy iterations routinely need
# >20min — verify alone is budgeted verify_command_timeout_secs=7200s above
# — so productive sessions with 26-100 transcript turns were killed mid-run
# and misreported as "error_empty_output, 0 turns": 200 such kills across
# 72 reify tasks since 2026-06-09, exhausting max_execute_iterations and
# landing complete work in BLOCKED/L2 (task 4827).
#
# implementer/debugger 1200 -> 7800 (verify's real 7200s budget + 600s
# headroom — see the 2026-07-09 amendment below); unblock_auto.
# timeout_seconds 600 -> 1800. Genuine startup wedges are still caught by
# the separate startup_grace_secs (120s, unchanged) — this only lengthens
# the leash on runs that have already proven liveness.
#
# 2026-07-09 review amendment (task 5157): two corrections from the first
# landing of this override.
# (1) implementer/debugger was originally set to 3600 with this comment
#     claiming it "matches reify's own verify_command_timeout_secs
#     budget" — that budget was actually bumped 3600 -> 7200 back on
#     2026-06-19 (see the verify_command_timeout_secs comment above), so
#     the cited figure was stale. 3600 left implementer/debugger UNDER the
#     real verify ceiling rather than equal to it: a verify call running
#     anywhere in the 3600-7200s range would still hit the role ceiling
#     first, reproducing the exact misreported-kill symptom this task
#     exists to fix. Corrected to 7800 so a verify call that runs right up
#     to its own timeout still has room to be reported before the role
#     ceiling also fires, instead of racing it.
# (2) architect is intentionally NOT covered by this override:
#     defaults.yaml already gives architect a 2400s ceiling (2x
#     implementer/debugger's pre-amendment 1200s default), architect
#     doesn't run the compile-heavy verify commands that are this task's
#     documented root cause, and it's separately bounded by reify's own
#     max_turns.architect=120 above. Revisit if architect sessions start
#     showing the same 0-turn misreported-kill signature.
#
# Load-once config (orchestrator.yaml has no hot-reload): takes effect at
# the next orchestrator restart. Do NOT restart mid-flight — land for the
# next quiet window, the same restart that activates the
# verify_clock_stop_heartbeat_idle_max bump (task 5156).
timeouts:
  implementer: 7800
  debugger: 7800

unblock_auto:
  timeout_seconds: 1800

# Scheduler v2 — eager parks, cross-tier preemption, owner-state GC sweep.
# Burn-in cycle complete in dark-factory; flipping on here to exercise the
# new anti-starvation path against reify's larger task tree.
fairness:
  scheduler_v2: true

# Starvation watchdog — raise the wall-clock TIME threshold from the 1800s (30min)
# package default to 24h (Leo, 2026-07-03). Rationale: _skip_count increments ~1/tick
# (~15s), so the 50-skip count threshold is reached in well under an hour of normal
# broad-footprint lock contention (e.g. the reify-eval cluster) — not a real stall.
# Firing an INFO/L2 starvation escalation that fast is noise; a genuine wedge shows as
# 24h+ continuous eligibility. enabled/skip_threshold kept explicit so a shallow config
# merge can't silently disable the watchdog or reset the count threshold. Loads at next
# orchestrator restart (orchestrator.yaml is load-once, no hot-reload).
starvation_watchdog:
  enabled: true
  skip_threshold: 50
  idle_secs: 86400.0

# ── Lever C (multi-host post-merge verify) — ENABLED 2026-06-10 ───────────────
# leo-laptop is a second verify host. Parity-proven 5/5 (dark-factory
# docs/verdict-parity-report.md, 2026-06-10); the operator enable path landed via
# df task 1716 (merge 26894cceec). Schema RECONCILED to the landed
# VerifyRunnerConfig + verify_drift_check_every_n_lands — the staged proposal's
# `drift_check_every_n_lands` key would have been silently dropped (extra='ignore').
# K = 1 + enabled runners = 2 (LocalRunner trust-anchor on the workstation +
# leo-laptop). Fail-safe: an unreachable laptop falls back to local, never stalls.
verify_runners:
  - name: laptop
    ssh_host: leo-laptop
    git_remote: leo-laptop
    config_path: /home/leo/.config/orchestrator/reify-laptop.yaml
    enabled: true
verify_drift_check_every_n_lands: 20
#
# sccache shared backend (κ): both hosts share a redis cache so the laptop free-rides
# the workstation's warm compilation artifacts. ENABLED 2026-06-10 alongside the C enable.
# Requires the workstation sccache server to be (re)started with this backend (the running
# server's backend is fixed at start). Correctness: sccache is input-hashed (caches
# compilation, not verdicts); the drift detector (every 20 lands) is the standing fidelity
# guarantee for this env change (the D6 parity was proven pre-sccache).
sccache:
  enabled: true
  backend_env:
    SCCACHE_REDIS: redis://leo-workstation.tailb08a6b.ts.net:6380
# ──────────────────────────────────────────────────────────────────────────────

# Trailing-24h spend ceiling. Default $200 was a backstop from before the
# multi-account failover landed — with Anthropic's per-account caps as the
# real spend governor, the orch-level dollar guard just trips during normal
# operation. Raised to effectively-disabled. The watcher ceiling
# (watcher_daily_cost_ceiling_usd, default $50) ALSO tripped during the
# 2026-06-20 warm-lane-outage AFK window: cost_ceiling_watcher_exceeded ->
# pause_scheduler, which halted BOTH task dispatch AND the L1 auto-watcher for
# hours. Per-account caps are the real governor, so this guard only false-trips
# during normal long operation. Raised to effectively-disabled too (Leo: "it's
# never run away, just let it work").
orch_daily_cost_ceiling_usd: 10000.0
watcher_daily_cost_ceiling_usd: 10000.0

# Usage cap / multi-account failover
# 6 automation accounts (G→F→E→C→B→D); A reserved for interactive (eval runners
# inject A dynamically via USAGE_ACCOUNTS_FILE override). Authoritative pool list:
# config/usage-accounts.yaml.
# When one account hits its cap, UsageGate rotates to the next in list order.
usage_cap:
  enabled: true
  wait_for_reset: true
  probe_interval_secs: 300
  max_probe_interval_secs: 1800
  accounts_file: "${USAGE_ACCOUNTS_FILE:/home/leo/src/reify/config/usage-accounts.yaml}"

# Fused memory HTTP server (systemd service on port 8002)
fused_memory:
  url: "http://127.0.0.1:8002"
  project_id: "reify"
  server_command: []

# Sandbox (disabled — bwrap uid map broken on this kernel)
sandbox:
  enabled: false

# Escalation
escalation:
  queue_dir: "data/escalations"
  port: 8100

# Git
git:
  main_branch: "main"
  branch_prefix: "task/"
  remote: "origin"
  worktree_dir: ".worktrees"
  # Persistent warm merge-verify worktree (dark_factory:1692 = warmer-builds PRD κ).
  # Reuse a FIXED .worktrees/_merge-verify with target/ retained across the serial
  # (_MERGE_AHEAD_BOUND=1) merge-verify attempts → ~90→~25-35m typical, -60-80% CPU-s.
  # Activated 2026-06-10 (deb red-main-livelock follow-up). Trivially revertible (set false).
  persistent_merge_worktree: true
  # Merge-speculation warm-lane pool (PRD §9.5 B9 / dark-factory η #1789). The
  # persistent _merge-verify above only warms the SINGLE serial head; under Lever C
  # (K = 1 + enabled_verify_runners = 2) the speculative/gate_reverify verifies fell
  # through acquire_spec_lane's cold fallback to throwaway _merge-<hash> worktrees
  # (empty target/ → full ~2h cold build), monopolising both merge hosts and backing
  # the queue up (deb 2026-07-01). Enabling this routes those verifies to K CoW-seeded
  # _spec-{0..K-1} warm lanes instead. K is ONE sizing source, not two: the same
  # _MERGE_AHEAD_BOUND already declared by warm_lane_pool.merge_spec_pool_size_source
  # above — harness.py's `_speculation_k` reads that one value; it is not a second,
  # independent knob. Cold-fallback-safe (inv.6) and trivially revertible (set false =
  # byte-identical to prior behaviour). Prereqs met: warm_lane_pool live (#4665), Lever C on.
  merge_spec_warm_lane_pool: true
  # Off-lane detective (PRD §10 inv.6b): periodically re-verify a landed commit COLD and
  # compare test-level vs the warm result; divergence fires a born-at-L2 alarm naming the
  # commit + diverging tests. Cadence left at dark-factory defaults (every 40 lands OR nightly).
  warm_verify_shadow_compare: true
  # Main-gate sanction handshake (task 4367 step 1; dark_factory:1678 wired the
  # orchestrator side). advance_main runs main_gate_mark_command BEFORE its CAS
  # update-ref, so the reify reference-transaction hook records the orchestrator
  # merge worker's ~28 landings/day as `sanctioned` (not UNSANCTIONED) in
  # reify-main-gate.log. The sentinel path matches hooks/main-gate-lib.sh.
  # Enforcement stays OFF (warn-only) — this only populates the re-observe
  # window (4367 step 3); the durable ENFORCE flip is 4367 step 4.
  main_gate_mark_command: 'touch "$(git rev-parse --git-common-dir)/reify-main-gate-ok"'
  main_gate_unmark_command: 'rm -f "$(git rev-parse --git-common-dir)/reify-main-gate-ok"'
  # Warm-lane base location (DA3/DA4, task 4696 R3).
  # The gen-dir base lives at an XFS sibling of worktrees/ so DF's worktree prune
  # never touches it (it is OUTSIDE worktree_base).  Mount /home/leo/src/warm-lanes
  # is provision-warm-lane-fs.sh's _default_mount for project_root=/home/leo/src/reify.
  # ACTIVATED 2026-06-20 (#4665 deploy): worktree_base relocated onto the XFS reflink
  # mount (.worktrees → /home/leo/src/warm-lanes/worktrees, a symlink; DA1/DA2), the gen-dir
  # base lives at the XFS sibling below, and the pool is enabled. NOTE: verify_command_timeout_secs
  # is intentionally LEFT at 7200 here — it is reverted to the 1800 default only after a warm
  # first-verify is confirmed (the base self-seeds via refresh_warm_base over the first merge cycle).
  warm_lane_base_target_dir: "/home/leo/src/warm-lanes/base/target"
  warm_lane_pool: true   # #4665: enable the warm-lane CoW pool (task-dispatch lanes on XFS reflink)

# Project root (absolute path)
project_root: "/home/leo/src/reify"
