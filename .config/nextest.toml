# cargo-nextest configuration for Reify.
#
# LIVE (task 4503/γ, updated task 4621): occt test-group cap is host-relative,
# env-driven via REIFY_OCCT_NEXTEST_MAX_THREADS (explicit override, wins verbatim)
# or derived as min(HARD_CAP=24, nproc[, ram_bound]) when unset.
# scripts/gen-nextest-config.sh generates a temp copy of this file with the occt
# cap rewritten to the resolved value; verify.sh passes it as `--config-file <tmp>`
# on the NEXTEST=1 branch.  nextest `--config` overrides CARGO config only
# (NO-OP for test-groups — verified on 0.9.136).
# The in-file literal '24' below is the sed-template fallback (hard-cap ceiling).
#
# Headroom basis (task 4503/γ, supersedes task 4451 §d basis; AMENDED task 5984):
#   32-core / 125 GiB host; held-slot semaphore (task β/4502) bounds concurrent
#   verify runs to ≤2 (1 task slot at default N=1 + 1 exempt merge); worst case
#   2 × 24 OCCT × ~2 GiB = 96 GiB < 125 GiB → guaranteed no swap.  See
#   docs/notes/multi-process-occt-bench.md §d for full evidence.
#   AMENDMENT (task 5984, SUPERSEDED by task 6018): task 5984 recorded that
#   "cap 24 stays below nproc=32 global so it remains a real backstop" had
#   become FALSE, because [profile.default] test-threads then bounded the
#   GLOBAL pool at min(16, nproc) and a group cap of 24 could never bind.
#   Task 6018 un-narrowed that global: HARD_CAP now DEFAULTS to the resolved
#   host nproc, so the pool resolves to 32 here — ABOVE the group cap of 24.
#   The original sentence is therefore TRUE AGAIN and the arithmetic above
#   stands unmodified: the occt group binds at 24, its effective memory bound
#   is back to 24 × ~2 GiB = 48 GiB per run, and the ≤2-concurrent-verify
#   worst case is the 96 GiB < 125 GiB figure computed above — not the 32 GiB
#   that task 5984's narrowing had produced.  The group is a GENUINE BACKSTOP,
#   not dead config subsumed by a tighter global; Test 17i in
#   tests/infra/test_occt_gated_scope.sh pins that ordering (global > group on
#   this host class) so it cannot silently invert again.  Do not remove it.
#
# The OCCT-touching crates (reify-kernel-occt, reify-eval, reify-cli,
# reify-config — authoritative list: scripts/occt-touching-crates.txt) are
# routed through this group by the [[profile.default.overrides]] filter below.
# scripts/cargo-test-occt-gated.sh is kept as a standalone/manual OCCT runner
# but is NO LONGER invoked by verify.sh.

[test-groups]
occt = { max-threads = 24 }

# Default per-test slow-timeout/terminate-after ceiling (task 5141): bounds
# ANY hung test with by-name attribution well under the 60-minute pass-level
# wall (scripts/verify.sh: `timeout --kill-after=60 60m`, which on expiry
# kills the whole nextest process tree as exit 124 with ZERO per-test
# attribution — the task 4877/4878 failure shape). 120s x 10 = 1200s (20 min).
# The 5 known-slow "heavy" binaries below carry their own larger ceiling
# inline on their existing [[profile.default.overrides]] blocks (task 5141) —
# nextest resolves each override SETTING by first-match independently, so
# they do not fall through to this default.
# DELIBERATE: no `retries` key here or anywhere in this file. A retry would
# re-run and mask the very hangs/flakes this ceiling exists to attribute and
# kill (task invariant — regression-guarded by test_occt_gated_scope.sh).
# OPERATIONAL CAVEAT: this 1200s ceiling applies to every test with no more
# specific override. A future test that legitimately needs >20 minutes MUST
# be given its own [[profile.default.overrides]] slow-timeout (mirroring the
# 5 heavy-binary blocks below) — otherwise nextest will SIGTERM it at 1200s
# indistinguishable in the log from a genuine hang. There is no automated
# check that the heavy-binary list stays complete; this comment is that
# guard until one exists.
[profile.default]
slow-timeout = { period = "120s", terminate-after = 10 }

# Global test-thread pool cap (task 5984).
#
# WHY THIS KEY EXISTS AT ALL: cargo-nextest defaults the global pool to the
# host's logical CPU count, so without this key every crate outside the `occt`
# test-group — reify_lsp, reify-syntax, reify-compiler, the GUI Rust tests —
# runs in a pool nothing in this file bounds.  The key is retained as the
# CONTROL POINT (with REIFY_NEXTEST_TEST_THREADS and
# REIFY_NEXTEST_TEST_THREADS_HARD_CAP as its knobs) even though, as of task
# 6018, its default no longer narrows anything below nproc.
#
# WHAT IT BOUNDS, HONESTLY: one `cargo nextest run` — never the host.  The
# host-wide arithmetic, corrected task 6018:
#   REIFY_TEST_SEMAPHORE_CONCURRENCY is 1, not the 2 an earlier draft of this
#   paragraph cited (dropped 2 -> 1 in dark-factory commit 712e6230d6 and
#   hot-reloaded; dark-factory-orchestrator.yaml:331).  With one task slot plus
#   the merge role's bypass (scripts/lib_test_semaphore.sh:91 — DF_VERIFY_ROLE
#   = merge skips acquisition entirely), the reachable steady state is
#   2 × test-threads: ~32 before task 6018, ~64 after.
#
# THE OBSERVATION THAT MOTIVATED THE ORIGINAL CAP, kept with its caveat intact:
# 23 concurrent reify_lsp test binaries from a SINGLE warm lane during a
# load-276 spike.  ATTRIBUTION WAS NOT MEASURED — that spike was never shown to
# be caused by the unbounded nextest pool rather than by concurrent compile
# jobs, and un-narrowing the pool may reintroduce whatever pressure it
# represented.  If it does, the right response is a MEASUREMENT
# (scripts/sample-test-binary-concurrency.sh reports the host-wide peak of
# confirmed test binaries), not a re-guess at a ceiling.
#
# ANY BOUND ON THIS KEY IS ABOUT RUNQUEUE DEPTH — **NOT** MEMORY.  Stated
# explicitly with its counter-evidence so nobody "helpfully" adds a RAM term
# here later for consistency with the occt cap above:
#   - orchestrator-reify.service holds 25.3 GiB memory.current against only
#     3.6 GiB anon — the remainder is reclaimable cargo page cache.
#   - a live df-verify-reify-*.scope measured 25.4 GiB current / 0.1 GiB anon.
# Reify's test footprint is not the problem; runqueue depth is.  The occt cap's
# RAM term is asymmetric ON PURPOSE: OCCT threads really do carry ~2 GiB of
# anon each (docs/notes/multi-process-occt-bench.md); ordinary Rust test
# binaries do not.
#
# NO SYMMETRY ARGUMENT — DO NOT REINTRODUCE ONE, IN EITHER DIRECTION.
# This key was set to 16 to match what was then believed to be the
# dark-factory half's pytest `-n 16`, on the reasoning that a fleet's share of
# a saturated host is proportional to its runnable-thread count so an
# asymmetric pair of caps merely transfers share.  Task 6018 deleted that
# argument as WRONG FOR A CARGO-NEXTEST POOL, and it must not survive in any
# form — including re-parameterised to a new number, or mirrored as a
# counter-symmetry claim.
#
# AND THE BORROWED NUMBER WAS NEVER EVEN THE SIBLING'S NUMBER — a second,
# independent reason not to reason from it.  Re-measured first-hand during task
# 6018's review-amendment pass, against the dark-factory task record and its
# two pyprojects rather than from memory:
#   - dark_factory:3589's target is `-n 8`, NOT `-n 16`.  Its own description
#     records the operator decision (Leo, 2026-08-03) as "supersedes the
#     original -n 16 proposal", on memory grounds (446 MB RSS per xdist worker)
#     plus a measured CPU-seconds ladder.  reify's `test-threads = 16` was
#     authored 2026-08-03 12:12:55 +0100 — i.e. the sibling's value had ALREADY
#     been corrected away from 16 by the time this file cited it.
#   - dark-factory is not running 16 today either: 3589 is still `pending` and
#     both `orchestrator/pyproject.toml` and `fused-memory/pyproject.toml` still
#     carry `-n auto`, which resolves to 32 on this 32-core host (psutil absent,
#     so xdist falls back to os.cpu_count()).
# So a reader must NOT come away believing dark-factory runs at 16.  It runs at
# 32 and is targeting 8.  Do not "restore symmetry" against any of those three
# numbers; the mechanism argument below is the whole reason, and the sibling's
# value is not evidence about this one even when correctly quoted.
#
# THE ACTUAL MECHANISM the borrowed number came from: under pytest-xdist EVERY
# worker RE-COLLECTS the whole suite before running anything — a fixed cost of
# roughly 19.4 CPU-seconds per worker, so ~620 CPU-seconds of purely redundant
# collection at 32 workers.  Halving the worker count there deletes half of a
# real, measured, per-worker overhead.
#
# cargo-nextest has NO ANALOGUE.  It executes pre-built test binaries; there is
# no per-thread collection phase, so a thread costs nothing until it runs a
# test and narrowing the pool buys none of that saving while costing wall-clock
# directly.  The CPU-seconds argument simply does not transfer between the two
# runners, and a shared number was never evidence of a shared mechanism.
#
# The two fleets are now explicitly DECOUPLED: the dark-factory side proceeds
# on its own memory and collection-cost grounds, and reify's pool stands on its
# own.  Neither should cite the other's number as a reason.
#
# KEY-NAME HAZARD — the highest-risk failure mode of this key.  nextest 0.9.136
# does NOT deny unknown config keys: it emits
#   warning: in config file .config/nextest.toml, ignoring unknown
#            configuration key: profile.default.<key>
# and silently continues.  A misspelling (`test_threads`, `test-thredz`) fails
# OPEN — the pool stays uncapped with no error anywhere.  Verified on 0.9.136
# that the exact hyphenated spelling `test-threads` produces no such warning
# while `test-thredz` does.  Same "verified once on 0.9.136" convention this
# file already uses for the `--config`-is-a-NO-OP-for-test-groups note above.
#
# The in-file literal '32' is the SED-TEMPLATE FALLBACK — the reference-host
# nproc placeholder — mirroring the "in-file literal '24'" convention for the
# occt cap above.  It is NOT a narrowing ceiling: scripts/gen-nextest-config.sh
# rewrites this line to the host-resolved min(HARD_CAP, nproc) for every verify
# pass (verify.sh passes the generated file as `--config-file`), and HARD_CAP
# itself now defaults to that same resolved nproc, so the generated config is
# the host-relative one and applies no ceiling below what nextest would pick.
#
# CONSEQUENCE ON A SMALLER HOST — read this before copying the file: a bare
# `cargo nextest run` that bypasses verify.sh gets this literal VERBATIM, i.e.
# 32, rather than that host's own CPU count.  On an 8-core box that is a 4x
# oversubscription.  Use the generated config there —
#   cfg=$(scripts/gen-nextest-config.sh); cargo nextest run --config-file "$cfg"
# — or set REIFY_NEXTEST_TEST_THREADS explicitly.  Every verify path already
# does the former, so this affects the manual dev-convenience path only.
#
# A BARE INTEGER is retained rather than nextest's host-relative
# `test-threads = "num-cpus"` — and this is a KNOWN WART, tracked as #6374, not
# a defended design.  State the objection in full so nobody has to rediscover
# it:
#
#   "num-cpus" is the FAITHFUL expression of what task 6018 actually wants.
#   nextest's own default with this key ABSENT is exactly the host CPU count on
#   every host, which is the stated intent ("no ceiling below what nextest
#   would pick on its own").  The only reason the template carries a fixed 32
#   instead is that gen-nextest-config.sh substitutes on the anchor
#   `^test-threads = [0-9][0-9]*$`, Test 17k pins that exactly one line matches
#   it, and Test 17b extracts with match($0,/[0-9]+/) — all three assume a bare
#   integer, so the TEST SCAFFOLDING is what pins the production value on hosts
#   the 32-core reference host does not resemble.  A quoted string breaks the
#   anchor (the substitution silently no-ops) and empties 17b's extraction.
#   That is a real inversion of concerns and it is why #6374 exists; the anchor
#   and Tests 17a/17b/17k (and 17l, which compares the literal against
#   gen-nextest-config.sh's `${_nproc:-N}` fallback) must all move in ONE commit
#   with it.
#
# WHAT THE WART DOES AND DOES NOT COST.  Nothing on any verify path: every one
# of them consumes the GENERATED config, whose value is host-resolved.  The
# blast radius is exactly the manual dev-convenience path described in the
# paragraph above, whose safe invocation is spelled out there.
#
# DELETING THE KEY IS NOT THE CHEAPER FIX — checked, not assumed.  The
# substitution rewrites this LINE; with the key absent there is nothing to
# rewrite, so BOTH REIFY_NEXTEST_TEST_THREADS and
# REIFY_NEXTEST_TEST_THREADS_HARD_CAP go dead and the control point this whole
# block documents disappears (Test 17b pins that it exists).  Making the manual
# path inherit nextest's default that way would cost the generator its only
# writable seam; the generator would have to INSERT the key instead of
# substituting it.  "num-cpus" keeps the seam and fixes the manual path, which
# is why #6374 goes that way and not this one.
#
# CLI PRECEDENCE: nextest's own `--test-threads` beats the config file, so
# verify.sh's `--test-threads=N` (task 5264, the dark-factory offline deep-test
# lane) still wins verbatim when passed.  This key changes only the UNSET
# default.  That precedence is also an UNGUARDED DEFEAT PATH — verify.sh
# forwards TEST_THREADS with nothing asserting the forwarded value against the
# value gen-nextest-config.sh resolved, so a stray export silently overrides
# everything documented above.  Inert by default (nothing sets it on the normal
# paths); deliberately out of scope for task 6018 and tracked as #6360.
test-threads = 32

# Pin the OCCT-touching packages to the `occt` group (max-threads = 24, env-driven).
# Kept in sync with scripts/occt-touching-crates.txt by hand (these are config
# literals, not shell). A drift here would let a crate escape the max-threads
# cap and run unbounded in the nextest pool — the drift-catcher in
# tests/infra/test_occt_gated_scope.sh catches this.
[[profile.default.overrides]]
filter = 'package(reify-kernel-occt) | package(reify-kernel-conformance) | package(reify-eval) | package(reify-cli) | package(reify-config)'
test-group = 'occt'

# LPT (Longest-Processing-Time-first) scheduling for the 5 heaviest test binaries.
# These dominate the branch-scope --include-infra makespan: a >180s straggler in
# tensegrity_t0a plus four other heavy-compute binaries collectively push the
# tail past the 1800s orchestrator wall (esc-4536-63, task #4627).
#
# nextest schedules higher-priority tests first (signed-8-bit range -100..100,
# default 0).  Starting the heaviest binary at t=0 lets it overlap the rest of
# the suite rather than dangling off the tail.
#
# tensegrity_t0a: top tier (priority = 100) — the >180s straggler that defines
#   the critical path; must start FIRST, before everything else.
# fea_diagnostics_e2e (reify-eval-fea-tests), representation_within_assertion
# (reify-eval), analytical_validation, determinism (reify-solver-elastic):
# secondary tier (priority = 50) — still schedule early but yield the first
#   slot to the straggler.
#
# Drift guard: tests/infra/test_nextest_slow_priority.sh asserts that each
# filter resolves to a real crates/<pkg>/tests/<bin>.rs on disk so a typo or
# file rename becomes a CI failure rather than a silent no-op.
#
# Coexistence: these priority overrides compose with the occt test-group cap
# above — reify-eval binaries are in both; priority controls ORDER (straggler
# grabs an occt slot first), the group cap controls CONCURRENCY.
# reify-solver-elastic is NOT in the occt group; its overrides are a pure win.
#
# gen-nextest-config.sh full-copy + anchored-sed preserves these blocks verbatim
# (the sed only rewrites the occt max-threads literal line).

# Tier 1 — the >180s straggler: priority = 100 (top tier).
# MUST start at t=0 to define the critical path and allow the rest of the suite
# to overlap it.  Priority 100 is the highest value in nextest's signed-8-bit
# -100..100 range; any other test can only match or be lower.
[[profile.default.overrides]]
filter = 'package(reify-eval) & binary(tensegrity_t0a)'
priority = 100
# Heavy-tail slow-timeout ceiling (task 5141): 120s x 15 = 1800s (30 min),
# larger than the 1200s/20min [profile.default] ceiling above — sized to
# clear the worst legitimate straggler here (>180s even at ~8x load ≈1440s
# < 1800s) — while still bounding a true hang well under the 3600s (60m)
# verify.sh pass-level wall. nextest resolves each override SETTING
# (priority, slow-timeout) by first-match independently, so this ceiling is
# unaffected by both this block's own `priority` value and the earlier occt
# test-group override.
slow-timeout = { period = "120s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'package(reify-eval-fea-tests) & binary(fea_diagnostics_e2e)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'package(reify-eval) & binary(representation_within_assertion)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'package(reify-solver-elastic) & binary(analytical_validation)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'package(reify-solver-elastic) & binary(determinism)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 15 }
