# cargo-nextest configuration for Reify.
#
# LIVE (task 4503/γ, updated task 4621): occt test-group cap is host-relative,
# env-driven via REIFY_OCCT_NEXTEST_MAX_THREADS (explicit override, wins verbatim)
# or derived as min(HARD_CAP=24, nproc[, ram_bound]) when unset.
# scripts/gen-nextest-config.sh generates a temp copy of this file with the occt
# cap rewritten to the resolved value; verify.sh passes it as `--config-file <tmp>`
# on the NEXTEST=1 branch.  nextest `--config` overrides CARGO config only
# (NO-OP for test-groups — verified on 0.9.136).
# The in-file literal '24' below is the sed-template fallback (hard-cap ceiling).
#
# Headroom basis (task 4503/γ, supersedes task 4451 §d basis; AMENDED task 5984):
#   32-core / 125 GiB host; held-slot semaphore (task β/4502) bounds concurrent
#   verify runs to ≤2 (1 task slot at default N=1 + 1 exempt merge); worst case
#   2 × 24 OCCT × ~2 GiB = 96 GiB < 125 GiB → guaranteed no swap.  See
#   docs/notes/multi-process-occt-bench.md §d for full evidence.
#   AMENDMENT (task 5984, SUPERSEDED by task 6018): task 5984 recorded that
#   "cap 24 stays below nproc=32 global so it remains a real backstop" had
#   become FALSE, because [profile.default] test-threads then bounded the
#   GLOBAL pool at min(16, nproc) and a group cap of 24 could never bind.
#   Task 6018 un-narrowed that global: HARD_CAP now DEFAULTS to the resolved
#   host nproc, so the pool resolves to 32 here — ABOVE the group cap of 24.
#   The original sentence is therefore TRUE AGAIN and the arithmetic above
#   stands unmodified: the occt group binds at 24, its effective memory bound
#   is back to 24 × ~2 GiB = 48 GiB per run, and the ≤2-concurrent-verify
#   worst case is the 96 GiB < 125 GiB figure computed above — not the 32 GiB
#   that task 5984's narrowing had produced.  The group is a GENUINE BACKSTOP,
#   not dead config subsumed by a tighter global; Test 17i in
#   tests/infra/test_occt_gated_scope.sh pins that ordering (global > group on
#   this host class) so it cannot silently invert again.  Do not remove it.
#
# The OCCT-touching crates (reify-kernel-occt, reify-eval, reify-cli,
# reify-config — authoritative list: scripts/occt-touching-crates.txt) are
# routed through this group by the [[profile.default.overrides]] filter below.
# scripts/cargo-test-occt-gated.sh is kept as a standalone/manual OCCT runner
# but is NO LONGER invoked by verify.sh.

[test-groups]
occt = { max-threads = 24 }

# Default per-test slow-timeout/terminate-after ceiling (task 5141): bounds
# ANY hung test with by-name attribution well under the 60-minute pass-level
# wall (scripts/verify.sh: `timeout --kill-after=60 60m`, which on expiry
# kills the whole nextest process tree as exit 124 with ZERO per-test
# attribution — the task 4877/4878 failure shape). 120s x 10 = 1200s (20 min).
# THREE TIERS of ceiling live in this file (task 6485):
#   - default (here): 1200s = 120s x 10. Everything with no more specific
#     override.
#   - gate-resident: 1800s = 120s x 15, on the two blocks that DO run on the
#     merge gate — representation_within_assertion (LPT tier 50) and
#     solve_elastic_static_body_e2e (task 7339, contention headroom rather than
#     intrinsic slowness; see that block's own comment). Both must stay strictly
#     under the 3600s pass-level wall.
#   - heavy: 2520s = 120s x 21, on all 8 members of
#     REIFY_HEAVY_NEXTEST_FILTER (scripts/heavy-test-filter-lib.sh). Was 43200s
#     (12h) until task 7552, which measured the heavy set for the first time and
#     re-sized the tier from that measurement: worst per-test cost 545.2s in
#     DEBUG and 545.0s in RELEASE — the same test, and this tier governs both
#     profiles — over 2 full runs each under natural host contention. The upper
#     bound is NOT the tightest heavy-running wall itself but that wall MINUS
#     the measured seconds a pass takes to reach a heavy test; see the
#     tensegrity_t0a block below for why those are different numbers. Evidence:
#     docs/notes/heavy-test-per-test-duration-measurement.md.
# nextest resolves each override SETTING by first-match independently, so none
# of these falls through to this default.
#
# WHAT REIFY_GATE_EXCLUDE_HEAVY DOES AND DOES NOT DECIDE: setting it decides
# NOTHING by itself — verify.sh scopes its EFFECT to the task and merge roles, so
# those two plus the sanctioned manual-land path do not run heavy members, while
# offline and background do. "No gate path runs heavy members" is FALSE, and is
# what this comment claimed until task 6485. The full argument — which wall binds
# which role, how the ceiling is derived, why 13h still exists and the
# alternatives rejected for this re-size — is normative in ONE place:
# docs/prds/offline-deep-test-lane.md DA6. Do not restate it here.
# DELIBERATE: no `retries` key here or anywhere in this file. A retry would
# re-run and mask the very hangs/flakes this ceiling exists to attribute and
# kill (task invariant — regression-guarded by test_occt_gated_scope.sh).
# OPERATIONAL CAVEAT: this 1200s ceiling applies to every test with no more
# specific override. A future test that legitimately needs >20 minutes MUST be
# given its own [[profile.default.overrides]] slow-timeout — otherwise nextest
# will SIGTERM it at 1200s, indistinguishable in the log from a genuine hang.
# Adding one is enough; classifying it is not optional. Until task 6485 this
# comment WAS the completeness guard. It no longer has to be: Assertions J/K/L in
# tests/infra/test_nextest_slow_priority.sh derive the heavy set and the role
# walls from their own sources and red on any override that classifies as
# neither heavy nor gate-resident.
#
# ACCEPTED RESIDUAL — NONE. Task 7552 retired all three paths that used to be
# listed here (a bare `cargo nextest run`; a manual scripts/verify.sh run with
# REIFY_GATE_EXCLUDE_HEAVY unset; DF_VERIFY_ROLE=background, the main-tip cadence
# sweep). They closed together and for one reason: the ceiling now sits below
# every wall verify.sh defines, so it is the binding bound wherever a wall exists
# and a bare run has no wall for it to be unreachable under. Reachability is
# mechanised, not asserted — Assertion L in
# tests/infra/test_nextest_slow_priority.sh derives every role's binding wall
# from verify.sh and reds on any role the ceiling does not fit under.
#
# The CONTRACT survives the list, and is the live instruction for a future
# residual: a role is allowed to be unreachable only if it is named BOTH in this
# paragraph and in that test's L_RESIDUAL_ROLES allowlist, and L reds when either
# outlives the other. Name such a role here, in this paragraph, by role name.
[profile.default]
slow-timeout = { period = "120s", terminate-after = 10 }

# Global test-thread pool cap (task 5984).
#
# WHY THIS KEY EXISTS AT ALL: cargo-nextest defaults the global pool to the
# host's logical CPU count, so without this key every crate outside the `occt`
# test-group — reify_lsp, reify-syntax, reify-compiler, the GUI Rust tests —
# runs in a pool nothing in this file bounds.  The key is retained as the
# CONTROL POINT (with REIFY_NEXTEST_TEST_THREADS and
# REIFY_NEXTEST_TEST_THREADS_HARD_CAP as its knobs) even though, as of task
# 6018, its default no longer narrows anything below nproc.
#
# WHAT IT BOUNDS, HONESTLY: one `cargo nextest run` — never the host.  The
# host-wide arithmetic, corrected task 6018:
#   REIFY_TEST_SEMAPHORE_CONCURRENCY is 1, not the 2 an earlier draft of this
#   paragraph cited (dropped 2 -> 1 in dark-factory commit 712e6230d6 and
#   hot-reloaded; dark-factory-orchestrator.yaml:331).  With one task slot plus
#   the merge role's bypass (scripts/lib_test_semaphore.sh:91 — DF_VERIFY_ROLE
#   = merge skips acquisition entirely), the reachable steady state is
#   2 × test-threads: ~32 before task 6018, ~64 after.
#
# THE OBSERVATION THAT MOTIVATED THE ORIGINAL CAP, kept with its caveat intact:
# 23 concurrent reify_lsp test binaries from a SINGLE warm lane during a
# load-276 spike.  ATTRIBUTION WAS NOT MEASURED — that spike was never shown to
# be caused by the unbounded nextest pool rather than by concurrent compile
# jobs, and un-narrowing the pool may reintroduce whatever pressure it
# represented.  If it does, the right response is a MEASUREMENT
# (scripts/sample-test-binary-concurrency.sh reports the host-wide peak of
# confirmed test binaries), not a re-guess at a ceiling.
#
# ANY BOUND ON THIS KEY IS ABOUT RUNQUEUE DEPTH — **NOT** MEMORY.  Stated
# explicitly with its counter-evidence so nobody "helpfully" adds a RAM term
# here later for consistency with the occt cap above:
#   - orchestrator-reify.service holds 25.3 GiB memory.current against only
#     3.6 GiB anon — the remainder is reclaimable cargo page cache.
#   - a live df-verify-reify-*.scope measured 25.4 GiB current / 0.1 GiB anon.
# Reify's test footprint is not the problem; runqueue depth is.  The occt cap's
# RAM term is asymmetric ON PURPOSE: OCCT threads really do carry ~2 GiB of
# anon each (docs/notes/multi-process-occt-bench.md); ordinary Rust test
# binaries do not.
#
# NO SYMMETRY ARGUMENT — DO NOT REINTRODUCE ONE, IN EITHER DIRECTION.
# This key was set to 16 to match what was then believed to be the
# dark-factory half's pytest `-n 16`, on the reasoning that a fleet's share of
# a saturated host is proportional to its runnable-thread count so an
# asymmetric pair of caps merely transfers share.  Task 6018 deleted that
# argument as WRONG FOR A CARGO-NEXTEST POOL, and it must not survive in any
# form — including re-parameterised to a new number, or mirrored as a
# counter-symmetry claim.
#
# AND THE BORROWED NUMBER WAS NEVER EVEN THE SIBLING'S NUMBER — a second,
# independent reason not to reason from it.  Re-measured first-hand during task
# 6018's review-amendment pass, against the dark-factory task record and its
# two pyprojects rather than from memory:
#   - dark_factory:3589's target is `-n 8`, NOT `-n 16`.  Its own description
#     records the operator decision (Leo, 2026-08-03) as "supersedes the
#     original -n 16 proposal", on memory grounds (446 MB RSS per xdist worker)
#     plus a measured CPU-seconds ladder.  reify's `test-threads = 16` was
#     authored 2026-08-03 12:12:55 +0100 — i.e. the sibling's value had ALREADY
#     been corrected away from 16 by the time this file cited it.
#   - dark-factory is not running 16 today either: 3589 is still `pending` and
#     both `orchestrator/pyproject.toml` and `fused-memory/pyproject.toml` still
#     carry `-n auto`, which resolves to 32 on this 32-core host (psutil absent,
#     so xdist falls back to os.cpu_count()).
# So a reader must NOT come away believing dark-factory runs at 16.  It runs at
# 32 and is targeting 8.  Do not "restore symmetry" against any of those three
# numbers; the mechanism argument below is the whole reason, and the sibling's
# value is not evidence about this one even when correctly quoted.
#
# THE ACTUAL MECHANISM the borrowed number came from: under pytest-xdist EVERY
# worker RE-COLLECTS the whole suite before running anything — a fixed cost of
# roughly 19.4 CPU-seconds per worker, so ~620 CPU-seconds of purely redundant
# collection at 32 workers.  Halving the worker count there deletes half of a
# real, measured, per-worker overhead.
#
# cargo-nextest has NO ANALOGUE.  It executes pre-built test binaries; there is
# no per-thread collection phase, so a thread costs nothing until it runs a
# test and narrowing the pool buys none of that saving while costing wall-clock
# directly.  The CPU-seconds argument simply does not transfer between the two
# runners, and a shared number was never evidence of a shared mechanism.
#
# The two fleets are now explicitly DECOUPLED: the dark-factory side proceeds
# on its own memory and collection-cost grounds, and reify's pool stands on its
# own.  Neither should cite the other's number as a reason.
#
# KEY-NAME HAZARD — the highest-risk failure mode of this key.  nextest 0.9.136
# does NOT deny unknown config keys: it emits
#   warning: in config file .config/nextest.toml, ignoring unknown
#            configuration key: profile.default.<key>
# and silently continues.  A misspelling (`test_threads`, `test-thredz`) fails
# OPEN — the pool stays uncapped with no error anywhere.  Verified on 0.9.136
# that the exact hyphenated spelling `test-threads` produces no such warning
# while `test-thredz` does.  Same "verified once on 0.9.136" convention this
# file already uses for the `--config`-is-a-NO-OP-for-test-groups note above.
#
# THE TEMPLATE VALUE IS NEXTEST'S OWN HOST-RELATIVE `"num-cpus"` (task 6374,
# which replaced the bare integer 32 this line carried under task 6018).  It is
# NOT a narrowing ceiling: scripts/gen-nextest-config.sh rewrites this LINE to
# the host-resolved min(HARD_CAP, nproc) for every verify pass (verify.sh passes
# the generated file as `--config-file`), and HARD_CAP itself defaults to that
# same resolved nproc, so the generated config is the host-relative one and
# applies no ceiling below what nextest would pick.  Note this key therefore no
# longer shares the "in-file literal '24'" convention the occt cap above still
# uses — that one stays a bare integer and its sed anchor stays integer-only.
#
# ON A SMALLER HOST — a bare `cargo nextest run` that bypasses verify.sh gets
# this value VERBATIM, and `"num-cpus"` is exactly that host's own CPU count,
# identical to nextest's default with the key ABSENT.  So the manual path is now
# correct on any host, which is the whole point of the spelling.  What it does
# NOT give you are the reify-side knobs — the HARD_CAP ceiling, the explicit
# override, the >=1 clamp — so to apply those on that path still use either
#   cfg=$(scripts/gen-nextest-config.sh); cargo nextest run --config-file "$cfg"
# or REIFY_NEXTEST_TEST_THREADS.  Every verify path already does the former.
#
# HISTORY, so the change is not re-litigated: the template carried a bare
# integer until #6374 purely because the TEST SCAFFOLDING assumed one — the
# generator substituted on `^test-threads = [0-9][0-9]*$`, Test 17k pinned that
# exactly one line matched it, and Test 17b extracted with match($0,/[0-9]+/) —
# so a quoted string broke the anchor (the substitution silently no-ops, failing
# SAFE and therefore invisibly) and emptied the extraction.  That inversion of
# concerns was #6374's whole subject.  It was resolved by moving the anchor to
# the alternation `^test-threads = \("num-cpus"\|[0-9][0-9]*\)$` and re-pointing
# Tests 17a/17b/17k/17l in tests/infra/test_occt_gated_scope.sh in the SAME
# commit.  A half-done split — template moved, anchor not — already fails loudly
# rather than silently leaking the string into the config verify.sh consumes:
# every assert in the 17c-17j family reads a GENERATED config with a digits
# extractor that returns empty on the leaked string.  Measured on that state:
# 52 passed / 9 FAILED.  Verified on nextest 0.9.136 that this key accepts the
# string: a misspelt `"num-cpuz"` is rejected with `invalid value: string
# "num-cpuz", expected an integer or the string "num-cpus"`, so the accept is a
# real parse and not another instance of the fail-open hazard above.
#
# DELETING THE KEY IS NOT THE CHEAPER FIX — checked, not assumed.  The
# substitution rewrites this LINE; with the key absent there is nothing to
# rewrite, so BOTH REIFY_NEXTEST_TEST_THREADS and
# REIFY_NEXTEST_TEST_THREADS_HARD_CAP go dead and the control point this whole
# block documents disappears (Test 17b pins that it exists).  Making the manual
# path inherit nextest's default that way would cost the generator its only
# writable seam; the generator would have to INSERT the key instead of
# substituting it.  "num-cpus" keeps the seam and fixes the manual path, which
# is why #6374 went that way and not this one.
#
# CLI PRECEDENCE: nextest's own `--test-threads` beats the config file, so
# verify.sh's `--test-threads=N` (task 5264, the dark-factory offline deep-test
# lane) still wins verbatim when passed.  This key changes only the UNSET
# default.  That precedence is also an UNGUARDED DEFEAT PATH — verify.sh
# forwards TEST_THREADS with nothing asserting the forwarded value against the
# value gen-nextest-config.sh resolved, so a stray export silently overrides
# everything documented above.  Inert by default (nothing sets it on the normal
# paths); deliberately out of scope for task 6018 and tracked as #6360.
test-threads = "num-cpus"

# Pin the OCCT-touching packages to the `occt` group (max-threads = 24, env-driven).
# Kept in sync with scripts/occt-touching-crates.txt by hand (these are config
# literals, not shell). A drift here would let a crate escape the max-threads
# cap and run unbounded in the nextest pool — the drift-catcher in
# tests/infra/test_occt_gated_scope.sh catches this.
[[profile.default.overrides]]
filter = 'package(reify-kernel-occt) | package(reify-kernel-conformance) | package(reify-eval) | package(reify-cli) | package(reify-config)'
test-group = 'occt'

# LPT (Longest-Processing-Time-first) scheduling for the 5 heaviest test binaries.
# These dominate the branch-scope --include-infra makespan: a >180s straggler in
# tensegrity_t0a plus four other heavy-compute binaries collectively push the
# tail past the 1800s orchestrator wall (esc-4536-63, task #4627).
#
# nextest schedules higher-priority tests first (signed-8-bit range -100..100,
# default 0).  Starting the heaviest binary at t=0 lets it overlap the rest of
# the suite rather than dangling off the tail.
#
# tensegrity_t0a: top tier (priority = 100) — the >180s straggler that defines
#   the critical path; must start FIRST, before everything else.
# fea_diagnostics_e2e (reify-eval-fea-tests), representation_within_assertion
# (reify-eval), analytical_validation, determinism (reify-solver-elastic):
# secondary tier (priority = 50) — still schedule early but yield the first
#   slot to the straggler.
#
# Drift guard: tests/infra/test_nextest_slow_priority.sh asserts that each
# filter resolves to a real crates/<pkg>/tests/<bin>.rs on disk so a typo or
# file rename becomes a CI failure rather than a silent no-op.
#
# Coexistence: these priority overrides compose with the occt test-group cap
# above — reify-eval binaries are in both; priority controls ORDER (straggler
# grabs an occt slot first), the group cap controls CONCURRENCY.
# reify-solver-elastic is NOT in the occt group; its overrides are a pure win.
#
# gen-nextest-config.sh full-copy + anchored-sed preserves these blocks verbatim
# (the sed only rewrites the occt max-threads literal line).

# Tier 1 — the >180s straggler: priority = 100 (top tier).
# MUST start at t=0 to define the critical path and allow the rest of the suite
# to overlap it.  Priority 100 is the highest value in nextest's signed-8-bit
# -100..100 range; any other test can only match or be lower.
[[profile.default.overrides]]
filter = 'package(reify-eval) & binary(tensegrity_t0a)'
priority = 100
# Heavy-tier slow-timeout ceiling: 120s x 21 = 2520s, shared by all 8 members of
# REIFY_HEAVY_NEXTEST_FILTER (task 7552; was 43200s/12h, task 6485; 1800s/30min
# before that, task 5141).
#
# TWO ROLES run these binaries, not one. The offline deep lane is the path this
# tier was originally sized for, but DF_VERIFY_ROLE=background — dark-factory's
# main-tip cadence sweep — runs `--profile both --scope all` outside verify.sh's
# task|merge heavy-exclusion and so runs all 8 of them too. The claim this
# comment carried until task 7552, that offline "is the only path that runs these
# binaries — no gate path does", was false, and the 43200s ceiling it justified
# was 12x background's binding 3600s debug wall: a hang there degraded to a bare
# `timeout` exit 124 naming nothing.
#
# WHAT "REACHABLE" MEANS HERE, because the obvious reading is wrong and cost this
# tier one whole re-size. The wall above and this ceiling are measured on
# DIFFERENT CLOCKS: verify.sh's `timeout` wraps the combined build+execution
# pass and starts at PASS start, while nextest's terminate-after starts at
# TEST-PROCESS start. A ceiling merely SMALLER than the wall therefore attributes
# nothing — the pass has to be able to REACH the test first. 2520s is sized so
# background's 3600s debug wall clears it by 1080s, against a measured 1078.7s
# from `cargo nextest run` to the latest-starting heavy atom (build plus queue
# position). Offline clears it by 44280s. The first attempt at this re-size used
# `0.9 x wall` and landed 3240s, leaving 360s for a pass whose build alone is
# hundreds of seconds; it was reachable on paper only.
#
# STATE BOTH BOUNDS HONESTLY, as the task 7339 block at the end of this file
# does. The measured worst per-test cost across the heavy set is 545.2s in DEBUG
# and 545.0s in RELEASE — the same test at the same cost, which matters because
# this ceiling governs BOTH profiles and a release-only figure would have been
# standing in for a bound it never validated. 2520s is ~4.6x that worst observed
# run, and it is also a TIGHTER kill bound than the 43200s it replaces, so a
# heavy test that legitimately grows past ~2520s loses its margin sooner than
# before. Both measurements are 2 samples, not distributions, and the 1080s of
# reachability headroom is a two-sample max and not a guarantee: see
# docs/notes/heavy-test-per-test-duration-measurement.md before re-tuning, and
# docs/prds/offline-deep-test-lane.md DA6 for the derivation.
#
# nextest resolves each override SETTING (priority, slow-timeout) by first-match
# independently, so this ceiling is unaffected by both this block's own
# `priority` value and the earlier occt test-group override.
slow-timeout = { period = "120s", terminate-after = 21 }

[[profile.default.overrides]]
filter = 'package(reify-eval-fea-tests) & binary(fea_diagnostics_e2e)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 21 }

[[profile.default.overrides]]
filter = 'package(reify-eval) & binary(representation_within_assertion)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'package(reify-solver-elastic) & binary(analytical_validation)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 21 }

[[profile.default.overrides]]
filter = 'package(reify-solver-elastic) & binary(determinism)'
priority = 50
slow-timeout = { period = "120s", terminate-after = 21 }

# The four heavy-filter members that carry no LPT priority (task 6485). These
# were the completeness gap this task closed: all four are in
# REIFY_HEAVY_NEXTEST_FILTER but had no override block at all, so they fell
# through to [profile.default]'s 1200s ceiling — far below what the offline lane
# exists to allow.
#
# slow-timeout ONLY, no `priority` key: none of these was ever in the LPT tier,
# and adding one would silently change merge-gate scheduling — a distinct lever
# from a kill ceiling, out of scope here (the same reasoning the task 7339 block
# at the end of this file records for itself).
#
# Each `filter` value below is BYTE-IDENTICAL to its atom in
# REIFY_HEAVY_NEXTEST_FILTER (scripts/heavy-test-filter-lib.sh) with the outer
# parentheses stripped. That exact correspondence is what
# tests/infra/test_nextest_slow_priority.sh Assertion J checks, so a reworded
# filter that still means the same thing to nextest WILL fail there — by design,
# because the guard derives the heavy set from the lib rather than restating it.
#
# The two harness_fea_solver_e2e blocks are TEST-scoped, not binary-scoped: they
# share a package AND a binary with ~246 fast siblings, so a whole-binary
# override would hand those siblings a 12h ceiling too (esc-6368-2). Nothing
# earlier in this file sets slow-timeout for them — the occt test-group block
# sets only `test-group`, and nextest resolves each override SETTING by
# independent first-match.
[[profile.default.overrides]]
filter = 'package(reify-solver-elastic) & binary(modal_benchmarks)'
slow-timeout = { period = "120s", terminate-after = 21 }

[[profile.default.overrides]]
filter = 'package(reify-eval-fea-tests) & binary(buckling_smoke)'
slow-timeout = { period = "120s", terminate-after = 21 }

[[profile.default.overrides]]
filter = 'package(reify-eval) & binary(harness_fea_solver_e2e) & test(/^fea_in_the_loop_producer::/)'
slow-timeout = { period = "120s", terminate-after = 21 }

[[profile.default.overrides]]
filter = 'package(reify-eval) & binary(harness_fea_solver_e2e) & test(/^fea_bracket_minimize_mass_e2e::/)'
slow-timeout = { period = "120s", terminate-after = 21 }

# solve_elastic_static_body_e2e (reify-eval): NOT a 6th "intrinsically slow"
# heavy binary like the 5 above — its own history says otherwise. Across
# data/verify-logs/, 71 recorded PASS entries: min 40.216s, median 171.573s,
# max 527.959s. Task 5097's attempt-1 (HEAD=d8ea07a52072241e8217b0ccd57f4680b0fd9205,
# 2026-09-08, esc-5097-3) is the ONLY recorded TIMEOUT for this test ever, hit
# on the un-overridden [profile.default] 1200s ceiling while the host was
# under measured CPU oversubscription (/proc/loadavg 106.60-129.65 on 32
# cores, PSI cpu some avg10=65.72, a second full-workspace nextest run
# executing concurrently) — a branch that touches zero files under crates/,
# .config/ or scripts/, so the test itself did not regress. A same-commit,
# same-profile standalone rerun under similar contention passed at 615.418s.
# This test does perform TWO full builds (a two-case case plus a one-case
# control) versus the siblings' one, so ~2x their per-run cost is expected
# and is folded into the numbers above — it is not evidence of a 3rd,
# separate slow mode.
#
# So: this override buys CONTENTION headroom (task 7339, filed from
# esc-5097-3), not headroom for intrinsic cost in the sense the
# [profile.default] comment above anticipates ("A future test that
# legitimately needs >20 minutes"). Do not read the mere presence of this
# block as evidence the test is a genuine 20+-minute test; a future reader
# retuning these ceilings should treat its basis as distinct from the 5
# above. terminate-after = 15 (1800s) mirrors the sibling blocks' value.
# State both bounds honestly, since they diverge: ~3x headroom over the
# worst COMPLETED run (615s) even under contention, but only ~1.5x over the
# LOWER BOUND of the one observed timeout — esc-5097-3 was SIGTERMed at the
# prior 1200s ceiling, so its true demand under that contention is unknown
# and strictly greater than 1200s, and against that observation (not the
# completed-run figure) the new ceiling carries much thinner margin.
# Intentionally NOT going higher than 1800s regardless: raising
# terminate-after further would only widen the window before a genuine hang
# in this binary is attributed and killed (the exact problem task 5141
# introduced this per-test ceiling to fix). That widening is accepted here
# as the cost of absorbing contention; shrinking host oversubscription
# itself is a scheduler/capacity lever (task 5185, cancelled) and is out of
# scope. FOLLOW-UP SIGNAL: a second timeout at 1800s under similar
# contention means the contention lever, not this ceiling, is the
# remaining fix — do not respond to a repeat by raising terminate-after
# again.
#
# No `priority` key on this block, unlike the 5 LPT-tier siblings above:
# deliberately left at nextest's default (0) to keep this change a pure
# slow-timeout adjustment within task 7339's scope. This test's measured
# runtimes (median 171.573s, max up to 615s) would plausibly qualify it for
# the secondary LPT tier (priority = 50) as scheduling headroom against the
# same makespan pressure this override absorbs — see the LPT scheduling
