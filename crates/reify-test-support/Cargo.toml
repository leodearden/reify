[package]
name = "reify-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Test builders, fixtures, and mock implementations for Reify — plus a few helpers reify-audit consumes on its production path"

# Despite the crate NAME, this is not a test-only crate. Two publics are
# consumed on `reify-audit`'s PRODUCTION path — `ignore_hygiene::extract_ignore_reason`
# and `git_env::{REPO_REDIRECT_VARS, sanitize}` — which is why that crate carries
# this one as a normal dependency rather than a dev-dependency. Why they live
# here rather than above the edge, and the open question about the shape of the
# arrangement, are argued once in `sanitize`'s doc comment (src/git_env.rs);
# this note points there rather than restating it.

[dependencies]
reify-ast.workspace = true
reify-core.workspace = true
# Needed by the library body (not just this crate's tests): `mocks.rs`'s shared
# `ContainmentQuery` double (`MockContainmentQuery`) implements
# `reify_expr::ContainmentQuery` — the geometry-free trait that `EvalContext`
# carries. Hence a [dependencies] entry rather than a [dev-dependencies] one.
#
# Gated behind `containment-doubles` (see [features]; `eval-helpers` includes
# it) rather than left ungated, because `crates/reify-audit` carries
# reify-test-support as a NORMAL dependency: an ungated edge here drags
# reify-expr's whole closure (reify-stdlib → faer / nalgebra / gemm) into the
# audit binary's PRODUCTION build graph — measured at 130 crates gated vs 185
# ungated, i.e. 55 crates of pure compile cost for one three-line trait stub.
# That is precisely the re-evaluation reify-audit's own manifest comment asks
# for ("Re-evaluate if reify-test-support's deps grow significantly").
#
# The gate is free for `eval-helpers` consumers (that feature pulls reify-eval,
# which itself normal-deps reify-expr, so reify-expr was already in the graph).
# It is NOT free in general, and the cost is taken knowingly: `crates/reify-expr`
# dev-deps this crate with `features = ["containment-doubles"]` — the
# fine-grained gate that lets `tests/field_op_dispatch_tests.rs` see
# `MockContainmentQuery` without pulling reify-eval into reify-expr's own test
# graph (task #6322, follow-up to #6216).
#
# NOT GATE-ENFORCED: the 130-vs-185 figure above is a MEASUREMENT, not an
# invariant any verify-pipeline step asserts. Re-check in place with
#   cargo tree -p reify-audit --edges normal --prefix none | sort -u
# — expect 130 unique crates and zero reify-expr/faer/nalgebra/gemm lines.
# Durable guard + the regression vectors it must cover: task #7123.
reify-expr = { workspace = true, optional = true }
reify-ir.workspace = true
reify-syntax.workspace = true
reify-compiler.workspace = true
reify-eval = { workspace = true, optional = true }
reify-constraints = { workspace = true, optional = true }
serde_json.workspace = true
tracing.workspace = true
# Normal (not dev) dependency: `temp_dirs::prefixed_tempdir` is a PUBLIC fn
# returning `tempfile::TempDir`, which a dev-dependency cannot back. See the
# paired design decision — `crates/reify-audit` carries reify-test-support as a
# normal dependency (for the reason in the crate-level note above), so this
# makes tempfile a normal transitive dep there.
tempfile.workspace = true

[dev-dependencies]
reify-core.workspace = true
reify-ir.workspace = true

[features]
eval-helpers = ["dep:reify-eval", "dep:reify-constraints", "containment-doubles"]
# Fine-grained gate for the reify-expr edge alone (task #6322 follow-up to
# #6216): lets a reify-expr-side consumer (crates/reify-expr's dev-dep) pull
# in just `MockContainmentQuery` without dragging reify-eval into
# reify-expr's own test graph. `eval-helpers` includes it so today's
# consumers (which enable `eval-helpers`) are unaffected.
#
# Coverage gap (no workspace-wide invocation builds the containment-doubles-only
# configuration): tracked as the second item of task #7123.
containment-doubles = ["dep:reify-expr"]
