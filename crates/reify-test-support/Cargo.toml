[package]
name = "reify-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Test builders, fixtures, and mock implementations for Reify"

[dependencies]
reify-ast.workspace = true
reify-core.workspace = true
# Needed by the library body (not just this crate's tests): `mocks.rs`'s shared
# `ContainmentQuery` double (`MockContainmentQuery`) implements
# `reify_expr::ContainmentQuery` — the geometry-free trait that `EvalContext`
# carries. Hence a [dependencies] entry rather than a [dev-dependencies] one.
#
# Gated behind `containment-doubles` (see [features]; `eval-helpers` includes
# it) rather than left ungated, because `crates/reify-audit` carries
# reify-test-support as a NORMAL dependency: an ungated edge here drags
# reify-expr's whole closure (reify-stdlib → faer / nalgebra / gemm) into the
# audit binary's PRODUCTION build graph. Measured with
# `cargo tree -p reify-audit --edges normal --prefix none | sort -u | wc -l`
# (`--prefix none` matters — tree-drawing prefixes make the same crate at two
# depths two distinct lines): 130 crates gated vs 185 ungated, i.e. 55 crates of
# pure compile cost for one three-line trait stub. That is precisely the
# re-evaluation reify-audit's own manifest comment asks for ("Re-evaluate if
# reify-test-support's deps grow significantly").
#
# The gate is free for the double's `eval-helpers` consumers — reify-eval's
# `cell_eval_ctx`/`engine_edit` test modules already dev-depend on this crate
# with `features = ["eval-helpers"]`, and `eval-helpers` pulls `reify-eval`,
# which itself normal-deps `reify-expr`, so reify-expr was already in the graph
# under the feature.
#
# It is NOT free in general, and the cost is taken knowingly: a reify-expr-side
# consumer exists too. `crates/reify-expr` dev-deps this crate with
# `features = ["containment-doubles"]` (crates/reify-expr/Cargo.toml) — the
# fine-grained gate that lets `tests/field_op_dispatch_tests.rs` see
# `MockContainmentQuery` without pulling `eval-helpers`'s `reify-eval` edge
# into reify-expr's own test graph (task #6322, follow-up to #6216).
# Trade-off as taken: 55 crates off reify-audit's production graph, paid for
# with a two-feature split here.
#
# NOT GATE-ENFORCED. The 130-vs-185 figures above are a MEASUREMENT (re-verified
# on this branch: 130, with zero reify-expr/faer/nalgebra/gemm lines), not an
# invariant any verify-pipeline step asserts -- nothing reds if a later edit
# silently re-adds those 55 crates. Three regression vectors, none of which
# `cargo test --workspace` can see, because each one only *widens* a graph that
# still builds:
#   1. this `reify-expr` entry losing `optional = true`, making the edge
#      unconditional;
#   2. `containment-doubles` (or `eval-helpers`) reaching this crate's `default`
#      feature set -- reify-audit's normal dep on it would then enable it;
#   3. reify-audit gaining a NORMAL-edge consumer of either feature.
# One-line re-check -- expect 130 lines and no reify-expr/faer/nalgebra/gemm:
#   cargo tree -p reify-audit --edges normal --prefix none | sort -u
# The durable fix is a tests/infra guard modelled on
# tests/infra/test_fea_e2e_crate_occt_free.sh (same shape: walk `cargo tree`,
# assert a crate is absent). It is deliberately NOT landed with task #6322: a new
# tests/infra/test_*.sh needs a matching tests/infra/run-all-classification.manifest
# row or scripts/check-infra-classification-manifest.sh reds the build, and that
# manifest is outside #6322's lock set. Filed as follow-up instead.
reify-expr = { workspace = true, optional = true }
reify-ir.workspace = true
reify-syntax.workspace = true
reify-compiler.workspace = true
reify-eval = { workspace = true, optional = true }
reify-constraints = { workspace = true, optional = true }
serde_json.workspace = true
tracing.workspace = true
# Normal (not dev) dependency: `temp_dirs::prefixed_tempdir` is a PUBLIC fn
# returning `tempfile::TempDir`, which a dev-dependency cannot back. See the
# paired design decision — `crates/reify-audit` carries reify-test-support as a
# normal dependency, so this makes tempfile a normal transitive dep there.
tempfile.workspace = true

[dev-dependencies]
reify-core.workspace = true
reify-ir.workspace = true

[features]
eval-helpers = ["dep:reify-eval", "dep:reify-constraints", "containment-doubles"]
# Fine-grained gate for the reify-expr edge alone (task #6322 follow-up to
# #6216): lets a reify-expr-side consumer (crates/reify-expr's dev-dep) pull
# in just `MockContainmentQuery` without dragging reify-eval into
# reify-expr's own test graph. `eval-helpers` includes it so today's
# consumers (which enable `eval-helpers`) are unaffected.
#
# Coverage gap, recorded rather than closed: `cargo test --workspace` unifies this
# crate's features to `eval-helpers` U `containment-doubles`, so the
# containment-doubles-ONLY configuration is built only by a targeted invocation
# (`cargo test -p reify-expr`, or `cargo check -p reify-test-support --features
# containment-doubles` -- green as of task #6322). Wiring that third configuration
# into the verify pipeline's per-crate step is outside #6322's lock set. The gap is
# narrow: it takes an item gated on `containment-doubles` alone that reaches for a
# reify-eval/reify-constraints symbol, which `eval-helpers` would supply and this
# feature would not.
containment-doubles = ["dep:reify-expr"]
