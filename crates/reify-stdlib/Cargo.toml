[package]
name = "reify-stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standard library: unit definitions and built-in functions"

[features]
# Exposes `__registry_dispatch_for_test` to the integration test in
# tests/registry_dispatch_seed_parity.rs. Activated automatically by this
# crate's own [dev-dependencies] self-pull below — never reaches downstream
# crates or production builds.
test-support = []

[dependencies]
reify-builtins.workspace = true
reify-core.workspace = true
reify-gcode.workspace = true
reify-ir.workspace = true
tracing.workspace = true
faer = { workspace = true }
# nalgebra is used for the N≥4 dense determinant/inverse path (DMatrix LU).
# faer is the FEA sparse backend and intentionally left untouched; adding an N≥4
# path to faer would require migrating the full dense API surface — higher risk
# for no gain at the 4×4 scale targeted by this task.
nalgebra = "0.34"

[dev-dependencies]
reify-core.workspace = true
reify-gcode.workspace = true
reify-ir.workspace = true
reify-test-support.workspace = true
# Self-pull with the test-support feature so the integration test in
# tests/registry_dispatch_seed_parity.rs can call
# `__registry_dispatch_for_test`. Standard Rust pattern for
# integration-test-visible internal shims; keeps the symbol out of the
# production public API. Mirrors crates/reify-compiler/Cargo.toml.
reify-stdlib = { path = ".", features = ["test-support"] }
