[package]
name = "reify-build-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared build-script helpers: native-dep discovery and RPATH emission for Reify kernel adapters and binary packages"

# Dev-only, never a normal dependency: this crate is a `[build-dependencies]`
# entry across the workspace, and a normal dep would pull tempfile into every
# one of those build-script graphs. Dev-deps are not transitively resolved for
# consumers.
[dev-dependencies]
tempfile.workspace = true
