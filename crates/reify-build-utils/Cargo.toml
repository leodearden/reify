[package]
name = "reify-build-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared build-script helpers: native-dep discovery and RPATH emission for Reify kernel adapters and binary packages"

# This crate is a `[build-dependencies]` entry across the workspace, so every
# normal dep lands in each of those build-script graphs. They are limited to
# what decoding native-deps.toml needs.
[dependencies]
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

# Dev-only, never a normal dependency, for the same reason. Dev-deps are not
# transitively resolved for consumers.
[dev-dependencies]
tempfile.workspace = true
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
