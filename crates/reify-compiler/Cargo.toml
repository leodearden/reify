[package]
name = "reify-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Name resolution and elaboration from ParsedModule to CompiledModule"

[features]
# Exposes `__validate_annotations_for_parity_test` to the integration test in
# tests/harness_result_annotation/annotation_schema_registry_parity.rs. Activated automatically by this
# crate's own [dev-dependencies] self-pull below — never reaches downstream
# crates or production builds.
test-support = []

[dependencies]
reify-ast.workspace = true
reify-builtins.workspace = true
reify-core.workspace = true
reify-ir.workspace = true
reify-syntax.workspace = true
reify-config.workspace = true
indexmap.workspace = true
tracing.workspace = true
# On-demand stack growth to bound compiler expression recursion (see
# src/recursion_guard.rs). Converts deeply-nested-geometry stack overflow into
# a clean E_EXPR_NESTING_TOO_DEEP diagnostic on small-stack embedder threads
# (e.g. the GUI's 2 MB tokio worker).
stacker.workspace = true
# `strum::EnumCount` derives `VARIANT_COUNT` on the geometry-kind enums in
# `src/types.rs`; the `src/expr.rs` canary also uses its runtime traits in tests.
strum.workspace = true

[dev-dependencies]
reify-ast.workspace = true
reify-core.workspace = true
reify-ir.workspace = true
reify-test-support = { workspace = true, features = ["eval-helpers"] }
reify-eval.workspace = true
reify-expr.workspace = true
tempfile.workspace = true
# Test-only: the doc-chunk fence gate (tests/harness_doc_chunks/fence_gate.rs
# check 4) proves every chunks/*.md is served by
# `reify_mcp::tools::language_chunks`. reify-mcp depends only on reify-core, so
# no cycle.
reify-mcp.workspace = true
# Self-pull with the test-support feature so the integration test in
# tests/harness_result_annotation/annotation_schema_registry_parity.rs can call
# `__validate_annotations_for_parity_test`. Standard Rust pattern for
# integration-test-visible internal shims; keeps the symbol out of the
# production public API.
reify-compiler = { path = ".", features = ["test-support"] }
