[package]
name = "reify-solver-elastic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linear-elastostatic FEA solver kernel for Reify (PRD docs/prds/v0_3/structural-analysis-fea.md)"
build = "build.rs"

[build-dependencies]
reify-build-utils.workspace = true

[dependencies]
reify-ir.workspace = true
reify-kernel-gmsh = { workspace = true }
faer = { workspace = true }
inventory = { workspace = true }
tracing.workspace = true

[features]
linear-solve-fault-injection = []

[dev-dependencies]
reify-ir.workspace = true
reify-test-support.workspace = true
# Test targets enable the inert linear_solve fault hook this way; release builds never do.
reify-solver-elastic = { path = ".", features = ["linear-solve-fault-injection"] }
