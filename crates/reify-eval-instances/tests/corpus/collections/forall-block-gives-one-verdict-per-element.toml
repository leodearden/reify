answer_basis = "traced. Count 2 * 2 = 4 elements, each w = 2 mm. The count constraint is not a verdict and takes no position (decisions A), so the block is `constraint[0]` and the expression form `constraint[1]`. The block gives four verdicts `2mm > 5mm`, `constraint[0][0]` to `[0][3]`, all violated; the expression form gives one, violated. Five in all."
today = "`count == n*2` gives no per-element verdicts (design Part 5)."

