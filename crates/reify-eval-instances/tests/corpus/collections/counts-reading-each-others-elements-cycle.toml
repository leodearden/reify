answer_basis = "traced. `xs`'s count cell reads `ys[0]`, which needs `ys`'s count cell, which reads `xs[0]`, which needs `xs`'s count cell. Neither count reads its own elements, so the compile rule (leaf ι) does not fire. The failure is at the count cells (decisions B2). Both constraints are count constraints, so neither has a `constraint[k]` path. The core's cycle detection (core task 10558) is a prerequisite of leaf ε₁, so it is built before this entry runs."

[[expect]]
