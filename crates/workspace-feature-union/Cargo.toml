[package]
name = "workspace-feature-union"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Pins every external package to the feature set the --workspace build resolves, so `cargo <cmd> -p <member>` compiles the same external units (task 9761)"

# Why and how: docs/notes/workspace-feature-union.md. The region below is
# written by `python3 scripts/workspace-feature-union.py generate`.
# BEGIN generated by scripts/workspace-feature-union.py generate — do not edit by hand
[target.x86_64-unknown-linux-gnu.dependencies]
bitflags = { version = "2", default-features = false, features = ["std"] }
bytemuck = { version = "1", default-features = false, features = ["aarch64_simd", "wasm_simd"] }
crossbeam-utils = { version = "0.8", features = ["std"] }
foldhash = { version = "0.2", default-features = false, features = ["std"] }
futures-channel = { version = "0.3", features = ["alloc", "futures-sink", "sink", "std"] }
futures-util = { version = "0.3", features = ["alloc", "async-await", "async-await-macro", "channel", "futures-channel", "futures-io", "futures-macro", "futures-sink", "io", "memchr", "sink", "slab", "std"] }
getrandom = { version = "0.4", default-features = false, features = ["std", "sys_rng"] }
hashbrown-v0-14 = { package = "hashbrown", version = "0.14", default-features = false, features = ["ahash", "inline-more"] }
hashbrown-v0-17 = { package = "hashbrown", version = "0.17", features = ["allocator-api2", "default-hasher", "equivalent", "inline-more", "raw-entry"] }
libc = { version = "0.2", features = ["std"] }
matrixmultiply = { version = "0.3", features = ["cgemm", "std"] }
memchr = { version = "2", features = ["alloc", "std"] }
nalgebra = { version = "0.34", features = ["macros", "matrixmultiply", "nalgebra-macros", "serde", "serde-serialize", "serde-serialize-no-std", "std"] }
num-complex = { version = "0.4", default-features = false, features = ["bytemuck", "serde", "std"] }
num-integer = { version = "0.1", features = ["i128", "std"] }
num-traits = { version = "0.2", features = ["i128", "std"] }
once_cell = { version = "1", features = ["alloc", "race", "std"] }
percent-encoding = { version = "2", features = ["alloc", "std"] }
proc-macro2 = { version = "1", features = ["proc-macro", "span-locations"] }
rand_core = { version = "0.6", default-features = false, features = ["alloc", "getrandom", "std"] }
regex = { version = "1", default-features = false, features = ["perf", "perf-backtrack", "perf-cache", "perf-dfa", "perf-inline", "perf-literal", "perf-onepass", "std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"] }
regex-automata = { version = "0.4", default-features = false, features = ["alloc", "dfa-onepass", "hybrid", "meta", "nfa-backtrack", "nfa-pikevm", "nfa-thompson", "perf-inline", "perf-literal", "perf-literal-multisubstring", "perf-literal-substring", "std", "syntax", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment", "unicode-word-boundary"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"] }
serde = { version = "1", features = ["derive", "rc", "serde_derive", "std"] }
serde_core = { version = "1", features = ["alloc", "rc", "result", "std"] }
serde_json = { version = "1", features = ["raw_value", "std"] }
smallvec = { version = "1", default-features = false, features = ["const_generics", "const_new"] }
tokio = { version = "1", features = ["bytes", "io-std", "io-util", "libc", "macros", "mio", "net", "process", "rt", "rt-multi-thread", "signal-hook-registry", "socket2", "sync", "test-util", "time", "tokio-macros"] }
tokio-util = { version = "0.7", features = ["codec", "futures-util", "rt"] }
url = { version = "2", features = ["serde", "std"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive", "simd", "zerocopy-derive"] }

[target.x86_64-unknown-linux-gnu.build-dependencies]
bitflags = { version = "2", default-features = false, features = ["std"] }
cc = { version = "1", default-features = false, features = ["parallel"] }
fastrand = { version = "2", features = ["alloc", "std"] }
memchr = { version = "2", features = ["alloc", "std"] }
proc-macro2 = { version = "1", features = ["proc-macro", "span-locations"] }
quote = { version = "1", features = ["proc-macro"] }
serde = { version = "1", features = ["alloc", "derive", "serde_derive", "std"] }
serde_core = { version = "1", features = ["alloc", "result", "std"] }
syn = { version = "2", features = ["clone-impls", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
