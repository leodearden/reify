# Machine-readable twin of merge-gate-compile-cost.capability-manifest.md.
# Path is PRD-derived (<prd-stem>.capability-manifest.yaml) so commit_planning's
# stamper locates it from metadata.prd_task_label + metadata.prd_path alone.
# Schema: shared/src/shared/capability_manifest.py (CapabilityManifestDoc, schema_version 1).
#
# MIGRATED 2026-07-28 from the pre-schema hand-stamped format (2026-07-19), which
# failed CapabilityManifestDoc validation and so was silently skipped by the
# stamper. The old top-level keys map as follows:
#   - batches.reify        -> the tasks[] roster itself (task_id per label).
#   - bindings[].delivered_check (a shell one-liner) -> per-capability
#     delivered_check descriptors; compound `A && B` one-liners are split into
#     one capability per conjunct, since a descriptor holds exactly one check.
#   - manual_checks[]      -> delivered_check {kind: manual, reason: ...} on the
#     capability it excused (5286/F1, 4935/D-B, 4936/D-D).
#   - revived_re_premised[] -> the D-B / D-D task entries below (titles + bindings
#     carry the "was reify-eval-fea-decomposition task B/D" provenance).
#   - cross_prd_deps[]     -> D-B's `registration-seam-upstream` capability binding
#     (task 4935 depends_on 5072, compute-fea-hardening A1). The schema has no
#     dependency field; the real edge lives in the task graph (add_dependency).
#   - program_milestone "5254" -> no schema field exists; recorded here and in F1's
#     binding — F1/#5286 is this PRD's single edge into milestone 5254.
#
# Check-kind conventions used below:
#   - The consolidation leaves' batch-local signal is expressed as a
#     harness-layout-baseline.manifest ratchet grep (`expect: absent` for the
#     batch's own rows): each leaf removes its consolidated rows in the SAME diff,
#     so the ratchet is the one layout-name-independent, batch-scoped, mechanical
#     witness. Verified 2026-07-28: every `expect: absent` grep below is currently
#     FALSE for a pending/in-progress leaf and TRUE for a done one.
#   - `kind: script` guards (test_harness_kloc_cap.sh, test_release_scoped_scope.sh)
#     are green on main by construction (grandfathered baseline), so they are
#     necessary-not-sufficient: they ride alongside a discriminating grep, never alone.
#   - BT-1 (`cargo nextest list` #[test]-fn count unchanged) is `kind: manual`
#     everywhere: it is a before/after delta over a compiled listing, not a
#     property of the committed tree.
