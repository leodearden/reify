    delivered_check:
      kind: grep
      pattern: fn register_production_compute_fns
      expect: present
      paths:
      - crates/reify-eval/src/compute_targets/mod.rs
  - name: bundler-panics-on-double-registration
    binding: observed (doc + code) — the bundler rustdoc states it panics if called twice
      because it re-runs the unconditional registrar. Sole ownership is a correctness requirement,
      not a style rule.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: A panic-on-double-registration contract is asserted by the bundler doc and by
        construction; the post-fix property (exactly one caller) is covered by the widened
        architecture gate below.
  - name: grep-architecture-gate-exists
    binding: capability->producer, wired on main — scripts/check-compute-trampoline-registration.sh
      exists and is registered in the verify-pipeline manifests. Alpha widens it; it does
      not mint a second gate.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: register_production_compute_fns
      expect: present
      paths:
      - scripts/check-compute-trampoline-registration.sh
  - name: seventeen-construction-sites
    binding: observed — an exhaustive census of production (non-test-helper) engine construction
      found 17 sites carrying 12 distinct 7-axis fingerprints. This is the duplication alpha
      removes.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: Site-count reduction is not greppable as a single pattern; the widened architecture
        gate is the mechanical successor.
  - name: inv-fea-1-row-exists
    binding: capability->producer, wired on main — docs/invariants.md carries an INV-FEA-1
      row (full registration has one constructor, status proposed). Alpha generalises that
      row rather than minting a new id.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: INV-FEA-1
      expect: present
      paths:
      - docs/invariants.md
  - name: cmd-check-predicates-are-not-alphas
    binding: 'SCOPE BOUNDARY, added 2026-08-27 — check''s content predicates ARE its kernel
      routing, which a binding G4 ruling reserves to check-diagnostic-truthfulness. As first
      filed, alpha''s deliverable 3 asked for something this PRD''s own section 8.1 forbids.
      Resolved by ordering, not by exemption: #5748 rewrites check''s routing, #6803 then
      unifies check''s body behaviour-preservingly, and alpha adopts the result. Both are
      real edges on alpha now.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: An ordering/ownership boundary; the mechanical successor is the widened architecture
        gate, which cannot distinguish who moved a predicate.
