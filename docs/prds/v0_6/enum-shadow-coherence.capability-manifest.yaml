tasks:
- label: α
  task_id: 6394
  title: 'enum-shadow-coherence α: hoist the LocalEnumShadowScope over the whole resolving

    pipeline (D1/M1)'
  capabilities:
  - name: shadow-scope-substrate-wired
    binding: 'capability→producer (substrate) — LocalEnumShadowScope (RAII guard over
      the

      RESOLUTION_SHADOWING_ENUM_NAMES thread-local, type_resolution.rs) +

      build_local_enum_shadow_set (compile_builder/enums_phase.rs), installed at exactly

      one PRODUCTION site inside compile_with_prelude_context_checked_with_config

      (reify-compiler/src/lib.rs). Not test-only, not declared-only.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: LocalEnumShadowScope::new
      paths:
      - crates/reify-compiler/src/lib.rs
      expect: present
  - name: hoist-target-inputs-final
    binding: 'signal premise (D1) — build_local_enum_shadow_set reads ctx.enum_defs
      +

      ctx.seen_entity_names; its own doc comment states both are final from

      pre_pass::collect_decl_refs onward. The hoist target is the statement immediately

      after the collect_decl_refs call.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'an ordering property between two call sites in one function; not expressible
        as

        a pattern present/absent check without a line anchor, which the overlay forbids.

        Pinned instead by α''s own boundary row 5 fixture test.'
  - name: payload-resolution-reaches-shadow-override
    binding: 'capability→producer (G6 branch 3, the load-bearing one) —

      resolve_enum_variant_payloads resolves each named payload field via

      resolve_type_expr_with_aliases, which is a thin delegator to

      resolve_type_expr_with_aliases_kinded, the function hosting the shadow override.

      Moving the install earlier therefore genuinely reaches R4; it is not a no-op.

      Verified by code read 2026-08-20.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: shadow_payload_binder
      paths:
      - crates/reify-compiler/tests
      expect: present
  - name: stale-placement-comment-rewritten
    binding: 'anti-orphan (M1) — the in-code comment currently justifying the pre-payload

      install cites "resolve_enum_variant_payloads has already run"; after the hoist

      that justification is false and M1 rewrites it. A surviving copy is the tell
      that

      the hoist was faked.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: resolve_enum_variant_payloads. has already run
      paths:
      - crates/reify-compiler/src/lib.rs
      expect: absent
  - name: red-baseline-real
    binding: 'signal premise — shadow_payload_binder.ri fails today with "no matching
      overload

      for use_fit(Fit), candidates: use_fit(Enum(Fit))" (probe 2026-08-19/20 against

      branch tip 22b45744aa = the merged content). Merge-base 5df2f9f1f1 was clean:
      a

      genuine silent→error regression, not a pre-existing failure. Staleness re-checked

      2026-08-20 — no commit since merge bc8f74a4d4 touches type_resolution.rs, lib.rs,

      compile_builder/ or conformance/.'
    verdict: PASS
    delivered_check:
