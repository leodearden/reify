      reason: 'a pre-state measurement; after α lands the pre-state no longer exists,
        so no

        post-delivery pattern can observe it. The post-state (exit 0) is asserted
        by α''s

        own boundary row 5 test.'
  - name: grammar-fixture
    binding: 'grammar-fixture:docs/prds/v0_6/fixtures/shadow_payload_binder.ri — tree-sitter

      parse --quiet from tree-sitter-reify/, exit 0, 0 ERROR nodes (2026-08-20)'
    verdict: PASS
    delivered_check:
      kind: manual
