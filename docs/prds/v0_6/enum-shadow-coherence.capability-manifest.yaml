- label: β
  task_id: 6395
  title: 'enum-shadow-coherence β: shadow-set hygiene — generic filter, assertion
    strength,

    shared entity-name filter helper (M2 / S1-S3)'
  capabilities:
  - name: generic-filter-gap-real
    binding: 'signal premise (S1) — build_local_enum_shadow_set collects ctx.enum_defs
      names

      filtered only against local structure/occurrence names, with no

      type_params.is_empty() filter, so a bare generic-enum name collapses to

      arity-erased Type::Enum(N) and bypasses resolve_enum_type_with_args. EnumDef

      already carries type_params (populated by collect_decl_refs), so the filter
      is a

      one-predicate addition.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: type_params\.is_empty\(\)
      paths:
      - crates/reify-compiler/src/compile_builder/enums_phase.rs
      expect: present
  - name: s1-is-latent-not-live
    binding: 'signal premise — measured 2026-08-20: Result is the ONLY generic enum
      in the

      stdlib prelude, and the intersection of stdlib enum names with the 127 stdlib

      `structure def` names is EMPTY. No live stdlib collision exists; the hazard
      is a

      user generic enum colliding with a prelude structure name. Result<T,E> is what
      the

      S1/S2 guard tests protect.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'a corpus-absence fact about the stdlib as of decompose, not a property
        β

        delivers.'
  - name: s2-assertion-weakness-real
    binding: 'signal premise (S2) — applied_form_is_not_shadowed case (a) asserts

      !matches!(result, Some(Type::Enum(_))) while its own doc comment states the

      contract as "must stay unresolved here"; Some(Type::Error) passes today. β

      strengthens it to result.is_none().'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: '!matches!\(result, Some\(Type::Enum\(_\)\)\)'
      paths:
      - crates/reify-compiler/src/type_resolution.rs
      expect: absent
  - name: filter-idiom-four-sites-exact
    binding: 'signal premise (S3) — the seen_entity_names structure/occurrence filter
      idiom

      appears at exactly FOUR sites, measured 2026-08-20: compile_builder/{defs_phase,

      entities_phase, enums_phase, names_phase}.rs. CompilationCtx

      (compile_builder/ctx.rs) is the natural helper home.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'the post-state is "one definition", a count property; and OQ#5 leaves
        open

        whether the three prelude-chained sites take one signature or two, so an absence

        check on any particular site could false-fail.'
  - name: shadow-set-must-not-subtract-prelude-templates
    binding: 'design constraint (S3) — ctx.resolution_structure_names chains prelude
      template

      names, so reusing it would empty the shadow set for exactly the motivating cases

      (Fit, Appearance). β''s helper is the LOCAL-ONLY half; the prelude-inclusive
      sites

      need an explicit chained variant.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'a negative design constraint on the helper''s contract; β documents
        it once at

        the extraction site per M2.'
  - name: downstream-consumer-named
    binding: 'DAG-direction (G2 intermediate) — γ is the named downstream consumer:
      γ''s C2

      predicate consults the set β finalizes. β is upstream of γ by a real

      add_dependency edge.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'a DAG property, enforced by the wired dependency edge rather than by
        a repo

        pattern.'
