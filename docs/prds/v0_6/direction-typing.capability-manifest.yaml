      so -dir(0,0,1) would print dir(-0, -0, -1) and compare unequal to dir(0,0,-1). γ''s `-d` (C6) consumes
      it — Resolved at decompose: C2 amended and α canonicalises -0.0.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'Covered by a Rust unit test: negated(from_vector([0,0,1])) == from_vector([0,0,-1]) and
        its Display equals `dir(0, 0, -1)`.'
