  - name: lock-guard-reads-new-name-warm-lane-preflight.sh
    binding: 'deliverable — scripts/warm-lane-preflight.sh reads REIFY_WARM_LANE_WORKTREES. [Amended 2026-10-20, retro-critic R7: one check per script, anchored on the read; the former single check over five paths went green on any one hit, comments included.]'
