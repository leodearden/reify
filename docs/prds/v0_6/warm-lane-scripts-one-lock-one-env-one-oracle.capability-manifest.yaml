tasks:
- label: L1
  task_id: 8624
  title: 'warm-lane S20 L1: lane-lock API in lib_lane_lock.sh; seed/thin/gc acquire through it; --assume-lane-lock-held asserts'
  capabilities:
  - name: probe-substrate-exists
    binding: 'deliverable — lane_lock_assert_held is defined in scripts/lib_lane_lock.sh beside the pre-existing lane_lock_probe substrate. [Amended 2026-10-20, retro-critic R7: relabelled; the check asserts the deliverable, not the substrate. The substrate itself, lane_lock_probe at main 8e6ffcac9d, is a shared non-blocking read-only probe, IDLE for an absent file, BUSY only on -E 124 contention, sourced by warm-lane-audit.sh and warm-lane-lock-guard.sh only.]'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: '^lane_lock_assert_held\(\) \{'
      paths:
      - scripts/lib_lane_lock.sh
      expect: present
  - name: df-holders-are-flock2-on-the-sibling-path
    binding: 'dark-factory git_ops.py::_seed_warm_lane builds [flock -x -w 30 -E 124 <lane_dir>.lock] for SeedLaneLock.TAKE; HELD_BY_CALLER callers hold fcntl.flock(LOCK_EX); verify_cancel.py::lane_lock_path = lane_dir.with_name(name + ".lock"). A fresh-OFD flock(2) probe observes each as BUSY.'
    verdict: PASS
  - name: rc70-maps-to-fault
    binding: 'dark-factory _seed_rc_to_unavailable maps 75/76/77/124/127 specially and every other non-zero to FAULT; seed-warm-lane.sh uses no exit 70 at main (exit codes 0,1,2,64,76 only).'
    verdict: PASS
  - name: seed-acquires-through-the-lib
    binding: 'deliverable — seed no longer composes ${LANE_DIR}.lock itself. [Amended 2026-10-20, retro-critic R7: this check is anchored on one spelling; "$LANE_DIR.lock" or "${LANE_DIR%/}.lock" would also satisfy absent, so it is acceptable only together with the adoption-ratchet.manifest rows lane-lock-path-construction and lane-lock-exec-open at ceiling 0.]'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: 'LANE_LOCK="\$\{LANE_DIR\}\.lock"'
      paths:
      - scripts/seed-warm-lane.sh
      - scripts/thin-warm-lane.sh
      expect: absent
- label: L2
