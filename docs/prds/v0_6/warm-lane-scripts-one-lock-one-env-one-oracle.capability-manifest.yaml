    binding: 'git grep REIFY_WARM_LANE_MOUNT at main: provision/preflight/seed/thin read it as the XFS mount; warm-lane-audit.sh (MOUNT=${REIFY_WARM_LANE_MOUNT:-}, _probe_live "$MOUNT/$name.lock") and warm-lane-lock-guard.sh (LOCK=${LOCK_PATH:-$MOUNT/$LANE.lock}) read it as the worktrees dir.'
    verdict: PASS
  - name: retired-names-have-no-production-setter
    binding: 'systemd units pass --mount explicitly (reify-warm-lane-gc.service); orchestrator-reify.service.d/warm-lane.conf sets only REIFY_LANE_LEAK_STATUS_CMD; dark-factory orchestrator/src + shared: 0 hits for the four retired names.'
    verdict: PASS
  - name: lock-guard-reads-new-name-warm-lane-lock-guard.sh
    binding: 'deliverable — scripts/warm-lane-lock-guard.sh reads REIFY_WARM_LANE_WORKTREES. [Amended 2026-10-20, retro-critic R7: one check per script, anchored on the read; the former single check over five paths went green on any one hit, comments included.]'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: '\$\{REIFY_WARM_LANE_WORKTREES'
      paths:
      - scripts/warm-lane-lock-guard.sh
      expect: present
  - name: lock-guard-reads-new-name-warm-lane-audit.sh
