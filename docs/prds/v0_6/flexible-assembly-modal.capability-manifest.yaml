- label: A2
  task_id: 7143
  title: 'flexible-modal A2: selector-typed supports on the modal path — BCs resolve
    to node sets through the #5313 seam'
  capabilities:
  - name: selector-to-node-set-seam-is-upstream-not-present
    binding: 'capability->producer (upstream task) + DAG-direction — measured 2026-09-01:
      the seam has both halves and NO middle. FixedSupport / PinnedSupport declare
      `target : String = ""` (crates/reify-compiler/stdlib/fea_multi_case.ri, comments
      calling it a placeholder pending a Selector migration). Consume half: target_node_set,
      called from loads_supports_to_bc_node_sets (crates/reify-eval/src/compute_targets/elastic_static.rs),
      expects a Value::List of Value::GeometryHandle. Produce half: build_face_anchors
      / resolve_selector_faces (crates/reify-eval/src/compute_targets/bc_resolve.rs)
      — and the two differ, so state them separately. resolve_selector_faces IS
      test-only: its ONLY callers are the #[cfg(test)] tests in that same module.
      build_face_anchors is NOT test-only — it has a production call site in the
      Task-4092 boundary-attribution branch of execute_realization_ops
      (crates/reify-eval/src/engine_build.rs:9345, present at this manifest as-of
      commit 4818478dff, outside any #[cfg(test)] module), gated on demanded_boundary.
      That path is reached from REALIZATION boundary demand, never from an .ri-declared
      support target, so it does not bridge this seam. Nothing in production
      populates a target field from the .ri-declared String into the List<GeometryHandle>
      shape; the only place that shape exists is hand-built test StructureInstanceData.
      So the String -> Selector flip is genuinely absent, is owned by #5312 (Bmig2)
      / #5313 (Bmig2-consume), and A2 CONSUMES it. DAG-direction PASS: A2 depends_on
      5312 and 5313 (real edges wired at decompose).'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'the migrated field type and resolution path do not exist until #5312/#5313
        land, so a grep authored now would guess their shape. Behavioural cover: A2''s
        own signal (changing the selected face changes the constrained set and the
        spectrum) plus #4371 BT4, the migration''s own two-way gate.'
