- label: β
  task_id: 7452
  title: 'goal-oriented β: QuantityOfInterest trait + ball-mean LocalDisplacement/LocalNormalStress functionals
    + dual-load assembler + compute_dual_weighted_indicator + fallible AdaptiveProblem seam (BT1-BT4)'
  capabilities:
  - name: ball-mean-functional-is-bounded-so-the-identity-holds
    binding: 'CORRECTION to the draft (adversarial review), G6 branch 2. A point value d.u(x) in 3-D is
      not bounded on H1 (Dirac load) and crates/reify-solver-elastic/tests/analytical_validation.rs''s
      module doc records the single-node-force divergence (P1 error 2.3% -> 10.3% from 12^3 to 24^3),
      reading deflection as a face mean for that reason. The shipped functional is a BALL MEAN over E
      = {K : centroid in ball(at, radius)} with fallback {K containing at} - an L2 functional - so J(u)-J(u_h)
      = a(e_z, e_u) holds and effectivity has a limit. E is never empty and g is never zero for a non-zero
      direction; radius <= 0 is a typed QoiError.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a mathematical property of the functional, not a greppable artifact. Behavioural cover is
        BT1 (reciprocity) and BT3 (patch exactness with a non-trivial dual).
  - name: recovery-substrate-is-all-present
    binding: capability->producer (substrate, wired-on-main), verified 2026-09-11. element_stress_p1,
      recover_nodal_stress_p1, compute_zz_indicator's per-element eta_e^2 = V_e * dsigma^T S dsigma via
      energy_density_voigt over compliance_matrix (positive definite on symmetric tensors), barycentric_p1,
      locate_element_p1 (lowest index wins; scale-invariant barycentric slack), apply_point_load - all
      pub in crates/reify-solver-elastic and all on the production path. compute_dual_weighted_indicator
      does not exist today (count 0).
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: compute_dual_weighted_indicator
      paths:
      - crates/reify-solver-elastic/src/error_estimator.rs
      expect: present
  - name: dual-is-a-second-cg-solve-on-the-borrowed-k
    binding: capability->producer (substrate). solve_cg(k, f, opts, mode) borrows K; apply_dirichlet_row_elimination
      zeroes row and column, sets a unit diagonal and pins f[i] = value, so the constrained K is symmetric,
      and every DirichletBc.value on the cantilever path is 0.0. A second solve on (&k, &g), with g zeroed
      at the constrained DOFs, needs no solver-crate API change; there is no factorization to reuse (Jacobi-PCG),
      so the dual costs one primal-equivalent solve.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: an existing API property; a check on it would be vacuous. BT1 is the behavioural cover.
  - name: estimator-seam-is-infallible-and-must-become-fallible
    binding: 'CORRECTION to the draft (adversarial review), G3. AdaptiveProblem::solve_and_estimate(&mut
      self) -> AdaptiveEstimate cannot fail and run_adaptive_refinement propagates only refine''s error,
      so a QoI that becomes unresolvable on a later iteration would have no exit. PRD 5.5 authorizes exactly
      two adaptive.rs changes: the Result return (propagated by the loop) and the global_indicator ->
      relative_error rename with the qoi channel. The test stubs'' Infallible error type makes the migration
      mechanical.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: fn solve_and_estimate\(&mut self\) -> Result<
      paths:
      - crates/reify-solver-elastic/src/adaptive.rs
      expect: present
  - name: self-dual-reduction-fixture-is-constructible
    binding: G6 branch 2 / contract C3. The cantilever's tip load is distributed over every tip-face node
      (force_per_tip over tip_nodes), so g proportional to f is impossible on that pencil; C3 is pinned
      on a purpose-built solver-crate fixture whose primal load IS the QoI's own dual_load (f = g, F =
      1) under SolverMode::Deterministic cold start, where z_h is bit-identical to u_h and eta_K = eta_e^2
      bit-for-bit. Any other configuration agrees only to 10*cg_tolerance / (relative magnitude of dsigma),
      which the test must state rather than "to rounding".
    verdict: PASS
    delivered_check:
      kind: manual
      reason: the fixture lands inside this leaf; a grep would pin the test's shape rather than the capability.
  - name: dorfler-weight-homogeneity-changes-by-design
    binding: G6, disclosed. Z-Z marks on eta_e (a square root of energy); DWR marks on |eta_K| (an energy).
      mark_dorfler's prefix rule is not invariant under squaring, so at theta = 0.5 the DWR marked set
      is smaller and more concentrated than Z-Z's on the same field. Deliberate and documented; no test
      may compare marked-set sizes across modes.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a documented convention with no asserting check by design.
