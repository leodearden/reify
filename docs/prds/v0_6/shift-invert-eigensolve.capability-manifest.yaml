      kind: grep
      pattern: spectral_shift
      paths:
      - examples/best_practices/INDEX.md
      expect: present
  - name: examples-corpus-is-compile-gated-so-the-exemplar-cannot-rot
    binding: 'capability->producer (substrate, wired-on-main). examples/best_practices/
      is auto-compile- gated by crates/reify-compiler/tests/examples_smoke.rs, so
      the graduated exemplar is held green by the merge gate rather than by prose.
