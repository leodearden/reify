- label: θ
  task_id: 7265
  title: 'shift-invert θ: PRD close - terminal SHIPPED stamp, landed leaf ids, AS-AUTHORED
    freeze header'
  capabilities:
  - name: terminal-vocabulary-is-closed-and-this-leaf-is-the-only-stamper
