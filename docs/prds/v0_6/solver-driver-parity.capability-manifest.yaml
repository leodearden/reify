    verdict: PASS
  - name: grammar-fixture
    binding: 'grammar-fixture — tests/prd-gate/fixtures/driver_parity_relate_conflict.ri parses with 0 ERROR nodes.'
    verdict: PASS
- label: κ
  task_id: 6699
  title: 'P1-kappa: warm and edit paths choose the same solve entry point as cold'
  capabilities:
