  - name: divergence-is-self-documented
    binding: 'observed — SolverRegistry::solve_ranked''s own doc states candidate 0 "is never worse than solve()''s, but not guaranteed byte-identical", and solve_ranked_impl''s comment states the two can disagree on Solved-vs-Infeasible for the SAME problem.'
    verdict: PASS
  - name: solve-ranked-is-back-compat
    binding: 'capability→producer, wired on main — ranked-solve-result.md I5 guarantees the default solve_ranked lifts solve() losslessly, so routing warm through it cannot change below-gate behaviour.'
    verdict: PASS
  - name: tolerance-basis-is-in-tree
    binding: 'numeric floor, NOT a guessed bound — the asserted 1e-9 rel/abs is SOLVER_AUTO_PARITY_ABS_TOL/_REL_TOL, existing constants whose own doc justifies tolerance-parity as "the achievable, load-bearing contract". CAVEAT they currently live in test-support (crates/reify-eval/tests/common/differential.rs), so kappa must promote or re-home them to state the contract in production terms.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: SOLVER_AUTO_PARITY_ABS_TOL
      expect: present
      paths:
      - crates/reify-eval/tests/common/differential.rs
