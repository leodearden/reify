  capabilities:
  - name: constraint-status-case-mismatch-blocks-the-signal
    binding: 'PASS-WITH-AMENDMENT (A11). LIVE DEFECT, verified independently 2026-08-26.
      build_constraints (gui/src-tauri/src/engine.rs) emits PascalCase "Satisfied"
      / "Violated" / "Indeterminate"; ConstraintPanel.tsx statusIcon/statusTitle/isExpandable
      and STATUS_PRIORITY, StatusBar.tsx''s constraintSummary, and ChatPanel.tsx''s
      hasViolatedConstraints ALL compare lowercase, and no toLowerCase/normalisation
      exists anywhere in gui/src. Consequences today: every badge renders "?" with
      the indeterminate tooltip; data-status="Satisfied" matches no CSS rule so no
      colour; every row is "expandable"; StatusBar counts everything indeterminate;
      ChatPanel''s violated-constraint context option never enables. δ''s signal ("the
      constraint panel shows a measured verdict") is therefore VACUOUS until this
      is fixed — a measured Satisfied would still render "?". Note this ALSO means
      PRD §2''s "all three kinds render Indeterminate in the constraint panel" is
