- label: β
  task_id: 7080
  title: 'trampoline param-drop β: vertical slice - ElasticOptions fully declared; max_iter
    and cg_tolerance honored in elastic_static'
  capabilities:
  - name: max-iter-and-cg-tolerance-both-dropped
    binding: 'capability->producer (substrate, the defect being fixed) - crates/reify-eval/src/compute_targets/elastic_static.rs
      builds its CgSolverOptions with a hardcoded tolerance of 1e-6 and max_iter set to the
      pub(crate) const SOLVER_MAX_ITER = 2000. Verified 2026-08-31. The drop is TWO-wide:
      max_iter (declared default 1000, so the hardcode also contradicts the declaration) and
      cg_tolerance (declared default 0.000001, numerically equal to the hardcode today, so
      only a user-supplied DIFFERENT value is lost).'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: 'max_iter: SOLVER_MAX_ITER'
      paths:
      - crates/reify-eval/src/compute_targets/elastic_static.rs
      expect: absent
  - name: c1-union-equals-elasticoptions-param-set
    binding: 'C1 invariant 1 (the union must EQUAL the param set, not be a subset) - RESOLVED
      AT DECOMPOSE so beta does not discover it at dispatch. ElasticOptions declares 17 params.
      Measured 2026-08-31 by grepping each field-name string across crates/reify-eval/src,
      crates/reify-expr/src and crates/reify-stdlib/src: HONORED TODAY (10) - threads, shell_threshold,
      shell_voxel_size, shell_branch_prune_ratio, shell_force, deterministic, adaptive, target_accuracy,
      max_refinement_iterations, max_dofs. HONORED BY BETA (2) - max_iter, cg_tolerance. IGNORED,
      each needing a live owner (5) - mesh_size (zero reads anywhere in the workspace), element_order
      on the elastic path (read only in buckling.rs and modal_ops.rs, never in elastic_static.rs),
      target_quantity_of_interest, force_tet, require_hex_wedge. 10 + 2 + 5 = 17, so the union
      closes with NO unowned residue.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: set-equality judgment over a structure_def param list; the durable mechanical
        twin is leaf eta's PDROP C4a check ('param in no set').
  - name: ignored-entry-owners-are-live
    binding: 'C4c / D4 (every allowlist entry names a live owner) - both historical owners
      are TERMINAL: #2911 (done) specified mesh_size, element_order, max_iter and cg_tolerance
      and shipped only the declarations; #2998 (done) deliberately ratified target_quantity_of_interest
      as accepted-but-ignored in v0.4. New live owners were filed by this decomposition (the
      iota discharge - see the .md manifest for the ids); force_tet and require_hex_wedge
      already have a live owner in #4746 (pending). DELIBERATELY NO dependency edge is wired
      from beta or eta onto any owner task: the gate requires each owner to be LIVE, and an
      owner reaching done is precisely what reds C4c - an edge would invert the contract.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: task-liveness property, enforced at run time by leaf eta's PDROP liveness lane
        (is_terminal_status against the task store), never by a static pattern.
  - name: error-severity-exit-is-eval-and-build-today-not-check
    binding: 'DECOMPOSE-TIME G6 FINDING (branch 3, end-to-end capability) - the PRD''s boundary
      rows B2/B3 assert that a declared-ignored param at a non-default value makes `reify
      check` exit nonzero, and that the same param at its default keeps it at exit 0. Measured
      2026-08-31, `reify check` cannot deliver that today: cmd_check''s finish_check decides
      its exit from constraint outcomes alone plus two per-code bolt-ons (a GdtIllegalModifier
      code match and an E_DFM_ message-prefix match), so an Error-severity diagnostic raised
      anywhere else prints `error:` and still exits 0 - this is INV-SF-2''s own recorded evidence.
      The general Severity::Error exit gate for cmd_check is task #5405''s sibling #5403 (in-progress,
      high), and routing check through build so it SEES trampoline diagnostics is #5748. Separately,
      an Error-severity diagnostic returned inside ComputeOutcome::Completed does not by itself
      fail the solve. RESOLUTION, per G6 resolution (c) - change the asserted configuration
      so the claim becomes true: B2/B3''s signal is restated against `reify eval` (equivalently
      `reify build`), which ALREADY gates exit on Severity::Error generally (task 4458, cited
      as INV-SF-2''s house pattern) and which definitely runs the compute trampoline. `reify
      check` converges onto the same behaviour for free once #5403 and #5748 land. NO dependency
      edge is wired: the restated signal needs neither task, and C3''s default-comparison
      rule means no existing .ri file trips the new Error, so #5403 landing later introduces
      no regression and needs no allowlist entry for these codes.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: cross-task capability-routing correction; the behavioural twin is the two DiagnosticCode
        variant checks under alpha, plus beta's own eval-level e2e.
  - name: non-convergence-is-user-observable
    binding: 'signal premise (G6 branch 3) - classify_convergence is called on the production
      path in elastic_static.rs with SOLVER_MAX_ITER, and ConvergenceStatus is a real result
      surface, so iteration-budget exhaustion is reportable rather than internal. RESIDUAL
      RECORDED rather than hidden: whether a CI-practical cantilever mesh actually needs MORE
      than 50 CG iterations was not measured at decompose time - and then it WAS. Direct measurement
      against target/release/reify during verification: a fea_cantilever_smoke.ri-shaped design
      with ElasticOptions(max_iter: 50) today returns converged: true, iterations: 719. So
      the mesh genuinely needs far more than 50 iterations, the solve runs straight past the
      requested budget, and B1''s signal IS observable at 50. The same run also confirms the
      drop end-to-end from the user surface, not just by inspection. The assertion remains
      ''the solver used the user''s budget'', not the literal 50.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: an explicitly unmeasured observability premise with a stated adjustment rule;
        pinning a pattern now would assert the answer.
- label: γ
  task_id: 7081
  title: 'trampoline param-drop γ: buckling honors supports, PointLoad.point/.direction, PressureLoad/Gravity'
  capabilities:
  - name: supports-discard-is-real
    binding: 'capability->producer (substrate, the defect) - crates/reify-eval/src/compute_targets/buckling.rs
      discards its supports slot with a bare `let _ = &value_inputs[5];` under a comment stating
      that BCs are hardcoded to pin-pin and that ''Support-driven BC selection is deferred
      (no live task)''. solve_buckling''s signature doc pins slot [5] as `supports : List<Support>`,
      and crates/reify-compiler/stdlib/solver_buckling_fns.ri declares that parameter REQUIRED,
      with no default and no ignored-caveat in its doc block. Verified 2026-08-31.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: Support-driven BC selection is deferred
      paths:
      - crates/reify-eval/src/compute_targets/buckling.rs
      expect: absent
  - name: bc-port-source-is-modal-not-elastic
    binding: 'CORRECTION APPLIED (capability->producer, wrong-layer risk). PRD section 7 names
      modal''s build_dirichlet_bcs / support_targets for finding A1 and elastic_static''s
      target_node_set plus #4245''s direction handling for A2. Verified 2026-08-31: all of
      them exist as production symbols - build_dirichlet_bcs, support_targets and simply_supported_pin_pin_bcs
      in crates/reify-eval/src/modal_ops.rs (with the unit test build_dirichlet_bcs_selects_pin_pin_vs_clamp),
      and loads_supports_to_bc_node_sets plus target_node_set in crates/reify-eval/src/compute_targets/elastic_static.rs.
      BUT they are structurally different designs: target_node_set resolves geometry handles
      over a REALIZED boundary association, while support_targets works from string face names
      over analytic beam coordinates. The buckling trampoline builds a SYNTHETIC grid in-trampoline
      and holds no BoundaryAssociation, so the MODAL mechanism is the correct port source
      for both halves, and A2''s point/direction must be mapped onto the synthetic grid''s
      named faces rather than routed through target_node_set.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: design-direction correction; the behavioural twin is the supports-discard check
        above and the relational buckling assertion below.
  - name: fixed-free-is-reachable-in-the-kernel
    binding: 'capability->producer (substrate) - the buckling kernel ALREADY supports non-pin-pin
      end conditions, so gamma plumbs supports through to a working capability rather than
      adding one. crates/reify-solver-elastic/tests/euler_column_pin_pin.rs carries four landed,
      calibrated BC families each with its own analytic reference: pin-pin (k=1, bound < 0.10,
      observed 9.21%), fixed-free (k=2, bound < 0.11, observed 10.02%), fixed-pin (k about
      0.6992, bound < 0.10, observed 8.82%) and fixed-guided (k=0.5, bound < 0.09), all at
      nx=ny=8, nz=160.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: substrate fact, already true on main; asserting it would be vacuous. It is the
        calibration reference for the numeric-floor capability below.
  - name: buckling-signal-is-relational-not-a-textbook-constant
    binding: 'NUMERIC FLOOR (G6 branches 1+2 - the esc-3453-5/6 class). The PRD carries an
      explicit G6 note on B8 and this binding is its mechanization. Two MEASURED hazards forbid
      an absolute textbook-constant assertion. (1) P1-tet BENDING LOCK floors slender-column
      accuracy at roughly 6.8-10% regardless of mesh density - an exponential fit to the measured
      data yields a 6.8% asymptote (#4052/#4066). (2) Pointwise Dirichlet BCs realize an effective
      fixed-pin k of about 0.67-0.70, not the textbook fixed-fixed 0.5. The pin-pin reference
      itself sits at 9.21% against a 10% bound - 0.79 percentage points of headroom. B8''s
      assertion is therefore RELATIONAL: with supports honored, the fixed-free result must
      move off the discarded-supports pin-pin number in the predicted direction (lower; the
      analytic ratio is 0.25) and rough magnitude, asserted as a RATIO against the current
      pin-pin number at the SAME mesh. Any absolute bound gamma chooses must be justified
      against the fixed-free 11%-bound / 10.02%-observed floor at the mesh actually used,
      and must NEVER assert agreement with k=2. Only element_order: ElementOrder.P2 reaches
      below 5%.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: the floor and the relational form are a design constraint on the test gamma
        writes; the pinned calibration numbers live in crates/reify-solver-elastic/tests/euler_column_pin_pin.rs
        and must be re-read, not copied, at implementation time.
  - name: smoke-comment-contradiction-is-real-and-doubled
    binding: 'capability->producer (substrate) - CONFIRMED and WIDENED 2026-08-31. examples/buckling_column_smoke.ri
      says ''Support: pin-pin - fixed supports at both ends (lateral restraint)'' on the line
