      declares - an inconsistency the discard currently hides. examples/buckling_column_p2.ri
      carries the BYTE-IDENTICAL contradiction. The PRD names only the smoke file, so gamma''s
      scope is widened to both.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: fixed supports at both ends
      paths:
      - examples/buckling_column_smoke.ri
      - examples/buckling_column_p2.ri
      expect: absent
  - name: smoke-fixture-is-numerically-embedded-twice
    binding: 'blast radius (same-diff obligation) - examples/buckling_column_smoke.ri is include_str!-embedded
      by crates/reify-eval-fea-tests/tests/buckling_smoke.rs and by crates/reify-eval-fea-tests/tests/buckling_persistent_cache_round_trip.rs,
      both of which pin its numeric result, and it is pinned in the GUI grammar drift ledger.
      Honoring supports CHANGES the asserted critical load - fixed-free is about a quarter
      of pin-pin - so both embeds must be re-baselined in gamma''s own diff. Separately, examples/*.ri
      has NO carve-out arm in verify.sh''s decide_scope and falls to the conservative default,
      so gamma''s diff runs the full workspace gate: expected, not a defect.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: blast-radius record; the two embeds are named so they are edited in the same
        diff rather than discovered as a post-merge red.
  - name: pressureload-on-buckling-is-unmeasured
    binding: 'OPEN PREMISE, carried deliberately (PRD section 12 open question 4). Whether
      buckling''s geometric-stiffness formulation can consume a PressureLoad without new kernel
      work was never measured. The elastic side has the port source - #4264 bridged PressureLoad
