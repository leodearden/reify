      feasibility does not follow from that. Gamma MEASURES this first and, if it needs kernel
      work, moves PressureLoad to the split PRD and allowlists it against that PRD''s owner
      rather than forcing it. Scoped as a decision inside gamma, not an assumed capability.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: an explicitly unmeasured premise with a stated resolution branch; binding a
        pattern now would assert the answer.
  - name: malformed-ptodo-cites-in-the-touched-region
    binding: 'blast radius (ratchet) - crates/reify-eval/src/compute_targets/buckling.rs''s
      extract_total_load carries the deferral cite ''task theta/3457'' and elastic_static.rs''s
