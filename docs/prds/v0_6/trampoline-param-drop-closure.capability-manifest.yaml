- label: ε
  task_id: 7083
  title: 'trampoline param-drop ε: honor TOTSShaper/RevoluteTOTSShaper actuator_limits; delete
    the force_limit phantom read; decide the keying/arity contract'
  capabilities:
  - name: force-limit-is-a-phantom-field
    binding: 'capability->producer (substrate, the defect) - CONFIRMED ON BOTH HALVES 2026-08-31.
      crates/reify-stdlib/src/trajectory/trampoline.rs reads field_f64(shaper_data, "force_limit",
      1000.0) inside input_shape_tots. A repo-wide `git grep -n force_limit -- ''*.ri''` returns
      ZERO hits: force_limit is a field on NO .ri structure anywhere. The declared field is
      actuator_limits - List<JointLimit> on TOTSShaper and List<RevoluteJointLimit> on RevoluteTOTSShaper,
      both in crates/reify-compiler/stdlib/trajectory.ri - and the per-joint force field inside
      JointLimit is named max_force, not force_limit. So the 1000.0 default ALWAYS wins and
      every joint''s limit is silently uniform. A comment in the same Rust file concedes the
      uniform-placeholder convention.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: field_f64\(shaper_data, "force_limit"
      paths:
      - crates/reify-stdlib/src/trajectory/trampoline.rs
      expect: absent
  - name: actuator-limits-is-declared-and-actually-supplied
    binding: 'capability->producer (substrate) - actuator_limits is declared on both shaper
      structures in crates/reify-compiler/stdlib/trajectory.ri and is actually supplied by
      callers: examples/trajectory/printer_print_envelope.ri passes actuator_limits: [JointLimit(joint:
      0.0, max_force: 1000N)] and examples/trajectory/tots_optimal_ptp.ri passes a non-empty
      list. The data reaching the trampoline is real, not hypothetical - so honoring it changes
      an observable answer.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: substrate fact, already true on main; the deliverable check is the phantom-read
        deletion above.
  - name: b9-as-written-is-not-observable-signal-restated
    binding: 'DECOMPOSE-TIME FALSIFICATION (G6 branch 3). Boundary row B9 asserts that two
      joints at DIFFERENT actuator limits produce a per-joint-different shaped trajectory.
      Adversarial verification reports, and the code path corroborates, that joints with index
      >= 1 have force_peak == 0 STRUCTURALLY, so that difference cannot appear. Mechanism:
      in crates/reify-stdlib/src/trajectory/tots.rs the per-joint peak is filled from the
      flattened RNEA torque with a .take(n_joints) over mechanism.links built by build_rnea_links_for_sample
      (crates/reify-stdlib/src/trajectory/simulate.rs), and the trampoline''s own comment
      concedes that value_to_mechanism_model uses a uniform PLACEHOLDER convention for inertia.
      The SQP constraint vector is per joint, so a limit on a joint whose force_peak is 0
      is a permanently inactive constraint. RESOLUTION: the signal is restated against JOINT
      0, where force_peak is non-zero and the constraint is active - a max_force well below
      the current uniform 1000 N default produces an observably longer optimized duration
      than the same design at a high limit, where today both runs are byte-identical. If the
      j >= 1 inertness is confirmed at implementation time it is a SECOND defect of this PRD''s
      own class and epsilon files it as its own live owner rather than papering over it.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: the restated signal is a two-run eval comparison on joint 0; the j >= 1 inertness
        is an instruction to verify and file, not a capability this leaf delivers.
  - name: keying-and-arity-contract-is-undecided-and-silently-accepted
    binding: 'DECOMPOSE-TIME FINDING, SCOPE ADDED (INV-SF-3 declared-intent-consumed-or-diagnosed).
      JointLimit.joint is declared joint : Real - a placeholder-typed joint id per INV-SF-5
