prd: docs/prds/v0_6/trampoline-param-drop-closure.md
schema_version: 1
tasks:
- label: α
  task_id: 7079
  title: 'trampoline param-drop α: E_PARAM_NOT_HONORED / W_PARAM_NOT_APPLICABLE DiagnosticCode
    variants + the honored/ignored/not_applicable declaration mechanism (INV-PD-1 C1-C3)'
  capabilities:
  - name: diagnosticcode-additive-variant-substrate
    binding: 'capability->producer (substrate) - DiagnosticCode in crates/reify-core/src/diagnostics.rs
      is #[non_exhaustive], carries 191 variants, and has no exhaustive match-on-self anywhere
      in the workspace. Verified 2026-08-31. Minting two variants is additive and non-breaking.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ParamNotHonored
      paths:
      - crates/reify-core/src/diagnostics.rs
      expect: present
  - name: severity-carrier-substrate
    binding: capability->producer (substrate) - Diagnostic::error / Diagnostic::warning fix
      Severity and the fluent .with_code(DiagnosticCode) attaches the code; verified 2026-08-31.
      So E_PARAM_NOT_HONORED = Diagnostic::error(..).with_code(..) and W_PARAM_NOT_APPLICABLE
      = Diagnostic::warning(..).with_code(..). No new type is required.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ParamNotApplicable
      paths:
      - crates/reify-core/src/diagnostics.rs
      expect: present
  - name: mnemonic-is-prose-not-a-renderable-identifier
    binding: 'CORRECTION APPLIED (G6 branch 3, end-to-end capability). DiagnosticCode has
      NO Display, NO as_str, NO code_str, NO FromStr and no exhaustiveness test - verified
      2026-08-31. A signal asserting the two codes ''round-trip'' as the strings E_PARAM_NOT_HONORED
      / W_PARAM_NOT_APPLICABLE would therefore be a FALSE PREMISE. The only machine identity
      is the serde PascalCase variant name; the E_/W_ mnemonic reaches a user only if embedded
      in the message text, the house precedent being the ''E_DUP_MEMBER_KEY: '' message prefix.
      Alpha''s signal is restated accordingly: the variants exist, serialize to their PascalCase
      names, and the mnemonic appears in the emitted message.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: negative structural fact (absence of Display/FromStr on DiagnosticCode); an
        expect:absent on a bare token would violate the reify overlay's scoping rule. The
        positive half is covered by the two variant checks above.
  - name: house-precedent-shape-wired
    binding: capability->producer (substrate, wired-on-main) - buckling_unsupported_option_diagnostics
      in crates/reify-eval/src/compute_targets/buckling.rs is the workspace's only existing
      diagnostic of this kind. It is called on the production path from solve_buckling_trampoline's
      final step and attaches DiagnosticCode::BucklingOptionUnsupported - not test-only. Its
      central unsupported_diag template plus its PRESENT-and-non-default firing rule is exactly
      contract C2 + C3, so alpha ports a shape rather than inventing one.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: substrate fact, already true on main; asserting it as a delivered_check would
        be vacuous. The behavioural twin is the two DiagnosticCode variant checks above.
  - name: default-comparison-rule-is-non-breaking
    binding: 'C3 (default-comparison) - every consumed structure_def declares its defaults
      inline, so C3 has a real source. Measured 2026-08-31 across the tracked .ri corpus:
      every BucklingOptions and ModalOptions call site spells its params AT their declared
      defaults (every sigma is 0.0), so the uniform-Error rule of D2 turns NO existing example
      red. That is what makes ''Error, not Warning'' landable without a migration wave.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: corpus-wide property measured at decompose time; the durable enforcement is
        leaf eta's PDROP gate, not a pattern.
  - name: positional-vs-by-name-ctor-binding-is-contested-prose
    binding: 'hazard recorded (alpha edits option structure_defs). examples/buckling_column_p2.ri
      carries a long header asserting BucklingOptions arguments bind POSITIONALLY in declaration
      order regardless of name: labels - which would make adding or reordering a param silently
      re-bind every existing call site. Task #6484 (pending) exists precisely because that
      claim is FALSE: task 4522 landed a by-name binder, re-probed 2026-08-31. Alpha must
      not add params on the strength of the stale comment, and must not rely on positional
      order either; #6484 is retiring the comments. File contention only, no dependency wired.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: 'cross-task prose-correctness record; #6484 owns the comment retirement.'
  - name: pdiag-is-not-on-main
    binding: 'cross-PRD reality check (INV-SF-6). docs/prds/v0_6/eradicate-silent-undef.md
      owns INV-SF-6 and its PDIAG enforcement, but PDIAG is NOT on main as of 2026-08-31:
      crates/reify-audit/src/pdiag.rs, crates/reify-audit/pdiag-baseline.txt and docs/notes/diagnostic-severity-policy.md
      are all absent, and the work lives unlanded on branch task/5405 (#5405, in-progress).
      Alpha therefore owns COMPLIANCE - both new diagnostics carry codes by construction -
      and must NOT bind evidence to ''PDIAG is green''. No dependency edge is wired from alpha:
      compliance does not need the enforcer to exist. Leaf eta DOES carry a real edge to #5405,
      for a different reason (shared registration surfaces).'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: cross-PRD posture record; the mechanical half is the coded-diagnostic requirement
