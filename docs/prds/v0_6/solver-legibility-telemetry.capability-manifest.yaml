  capabilities:
  - name: mount-no-longer-gated-on-active
    binding: 'signal premise + delivery assertion — the panel is mounted under a Show gated
      on autoResolve.active TODAY, while the backend fires start/iteration/complete synchronously
      in one call and endAutoResolveLoop clears iterations, so the gate can never be observed
      true (that is the defect). The delivered_check is the POST-delivery state: after delta
      the mount no longer keys on that flag.'
    verdict: PASS
    delivered_check:
      kind: grep
      # Pattern narrowed 2026-08-27 (esc-6739-1): the bare token matched the implementer's
      # own explanatory comment at App.tsx:786, falsely re-blocking dependents. This shape
      # still catches the historical defect (`<Show when={...autoResolve.active}>`) but not
      # the comment. Known trade-off (watcher-validated): misses a regression reintroduced
      # via indirection (e.g. aliasing the flag before the Show).
      pattern: when=\{[^}]*autoResolve\.active
      paths:
      - gui/src/App.tsx
      expect: absent
  - name: emitter-fires-single-synchronous-trio
    binding: signal premise — emit_auto_resolve_if_any builds one AutoResolveIteration with
