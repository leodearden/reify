      only.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a struct-field-absence property across a definition alpha itself edits; asserting
        absence post-alpha would be wrong, and asserting presence pre-alpha would fail. Pinned
        by alpha's own Rust test instead.
- label: ε
