      - crates/reify-constraints/src/solver.rs
      expect: present
  - name: op-rule-pact-members-exist
    binding: G7 no-lockstep-duplication — the same decomposition lives in collect_floor_terms
      and derive_from_expr in-crate plus the cross-crate mirror has_inequality_slack. epsilon
      must edit all members in lockstep, not add a fifth copy.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: fn collect_floor_terms|fn has_inequality_slack
      paths:
      - crates/reify-constraints/src/solver.rs
      - crates/reify-eval/src/engine_eval.rs
      expect: present
  - name: equality-has-no-signed-slack
    binding: G6 branch 4 (honest absence) — Eq/Ne/Or are explicitly skipped by the decomposition,
      so margin is None for an equality, NEVER 0 which would read as no margin left. Verified
      by reading the collect_slack_terms doc contract.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a negative semantic property of a match arm; the assertion is a test
        postcondition on epsilon's own Rust test rather than a repo pattern. Signal restated
        2026-09-03 under PRD Amendment A1 — epsilon asserts margin=None on the escaping
        ConstraintCheckEntry, and the n/a RENDERING of that None belongs to the downstream
        renderers zeta/xi/lambda, not to epsilon.
  - name: tolerance-upstream
    binding: capability→producer via dependency closure — toleranced Scalar equality verdicts
      are delivered by task 6653, wired UPSTREAM of epsilon. Without it a correctly-solved
      model reports false-VIOLATED and the slack column would decorate a wrong verdict.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: upstream task delivery, verified by the wired dependency edge to 6653, not by
        a repo pattern.
