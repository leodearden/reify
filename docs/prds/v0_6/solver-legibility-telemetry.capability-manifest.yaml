      kind: grep
      pattern: objective_provenance
      paths:
      - crates/reify-eval/src/engine_eval.rs
      expect: present
  - name: narrowing-site-is-real
    binding: 'signal premise (the defect alpha closes) — Engine::check builds CheckResult
      from five fields and objective_provenance is not among them, so the field is computed
      by the inner eval() and dropped at the EvalResult->CheckResult boundary. Verified by
      reading the CheckResult construction 2026-08-26 (git grep for objective_provenance in
      engine_constraints.rs returns nothing today). The delivered_check is the POST-delivery
      state: after alpha the symbol must be present at that seam.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: objective_provenance
      paths:
      - crates/reify-eval/src/engine_constraints.rs
      expect: present
