      pattern: //~ (ERROR|WARN)
      paths:
      - crates/reify-spec-conformance
      expect: present
  - name: directive-and-annotation-syntax-PARSES-as-ordinary-comments
    binding: 'G3 GRAMMAR GATE — RUN AT DECOMPOSE, PASS. The `//@ key: value` directive
      block and BOTH `//~` annotation placements (trailing on a source line, and on
      its own line) parse with 0 ERROR nodes: `tree-sitter parse --quiet tests/prd-gate/fixtures/spec_conformance_directive_block.ri`
      exits 0. They are ordinary `//` line comments to the Reify grammar, so the fixture
      format needs NO grammar change and NO upstream grammar-producer task. Fixture
      committed as evidence at the full repo-relative path above (tests/prd-gate/fixtures/,
      per the overlay''s placement standard).'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: //~ (ERROR|WARN) [EW]_
      paths:
      - tests/prd-gate/fixtures/spec_conformance_directive_block.ri
      expect: present
  - name: unknown-directive-is-a-hard-error-not-a-skip
    binding: G6 branch 4 (rejection-mechanism-backed). §8.2 asserts an unknown `//@`
      key, a malformed value, an unresolvable `code:` mnemonic and an `anchors:` cite
      to a missing/tombstoned ID are all HARNESS ERRORS. The rejection must be observed
      to fire — a seeded-fire self-test per failure mode is mandatory in this same
      leaf (D14). A directive parser that silently ignores unknown keys satisfies
      the letter and fails the gate.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: unknown directive
      paths:
      - crates/reify-spec-conformance
      expect: present
  - name: manifest-is-generated-never-handwritten
    binding: 'Single-derivation (G7 / INV alignment): manifest.json is derived solely
      by the generator binary from fixture directives, and a regeneration-idempotency
      gate reds on drift. This is the PTODO single-derivation model (`ptodo::fingerprint`
      + sole regenerator `ptodo-baseline-gen`), which IS landed and citable — verified:
      crates/reify-audit/src/bin/ptodo-baseline-gen.rs, crates/reify-audit/ptodo-baseline.txt,
      crates/reify-audit/tests/ptodo_baseline.rs, tests/infra/test_reify_audit_ptodo.sh
      all present.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: cost_ms
      paths:
      - crates/reify-spec-conformance/manifest.json
      expect: present
  - name: mode-reject-silent-accept-is-a-FAIL-verdict
    binding: 'G6 branch 4, built into the harness rather than left to authors (D6):
      a `mode: reject` fixture that exits clean with no diagnostic is FAIL (silent-accept),
      never a skip. This is the overlay''s negative-assertion sentinel (task 4575''s
      `revolute("not-an-axis", …)` precedent) promoted from an authoring rule to harness
      code.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: The silent-accept verdict is a runtime behaviour of the harness, observable
        only by running a seeded reject fixture; a grep for the string would pass
        vacuously on a comment.
