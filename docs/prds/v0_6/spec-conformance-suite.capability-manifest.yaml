prd: docs/prds/v0_6/spec-conformance-suite.md
schema_version: 1
tasks:
- label: α
  task_id: 6758
  title: 'spec-conformance α: spec hygiene + sc-anchor substrate + anchor lint'
  capabilities:
  - name: spec-has-no-anchor-mechanism-today
    binding: 'G3 branch: NEW SUBSTRATE, verified absent. `grep -c ''sc-anchor'' docs/reify-language-spec.md`
      = 0 at HEAD a35b11740a; no `{#id}` attribute syntax and no HTML anchor tags
      anywhere in the 2,958-line file. The anchor mechanism is owned here, never assumed.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: 'sc-anchor: sc-[0-9a-f]{6}'
      paths:
      - docs/reify-language-spec.md
      expect: present
  - name: exactly-two-13.1-headings-exist-so-the-renumber-is-achievable
    binding: 'G6 branch 1 (exactness). The leaf signal asserts ''exactly one 13.1
      heading remaining''. Verified at decompose: `grep -n ''^### 13\.1'' docs/reify-language-spec.md`
      returns exactly two hits — `### 13.1 Doc Comments` and the mis-numbered `###
      13.1 Newline and Continuation Rules` inside §15. Renumbering the second yields
      exactly one. The assertion is achievable, not aspirational.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^### 13\.1 Newline and Continuation Rules
      paths:
      - docs/reify-language-spec.md
      expect: absent
  - name: renumber-cannot-break-the-compiled-spec-consumer
    binding: 'G6 branch 3 (misattributed capability) — CLEARED. tree-sitter-reify/tests/spec_purpose_example_grammar.rs
      `include_str!`s the spec and splits on literal heading strings, so a renumber
      is a real hazard. Probe-verified at decompose: it splits on exactly TWO keys,
      `### 9.5 Purposes` and `### 4.4 Purpose Declarations`. Neither is a 13.1 heading,
      so the §15 renumber is safe. Recorded here so the implementer does not re-probe.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: '### 9.5 Purposes'
      paths:
      - tree-sitter-reify/tests/spec_purpose_example_grammar.rs
      expect: present
  - name: stale-version-header-is-real-and-fixable-here
    binding: 'Field-population analogue: docs/reify-language-spec.md:3 carries `**Version:**
      0.1` with `**Date:** 2026-03-13`, contradicted by 24 in-body v0.6 references.
      Producer is this leaf; the fix is a same-file edit with no downstream consumer
      to re-wire.'
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^\*\*Version:\*\* 0\.1
      paths:
      - docs/reify-language-spec.md
