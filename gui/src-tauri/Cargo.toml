[package]
name = "reify-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri GUI backend for Reify: engine bridge, IPC types, and command handlers"

[[bin]]
name = "reify-gui"
path = "src/main.rs"
required-features = ["gui"]

[lib]
name = "reify_gui"
path = "src/lib.rs"

[features]
gui = ["dep:tauri", "dep:reify-kernel-occt", "dep:tauri-plugin-dialog", "dep:tauri-plugin-shell", "dep:reify-mesh-morph"]

[dependencies]
reify-ast.workspace = true
reify-core = { workspace = true, features = ["serde"] }
reify-ir.workspace = true
reify-mesh-morph = { workspace = true, optional = true }
reify-syntax.workspace = true
reify-compiler.workspace = true
reify-eval.workspace = true
reify-config.workspace = true
reify-constraints.workspace = true
reify-geometry.workspace = true
# OCCT bundling strategy: OCCT is dynamically linked via reify-kernel-occt's
# build.rs (dylib + rpath). For distribution, OCCT .so/.dylib/.dll files are
# listed in tauri.conf.json bundle.resources so they ship alongside the binary.
reify-kernel-occt = { workspace = true, optional = true }
reify-stdlib.workspace = true
reify-lsp.workspace = true
reify-mcp.workspace = true
tower-lsp.workspace = true
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
# Every tokio feature this crate's own non-test sources reach for is named HERE,
# by the crate that uses them, rather than inherited from another crate in the
# same build. Cargo builds tokio ONCE with the UNION of every dependent's
# features, so an undeclared feature compiles only for as long as some OTHER
# crate in the build happens to enable it — a silent dependency that breaks the
# moment `reify-gui` is built with a narrower feature slice.
#
# The list is the complete set for `src/**` minus `#[cfg(test)]`, so the comment
# above is a checkable claim rather than a slogan. Feature -> its use sites:
#
#   sync    `main.rs`'s `tokio::sync::Mutex`; `large_stack.rs` / `lsp_bridge.rs`
#           `tokio::sync::oneshot` (task 5772)
#   rt      `large_stack.rs`'s `tokio::runtime::Handle` (5772), `tokio::spawn`,
#           `tokio::task::spawn_blocking`
#   time    `tokio::time::{timeout, sleep}`
#   process `claude_bridge.rs`'s `tokio::process::{Command, Child}`
#   io-util `claude_bridge.rs:14`'s `tokio::io::{AsyncBufReadExt, AsyncWriteExt,
#           BufReader}` (the bare `AsyncRead`/`AsyncWrite`/`AsyncBufRead` traits
#           are unconditional; the `*Ext` traits and `BufReader` are not)
#   net     `debug_server.rs`'s `tokio::net::TcpListener`
#
# `io-util` and `net` were the two that had NOT been named while the comment
# already claimed the principle: `io-util` was arriving from the workspace root
# and `net` from `axum`'s own `tokio` feature, i.e. exactly the silent
# unification this entry exists to stop relying on. Declaring them changes no
# built artifact today (cargo unions features); it makes the crate's slice
# self-sufficient.
#
# The same principle applies to the TEST target — see the `tokio` entry under
# `[dev-dependencies]`, which names what the tests alone need.
tokio = { workspace = true, features = [
    "process",
    "time",
    "sync",
    "rt",
    "io-util",
    "net",
] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
notify.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
reify-build-utils.workspace = true

[dev-dependencies]
reify-test-support.workspace = true
# The test target's own tokio slice, named for the same reason the normal
# dependency above names its own: `#[tokio::test]` expands to a `macros` +
# runtime pair, and this crate's tests use both flavours — the bare
# `#[tokio::test]` (a CURRENT-THREAD runtime, so `rt`) and
# `#[tokio::test(flavor = "multi_thread", worker_threads = 2)]` in
# `claude_bridge_tests.rs` (so `rt-multi-thread`). `macros` in particular was
# arriving purely by unification from the workspace root, i.e. from whichever
# OTHER crate in the build happened to enable it; a narrower slice would have
# broken the test target exactly as it would have broken `main.rs`. Cargo unions
# these with the normal dependency's features when building tests, so `sync` /
# `time` / `process` are not repeated here.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
reify-eval = { workspace = true, features = ["test-instrumentation"] }
reify-mcp = { workspace = true, features = ["test-support"] }
reify-lsp = { workspace = true, features = ["test-support"] }
# Activates stats::reset_for_test() on the dep for cross-crate test isolation
# in debug_server.rs once engine wiring (PRD #2947-#2949) lands.
reify-mesh-morph = { workspace = true, features = ["testing"] }
tempfile.workspace = true
