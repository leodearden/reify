# Tools the /review skill should invoke during Phase 2 (architectural
# coherence). Each entry is a command + what it detects and how to read it.
phase2_scanners:
  - name: "G-tool: orphan-producer audit (Portfolio approach G)"
    command: "./scripts/audit-orphan-producers.sh --format markdown"
    detects: >
      Public functions in crates/reify-*/src/ whose only callers are
      tests, the defining file, comments, or pub-use re-exports —
      "Type A" producer-orphans. Corpus-level only; never run per-task
      (anti-gaming). Complementary to reify-audit P1, which is
      incremental per done task — keep both.
    baseline: docs/architecture-audit/g-tool-baseline-report.md
    triage: >
      For each orphan, file a follow-up task to wire a production
      consumer OR remove the function OR add `// G-allow: <reason>` on
      the line directly above `pub fn` (only the immediately preceding
      line is recognized). Diff against the baseline.

  - name: "reify-audit: /audit sweep"
    command: "(via the /audit skill; see .claude/skills/audit/)"
    detects: >
      P1 producer-orphan (jcodemunch-diffed per done task), P2
      consumer-stub, P5 phantom-done, plus deterministic detectors:
      PTODO (TODO-citation invariant), PDSSENTINEL, PDIAG, PDOCCOVER,
      PDCHECK, and the advisory jcodemunch trio PDEAD/PUNTESTED/PLAYER
      (Low/log-only until a live-corpus FP review justifies promotion —
      jcodemunch's Rust accuracy is unproven).
    triage: >
      Severity routes High→escalate, Medium→file task, Low→log; the
      tool never flips task status. Parse the JSON artifact under
      data/audit-runs/ first — exit code 125 is overloaded (infra error
      vs. literally 125 High findings). An empty ptodo-baseline.txt
      means structural-only by construction, not a clean corpus.

