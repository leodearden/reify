  constraints-and-geometry:
    purpose: >
      Constraint solving and geometry generation across a multi-kernel
      architecture. Auto-parameter resolution routes through domain solvers
      (Nelder-Mead dimensional, SolveSpace geometric, pure-Rust backtracking
      logical). Compiled GeometryOps dispatch across the production kernels
      (OCCT, Manifold, OpenVDB, Gmsh; Fidget is unlinked, see
      implicit-solids.md) via a descriptor-driven registry with BFS
      conversion-chain routing, under the SHIPPED kernel-seam contracts
      (INV-GEO-1..4) pinned by reify-kernel-conformance. The stdlib provides
      dimension-aware math, geometric value constructors, topology selectors
      and the declarative engineering surface (GD&T, DFM, stackup, fields).
      This is the design-authoring loop's substrate — review priority #2.

    key_scenarios:
      - "A designer's .ri part goes check → build → STEP: primitives, booleans, fillets via edge selectors, sweeps and patterns evaluate through the dispatcher to OCCT and export a valid STEP with correct mass"
      - "Auto params are solved: ResolutionProblem decomposes via union-find into independent components, each routed to its domain solver, results merged"
      - "Cross-kernel booleans: a Manifold mesh boolean runs on OCCT-produced shapes via auto-tessellation, with the dispatcher BFSing the conversion chain; routing to Manifold is DEMANDED-REPR (Mesh sink), never OCCT-failure"
      - "Sub-shape selection (@face/@edge) and attribute correlation work on Manifold results through reify-eval's selector pass, not just the boolean path"
      - "Imported fields: elaborate_field's Imported arm reads a .vdb through reify-kernel-openvdb and surfaces FieldImportFailed loudly on error"
      - "Geometry refinement: a 2D profile vs a solid is distinguished by inferred marker traits + GeomDim; GeometryProfileRequired fires on use-site mismatch"
      - "`sweep(profile, path)` transports the profile AS POSED — an in-plane profile sweeps to a silent zero; `pipe(path, radius)` auto-orients. Callers pose the profile at the path's start frame and bind a name"
      - "Declarative engineering libs evaluate: GD&T Conforms, DFMRule (incl. geometry-backed fits_build_volume), stack-up, clearance constraints (sqrt() lets; cross-sub clearance is UNPOSED, #6583)"
      - "Stdlib trig enforces ANGLE — sin(5mm) returns Undef"

    what_working_means:
      - "Nelder-Mead converges on dimensional problems (feasibility < 1e-12); SolveSpace recognises pattern-matched constraints"
      - "OCCT primitives, booleans, transforms, selectors and export produce valid output; Manifold booleans produce valid meshes; Gmsh meshes FEA domains"
      - "Cross-kernel dispatch finds a plan when one exists and fails cleanly (no conversion chain) otherwise; the kernel-conformance matrix (produce → validate → consume → re-validate) is green"
      - "`reify build --verbose` prints realization kernel provenance; a silent solid→mesh downgrade is visible there"
      - "Novel declarative syntax compiles and checks via the real `reify check` binary"
      - "scripts/check-manifold-deps.sh preflights green — otherwise the kernel crates' entire #[cfg(has_<dep>)] test surface is silently absent"
      - "All tests pass for reify-constraints, reify-geometry, the five reify-kernel-* crates, reify-kernel-conformance, reify-build-utils, reify-stdlib"

    key_decisions:
      - decision: "Geometry-op dispatch is a descriptor registry (GEOMETRY_OP_DESCRIPTORS / descriptor_for / ParentRole), not per-variant matches"
        why: "Replaced three exhaustive matches that drifted independently. Behavioural equivalence is proven by exhaustive per-variant characterization + a discriminant-coverage assertion, NOT by a source-introspection test asserting 'is it table-driven' (rejected in review, task 4671)."
      - decision: "Multi-kernel capability descriptors registered via inventory::submit!; BFS conversion-chain dispatch"
        why: "No single kernel serves every op. The production CLI force-links OCCT, Manifold and (cfg has_openvdb) OpenVDB; Gmsh reaches the CLI functionally through reify-solver-elastic's FEA meshing, not an explicit registration decision — if the elastic solver ever drops its direct gmsh calls, Gmsh's capability silently stops shipping with no compile error."
      - decision: "Kernel-seam contracts PRD is SHIPPED (2026-08-19); INV-GEO-1..4 carry enforced(...) in docs/invariants.md"
        why: "Delivered largely as reify-kernel-conformance, an integration-test-only crate. A 'conformance test passes' claim was found vacuous once in this cluster (#4636 scan-exclusion test, de-vacuified 2026-09-19) — re-check assertion strength, not just colour."
      - decision: "Type::Selector(SelectorKind) / Value::Selector are real runtime types"
        why: "topology-selector-value-type.md's header still says 'deferred'; the code wins."
      - decision: "Each kernel is detected at build time and fails OPEN to stubs; the verify preflight fails CLOSED"
        why: "Fail-open build.rs is the sanctioned headless/partial-deps config. The silent-vacuity rule (check-manifold-deps.sh header) is what turns absence into a red gate. A new NativeDep variant must ship with a matching gate arm — tests/infra/test_occt_deps_preflight.sh pins this lexically AND behaviourally."
      - decision: "CpSatSolver is pure-Rust backtracking, not OR-Tools; SolverRegistry is designed for substitution"
        why: "Named for spec alignment; sufficient at v0.1 sizes (integer domains ≤1000)."
      - decision: "Geometry values (Point, Vector, Frame) are mathematical objects; kernel shapes are opaque GeometryHandleIds"
        why: "Two levels that never mix directly."

    known_gaps:
      - what: "Fidget is deliberately not linked into the production CLI or GUI: its kernel is complete and tested but unroutable from .ri (metre-scale domain), and linking is routing-inert"
        why: "Decided 2026-10-08 (esc-8010-4); task #8010 cancelled. Supersedes the 2026-09-28 'unintended' ruling. See docs/prds/v0_6/implicit-solids.md section 11; the re-open decision is owned by #8411, which also inherits the crate's adoption defects — including its export(), which refuses every format (no SDF→BRep/STEP path)."
        tracking: "#8411"
      - what: "OpenVDB voxel-Boolean execute() on two voxel grids is stubbed (OperationFailed(VOXEL_BOOL_STUB_MSG)); isosurface and mesh→voxel realization ARE wired"
        why: "Deferred to a multi-kernel PRD leaf cited only as 'task ε' in code — a TODO-invariant candidate."
        tracking: null
      - what: "Manifold cross-kernel selector wave: most commits landed but the task is still open"
        why: "Verify what remains against the task record before reviewing selector coverage as complete."
        tracking: "#4263 (pending)"
      - what: "Cross-sub clearance constraints are UNPOSED"
        why: "Clearance between subs ignores sub placement today."
        tracking: "#6583"

    exclude:
      - "docs/research/ — background research, not application code"

  assemblies:
    purpose: >
      Assembly-level semantics: derived subs (`mirror of` / `image of`),
      connection graphs feeding modal/dynamics, flexible and damped assembly
      modal analysis. This area is PRD-rich and code-poor: most of it exists as
      decomposed task batches, not as landed behaviour. A reviewer must hold
      the landed/unlanded split per leaf — grammar merged ≠ feature works.

    key_scenarios:
      - "`sub b = mirror of a across P { }` parses into SubDecl.derivation — and today has ZERO runtime effect: the compiler and evaluator never read .derivation"
      - "Today's engine can realize a mirror image of an UNCHANGED centrosymmetric child by a C2-rotation placement idiom; that is not a general mirror mechanism and scrambles named-child roles"
      - "CompiledConnection exists in the eval graph but is consumed only by topology-fingerprint hashing and forall-Connect bookkeeping — modal/dynamics/eigensolve never read it"

    what_working_means:
      - "For each leaf in docs/prds/v0_6/assembly-*.md, its landed status matches the code: grammar+AST (A-α) and the OCCT det<0 probe (A-ε) landed; compiler lowering, placement algebra, geometry-plane mirror insertion and the mirror_placed/image_placed check verbs have not"
      - "damped-modal-bonded-heterogeneous α landed (Damped mixin trait, loss_factor on FEA presets); no damping numerics exist"

    key_decisions:
      - decision: "Derived-sub overrides need a `<param> = default` reset form"
        why: "The existing flip_ab idiom carries ROLE-SWAPPED overrides; a derivation design without reset cannot subsume it."
      - decision: "Under image-map semantics, raw Vec3 lets meaning axial quantities transform with an extra sign under reflection and the type system cannot tell them from positions"
        why: "Documented hazard in PRD A D4; a Direction/Axis type split was deliberately NOT opened. Revisit only if real designs hit it."
      - decision: "No mainstream CAD has a checked image relation; STEP AP242 forbids det<0 in assembly placements"
        why: "Reify's mirror_placed fills that gap by design; exported mirrored parts must go through the ed.3 'mirrored' relationship, never a det<0 placement."

    known_gaps:
      - what: "Assembly derivation beyond grammar: compiler lowering, eval placement algebra, mirror-plane insertion, check verbs"
        why: "Decomposed, not built."
        tracking: "#6616 (pending), #6617/#6618 (deferred — confirm flip triggers), #6620 (pending)"
      - what: "Modal connection graph (12 leaves) and flexible-assembly modal (20 leaves): nothing landed"
        why: "Decomposed batches awaiting dispatch."
        tracking: "#7162–7173; flexible-assembly-modal batch"

    exclude: []

  kinematics-and-motion:
    purpose: >
      Mechanism modelling, forward/closed-chain kinematics, and design-time
      motion analysis for gantry mechanisms (input shaping, time-optimal
      trajectories, slicer G-code ingestion), all implemented as stdlib with no
      new engine node kinds. Closed chains solve per loop by Gauss-Newton on
      SE(3) residuals with a monotonic-divergence guard; planar/spherical/
      cylindrical joints now carry real analytic per-DOF Jacobian columns and
      participate in loops. reify-gcode is the value-typed, dialect-shared
      G-code parser this consumes.

    key_scenarios:
      - "mechanism().body(...).joint(...) composes; snapshot(mech, bindings) returns a pose Map carrying is_singular; over/under-constrained and singular cases emit typed diagnostics"
      - "sweep(mech, joint, range, steps) warm-starts loop-closure free variables across steps"
      - "Closed loops with multi-DOF joints converge (Tikhonov damping on Spherical's redundant quaternion storage)"
      - "Parametric shaper design: a piecewise-cubic profile evaluates through the spline (evaluate_profile/_dot/_ddot, profile_duration); simulate_trajectory runs FK + inverse dynamics + modal superposition end to end"
      - "TOTS: velocity/accel/force limits + a vibration tolerance drive an in-house SQP over B-spline control points to a minimum-time feasible solution"
      - "gcode_import(file, dialect: KlipperDialect | MarlinDialect) returns List<MotionProfile> in SI units; a Klipper INPUT_SHAPER directive is a warning, not a parse error"

    what_working_means:
      - "Open chains with every joint kind produce correct poses; single- and multi-DOF closed chains converge; Jacobian columns are correct per joint kind"
      - "ZV-shaped ramp ≥40 dB residual reduction; ZVD ±10% / EI ±15% robustness; TOTS converges ≤100 iters with duration < baseline"
      - "G-code round-trips losslessly (parse → display → parse); a second simulate_trajectory with identical inputs hits the ComputeNode cache"
      - "All tests pass for reify-gcode and the reify-stdlib kinematics/trajectory modules"

    key_decisions:
      - decision: "Self-contained in stdlib; no constraint-solver hookup; bare Gauss-Newton (no LM, no line search) plus a divergence guard and a narrow Tikhonov term"
        why: "'Minimal core, rich libraries.' Chain Jacobian composition still uses the finite-difference fallback (chain_jacobian_fd, correct for all joint kinds); SE(3) adjoint transport of the analytic columns is future precision/perf work (KCC-θ/ι), not a coverage gap."
      - decision: "Joint-space waypoints only; no inverse kinematics; Marlin + Klipper only; design-time only"
        why: "Cartesian/IK awaits its own PRD; online replanning is permanently out of scope."
      - decision: "Classical closed-form ZV/ZVD/EI convolution; in-house SQP for TOTS (no osqp/argmin)"
        why: "Textbook formulas below the Value boundary; avoids a heavy dependency (PRD §12.1 open question)."
      - decision: "G-code parser is value-typed and dialect-shared: one semantic GcodeCommand enum"
        why: "Lossless round-trip and a single lowering path; the enum grows per dialect within reify-gcode."

    known_gaps:
      - what: "input_shape / input_shape_apply return the input profile unchanged instead of the shaped, re-timed command waveform; amplitude_sum/trailing_time/convolve_at are consumed only by tests"
        why: "The one remaining staged arm of the trajectory PRD; dispatch for the RevoluteTOTSShaper half was fixed by task 6096, so the dispatch is sound but the output is still an echo. A reviewer will read it as a no-op — it is."
        tracking: "trajectory-input-shaping PRD (docs/prds/v0_3/) Phase 1 β / π — confirm a live task id"
      - what: "Analytic chain-Jacobian composition via SE(3) adjoint transport"
        why: "FD fallback is correct; this is precision/perf."
        tracking: "kinematic-constraints-completion.md KCC-θ/ι"
      - what: "Additional G-code dialects, Cartesian waypoints, multi-mechanism bundles, pose-parametric modal models"
        why: "Future PRD slots."
        tracking: "trajectory-input-shaping PRD §8/§12"

    exclude: []

  analysis:
    purpose: >
      Structural analysis as ComputeNode targets: elastostatics, modal,
      buckling, dynamics, shell solve, tensegrity/form-finding, mesh morphing
      under shape edits, shell mid-surface extraction from thin solids, and
      FDM as-printed FEA (R-fast zone classification and R0 real-toolpath
      rungs). FEA end-to-end reachability — a real .ri file returning
      sampleable results — is VERIFIED, not a question any more.

    key_scenarios:
      - "A real .ri file (examples/fea_cantilever_smoke.ri, examples/modal/*.ri) runs @optimized → ComputeNode → trampoline and returns non-Undef StructureInstances with Sampled displacement/stress/gradient/curl/divergence fields, finite and cross-validated; a second run is bit-identical from cache"
      - "Modal analysis populates Mode.shape (List<Vector3>) and z_dominant_frequencies classifies modes from it"
      - "ElasticResult.frame and shell_channels are Undef on solid tets BY CONTRACT ('I-3 honest absence' for elements without through-thickness data) — not a gap"
      - "Mesh morph under a shape edit: the eligibility classifier picks Laplacian / elasticity / remesh-fallback; the elasticity path meets the calibrated quality floor and warm-starts FEA"
      - "Shell extraction T1–T4 + remesh: thin solid → voxel medial axis → mid-surface → pruning → region segmentation → shell mesh with a shell/tet interface partition"
      - "FDM: as_printed_material(body, proc) returns a Field<Point3, AnisotropicMaterial> immediately from R-fast, and refines to R0 when PrusaSlicer is on PATH (subprocess, SIGTERM→grace→SIGKILL cancel, golden-locked deterministic Toolpath)"

    what_working_means:
      - "Reference-element kernels (P1/P2 tet, P1 hex/wedge) produce correct shape functions and stiffness; CG converges on synthetic systems"
      - "The engine-driven e2e suite in reify-eval-fea-tests is green — it is the proof of user reachability"
      - "Mesh-morph quality_floor_pct_below_025 = 0.01 still holds on the calibration fixtures"
      - "FDM R-fast bracket: as-printed max_deflection strictly greater than homogeneous, build-Z visibly weaker (golden); R0 slicer path byte-deterministic and cancel-clean with no orphan process"
      - "All tests pass for reify-solver-elastic, reify-mesh-morph, reify-shell-extract, reify-fdm, reify-eval-fea-tests"

    key_decisions:
      - decision: "FEA accuracy bounds are honest about the element-formulation floor AND the reference's own error"
        why: "P1-tet bending lock ~6.8%; membrane lock needs ANS; 1-D Timoshenko is ~2% off 3-D at L/H=2. solve_elastic_static hardcodes P1; modal fixtures opt into ElementOrder.P2 to meet tighter bands. Use distributed end-shear + face-averaged deflection, never single-node point load (mesh-divergent). Survey: docs/architecture-audit/fea-accuracy-achievability-survey-2026-05-29.md"
      - decision: "Mesh-morph is RETAINED, but its wall-clock claims were WITHDRAWN (Leo, esc-2953-7, 2026-09-23)"
        why: "Measured 63× slower than gmsh remesh at ~109K tets; profiling put 96% in apply_dirichlet_row_elimination's O(n×|bcs|) row scan, not CG (#7834, done). Retained on warm-start and connectivity grounds. The PRD keeps the original '10–100×' text with an inline dated correction by design — it is not drift. Deferred optimisations are breadcrumbed in three places (PRD section, dep-gated [MILESTONE] task, code-site pointer)."
      - decision: "FEA decomposition (docs/prds/reify-eval-fea-decomposition.md) was measure-first: Lever P landed as reify-eval-fea-tests; Track 1 / Lever B (a production reify-eval-fea crate) was CANCELLED"
        why: "Lever P cleared its threshold ~11×, Lever B missed by ~19×. There is no production reify-eval-fea crate; don't look for one."
      - decision: "One canonical compute-fn registration bundler replaces three drifted hand-rolled ones; compute dispatch has a panic-safe boundary (compute-fea-hardening.md)"
        why: "The GUI bundler was missing morph-producer registration. cmd_check's trampoline-free posture, locked in July, was OVERTURNED in August by v0_6/solver-driver-parity.md — readable only via a dated CORRECTION box; only the LSP retains it."
      - decision: "FDM fidelity ladder (R-fast → R0 → R1 → R2 → R3), not a user dial; PrusaSlicer as subprocess"
        why: "Cheapest rung first, refine as compute allows, FEA warm-starts because the mesh stays fixed. reify-fdm is no longer dependency-free (reify-gcode, tempfile, libc) — only the R-fast classifier is."
      - decision: "Shell extraction's 'empty OR centered' per-voxel medial test on even-N grids is deliberate"
        why: "A point-medial geometry on an even grid cannot be tested by a single radius."
      - decision: "Progress/cancel is PER-EVAL, never process-global"
        why: "Ruling #7437→7438→5215."
      - decision: "inverse_dynamics_at_snapshot returns Undef for closed-loop mechanisms BY DESIGN; only the trajectory variant routes closed chains (task 4146)"
        why: "A snapshot discards the spanning-tree q (esc-3836-226). The open-chain RNEA would return plausible-but-wrong torques, so Undef is the honest answer. The in-function comment still says 'deferred to task 4146' — a done task; that is comment rot, not a live gap."

    known_gaps:
      - what: "Mesh-morph follow-through after the Dirichlet fix: coverage gate + recorded wall-clock (no ratio assert), warm-start measurement, decision milestone"
        why: "The measurements settle whether further optimisation is justified."
        tracking: "#2953 (rescoped, pending), #2952 (pending), #7836 [MILESTONE], #7835 (low)"
      - what: "FDM R1–R3 rungs and GUI zone/contour visualization"
        why: "R1–R3 are stub PRDs marked deferred; no FDM viz exists under gui/."
        tracking: "docs/prds/v0_5/fdm-print-{mesostructure-r1,rve-homogenization-r2,thermal-bondsag-r3}.md"
      - what: "Composites/laminates, buckling K_g, varying-thickness beyond the activated constitutive-law portion"
        why: "GR-041 is the one deliberately partially-activated gap in the register."
        tracking: "gap-register GR-041 / GR-024"

    exclude: []

  tooling:
    purpose: >
      User-facing tools: the CLI (check, test, build, run/eval, report, doc,
      lsp, gui, gui-debug, explain, dev, mcp-server, cache), an LSP server
      with cross-file rename/references/goto-def and workspace-wide doc
      indexing, an MCP server exposing read/write/navigation tools plus the
      language-reference chunks that design agents read, the reify.toml
      manifest crate, and the doc generator (reify-doc / reify-doc-build).

    key_scenarios:
      - "`reify check` validates constraints, exits non-zero on violations (CI-suitable), 0 on Indeterminate unless --strict; realizes geometry only when the module needs it"
      - "`reify build --out-dir` exports one STEP per product body and prints kernel provenance under --verbose; `-o` dumps every body into one file"
      - "`reify test` counts Pass/Fail/Indeterminate and fails only on Fail — the trampoline+constraint seam; flip a constraint FALSE to tell a verdict from a shrug"
      - "An engineer gets live diagnostics, hover, F2 rename (version-stamped edits), Shift+F12 references and document symbols via LSP, in-process for the GUI"
      - "An LLM reads/modifies designs via MCP and looks up syntax in the language-reference chunks — those chunks are the highest-value doc surface; a stale chunk steers every design agent wrong"
      - "reify.toml is parsed by reify-config and consumed by reify-eval (kernel pin, [warm_state] budget, [[node_overrides]] commitment policy), reify-compiler (auto-type-param config) and the CLI cache"
      - "`reify doc <file>.ri` emits faithful Markdown/HTML/JSON reference output, including generic type params, with alphabetic meta-key ordering"

    what_working_means:
      - "check/test/build exit codes match the contract above; build produces non-empty STEP"
      - "LSP diagnostics carry correct spans; rename across files applies atomically"
      - "MCP tools/list returns the advertised set; set_parameter is visible in subsequent get_parameters; tool errors use isError:true in the result body"
      - "reify-config rejects a malformed reify.toml with a clear diagnostic"
      - "Doc output is deterministic across re-runs"
      - "All tests pass for reify-lsp, reify-mcp, reify-cli, reify-config, reify-doc, reify-doc-build"

    key_decisions:
      - decision: "`check` is conditionally kernel-backed (task 5748, check-diagnostic-truthfulness PRD) via realize_for_check, never build()"
        why: "Otherwise geometry-dependent constraints silently degraded to Indeterminate. The export walk and provenance diagnostics still never run on check."
      - decision: "CliToolContext does not support geometry export — reify_export always errors in headless mode"
        why: "Export needs the kernel initialised as in build; the tool exists for the GUI's MCP context."
      - decision: "NotificationSink decouples diagnostic publication from transport; language-reference chunks are include_str!'d into the binary"
        why: "Same server on stdio, embedded in Tauri, or recording in tests. A .md chunk under crates/ is therefore CODE for landing purposes."
      - decision: "Doc-build is non-editorial: structured extraction only"
        why: "Faithful reference output; prose/search/theming are v0.2+ deferrals."

    known_gaps:
      - what: "cmd_check's geometry-bearing arm evaluates a module twice; merge_post_build_verdicts papers over it CLI-side"
        why: "Owner-tagged, not yet paid down."
        tracking: "#5973"

    exclude:
      - "crates/reify-mcp/src/tools/chunks/ — static markdown reference content; review it for TRUTH against the code, not as logic"

  reify-audit:
    purpose: >
      The deterministic architecture-audit detector CLI behind the /audit
      skill: finds producer-orphans, consumer-stubs, phantom-dones, untracked
      or orphaned TODO cites, dead-sentinel and diagnostic-coverage drift, and
      writes per-run JSON under data/audit-runs/. It is the sanctioned home
      for comment-content invariants (never per-crate meta-tests) and, via
      the PTODO fingerprint ratchet, part of the merge gate.

    key_scenarios:
      - "A done task's commit range is diffed through jcodemunch for new public producers with no consumer (P1), honouring `// G-allow:`"
      - "A task marked done whose deliverable is absent from main is surfaced as phantom-done (P5) — the recurring Reify failure mode"
      - "A new TODO without a live `#NNNN` cite, or one citing a done task, is a High PTODO finding; on the real tree the ratchet reds on any new STRUCTURAL fingerprint absent from the (empty) baseline"

    what_working_means:
      - "Each pattern has a hermetic fixture repo asserting its exit code; on main the ratchet, not the exit code, is the gate"
      - "The PTODO baseline stays empty by construction; liveness findings flow to dark-factory sweep tasks"
      - "P1/P2/P5 findings match the /audit skill's severity routing (High escalate, Medium file, Low log) and never flip task status"

    key_decisions:
      - decision: "jcodemunch-backed detectors (PDEAD/PUNTESTED/PLAYER) ship at Low/log-only with no auto-filed tasks"
        why: "jcodemunch is tuned for Python/JS/TS; Rust accuracy is unproven. Promote only after a live-corpus false-positive review."
      - decision: "PTODO ratchet is severity-blind and structural-only; liveness is split out (PRD §19 ruling, 2026-09-26)"
        why: "DB-present liveness must never regenerate the baseline; `env -u` is not 'DB-absent' on main."
      - decision: "Repo identity for jcodemunch derives from ONE producer chain"
        why: "Two producers diverged (task 6459); a stale release build was being preferred."

    known_gaps:
      - what: "Task 7001's baseline-emptying left 6 DB-dependent orphaned PTODO findings untracked by the ratchet and unhealed"
        why: "Routed to the dark-factory sweep by ruling; no reify-side healing task is cited in the commit."
        tracking: "DF 5796 sweep"
      - what: "PPRDSTATUS (PRD terminal-status drift) detector"
        why: "The overlay states the authoring rule; enforcement is a separate task."
        tracking: "#6346"

    exclude:
      - "data/audit-runs/ — generated per-run artifacts"

  gui:
    purpose: >
      Tauri 2 desktop app with a SolidJS frontend: live Three.js viewport,
      CodeMirror 6 editor with in-process LSP (diagnostics, hover, goto-def,
      rename, references, occurrence highlighting, docked diagnostics panel),
      property editor with persisted display-unit preference, constraint
      status, and a Claude Code chat panel backed by a landlock-sandboxed
      Node sidecar. Every engine-touching Tauri command is async and goes
      through an EvalQueue on a dedicated ENGINE lane — no thread, least of
      all the GTK main thread, blocks on engine work (task 7442).

    key_scenarios:
      - "Opening a .ri file shows source and tessellated geometry; editing re-evaluates and updates the mesh via incremental delta events; the status bar shows idle, triangle and constraint counts"
      - "Property-editor edits (with unit-aware quantity literals and the user's display-unit ladder) trigger constraint re-check and viewport update"
      - "Viewport click → editor scroll; property-group double-click → camera fly-to; diagnostics-panel row → jump-to-line, including cross-file open"
      - "Rapid edits supersede queued evaluations; the running one still completes (mid-eval cancel is #5215)"
      - "The Claude chat panel drives the sidecar (--resume continuity) under landlock, which bounds WRITES only; /tmp is writable wholesale"
      - "REIFY_DEBUG=1 opens the debug MCP listener on 127.0.0.1:${REIFY_DEBUG_PORT:-3939}; screenshot_window captures the viewport"

    what_working_means:
      - "The app launches to app-layout (no stuck spinner), renders geometry, and the GTK thread stays responsive during a long evaluation"
      - "scripts/gui-test.sh (self-provisioning vitest runner) is green — a bare `cd gui && npm test` FAILS in a fresh lane at the pretest grammar build"
      - "gui-only Rust (--features gui) IS executed on the merge gate via cargo nextest with no filterset, so debug_server/event_bus tests genuinely run — do not re-file this as a coverage gap. Residual: clippy runs WITHOUT --features gui (#5841)"

    key_decisions:
      - decision: "SolidJS (not React); Tauri 2 + Three.js (not wgpu+egui); delta-based IPC"
        why: "Fine-grained reactivity without VDOM; fastest path to alpha with orbit/raycast out of the box; compute_delta keeps IPC bounded."
      - decision: "In-process LSP via InProcessLsp"
        why: "No stdio overhead; _keepalive holds the tower-lsp Client channel."
      - decision: "Sandbox helpers gui/src-tauri/sandbox/{landlock,landlock_exec}.py are vendored from dark-factory but are deliberately NOT verbatim"
        why: "Reify keeps the blanket ~/.claude grant upstream dropped for a per-task CLAUDE_CONFIG_DIR the sidecar never sets. Refresh = targeted patch, bump the header SHA; a blind cp makes the sidecar's Claude-CLI OAuth state read-only (task 5820; guard tests/infra/test_landlock_exec_refer.sh). bwrap is not used: Bun + kernel 6.17 uid-map segfault."
      - decision: "Launch scripts share scripts/lib_gui_launch.sh for display/vite-port preflight, env pinning and process-group teardown; they refuse rather than build into a launch that cannot work"
        why: "Duplicated launchers diverged once (gui/test/visual/lib_e2e_smoke.sh still carries its own copy). reify-gui retargets its devUrl to REIFY_VITE_PORT at startup and the e2e harnesses allocate a vite port per run, so concurrent GUI e2e smokes are supported; the occupied-port preflight still refuses rather than silently attaching. The VITE_PGROUP=0 fallback is documented insurance, untested and believed unreachable."
      - decision: "Display-unit normalization (ASCII/superscript) is mirrored between TS unitLadder and Rust display_units"
        why: "Resolution-time fallback semantics are pinned on both sides."
      - decision: "Auto-rendered XYZ axis triad is a viewport affordance"
        why: "Do NOT add an axis triad to .ri models."

    known_gaps:
      - what: "No mid-eval cancel: EvalQueue::supersede_queued cancels queued edits only"
        why: "Cancelling the running entry is its own seam."
        tracking: "#5215"
      - what: "LSP-lane concurrency is serialized (one consumer per lane)"
        why: "Latency under parallel requests."
        tracking: "#6517; #7722"
      - what: "Debug-server gating boundary PRD is committed but the debug_server module is still gated behind #[cfg(feature = \"gui\")] wholesale; debug/MCP engine closures bypass the eval queue"
        why: "Leaves not landed."
        tracking: "#6351 (deferred — confirm flip trigger), #6352 (pending)"
      - what: "clippy does not run with --features gui, so gui-gated code is type-checked but not lint-checked"
        why: "Residual of task 5076/6030."
        tracking: "#5841 (deferred — confirm flip trigger)"

    exclude:
      - "gui/node_modules/, gui/sidecar/node_modules/ — third-party dependencies"
      - "gui/src-tauri/sandbox/ — vendored with a deliberate divergence; refresh by targeted patch, never review as if upstream"
