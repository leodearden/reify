# Review briefing — contextualises /review runs with durable project truths.
# Auto-generated by /review-briefing. Human edits preserved on update.
# Last updated: 2026-09-29T00:00:00Z
#
# Review priority (Leo, 2026-09-28), most painful regression first:
#   1. merge-gate integrity (factory-infra)
#   2. the design-authoring loop (.ri → check/build/GUI → STEP)
#   3. language semantics (types, dimensions, Undef/Kleene, build order)
#   4. FEA / analysis results
# All four matter; the order says where to spend attention first.

project: reify

# /audit integration knob. /review Phase 2 invokes the project's /audit
# skill (.claude/skills/audit/) as Step 1; this controls how far back it
# looks. See dark-factory: skills/review-briefing/references/briefing-schema.md.
audit:
  window_days: 14   # default

# Conventions and rules with teeth — violations are always bugs.
conventions:
  - rule: "Code quality is judged against dark-factory's docs/code-quality.md (the fourteen heuristics + the two stances), cited by heuristic name. This briefing does not restate it."
    why: "That file is the single normative copy, ratified 2026-09-03; a restated list went stale once already. Never steer quality work by raw line count or average complexity."

  - rule: "TODO tracking invariant: every TODO/FIXME/HACK comment, todo!()/unimplemented!() stub and blocker #[ignore] reason in tracked source must cite a live, non-terminal task in the form `#NNNN`, and that task's brief must actually cover resolving the marker. A cite to a done/cancelled task is orphaned; a cite alone is not tracking."
    why: "Untracked TODOs are how scaffold accumulates. The merge-gate enforcement is the severity-blind fingerprint ratchet in tests/infra/test_reify_audit_ptodo.sh against crates/reify-audit/ptodo-baseline.txt — since task 7001 that baseline is EMPTY by construction (structural-only), which means 'no structural findings', NOT 'corpus clean': liveness findings (untracked/orphaned cites) are routed to dark-factory sweep tasks, not the ratchet. Untracked or orphaned markers found during review are known_gaps candidates until a task owns them. Grammar and taxonomy: docs/prds/reify-audit-ptodo-detector.md §8. A legitimate pattern string is escaped with a trailing `// ptodo:allow — reason`."

  - rule: "Deferred-task invariant: a task never sits in `deferred` without a concrete, actionable flip-to-pending condition recorded on it. Dependency-shaped gates are dependency edges on a `pending` task; human judgment gates are `pending` tasks that escalate on dispatch with concrete evidence."
    why: "Deferred-without-trigger is quarantine rot — nobody polls it. Only status=deferred parks a task; do_not_dispatch/bookmark flags have no readers."

  - rule: "No latent untracked incomplete or ill-formed implementation chains may accumulate. Every public producer must have a real production consumer, OR a `// G-allow: <reason citing tracked task>` marker on the line directly above `pub fn`, OR be removed. Cross-PRD seams must have a named owner."
    why: "The 2026-05-12 architecture audit found ~19 of 44 mechanism clusters fit the 'scaffold without a caller' shape; it remains the dominant Reify-specific failure mode. /prd's gates G1–G6+META prevent re-introduction; scripts/audit-orphan-producers.sh (corpus-wide, anti-gaming) and reify-audit's P1 (incremental, per-done-task, also honours G-allow) detect it. G-allow reasons cite call sites by symbol name, never file:line."

  - rule: "All new PRDs go through the /prd skill (.claude/skills/prd/) — never freehand-author a PRD or queue tasks from one. PRD terminal status is the closed set SHIPPED / SUPERSEDED / WITHDRAWN."
    why: "The skill walks G1 (consumer named), G2 (user-observable leaf signal), G3 (assumed substrate verified against the REAL reify binary via tests/prd-gate/ probes), G4 (cross-PRD seam ownership), G5 (design-first when stakes are high), G6 (premise validity — the recurring 'stale premise' trap) and META. PRD prose cites code by symbol/section, never path:line, unless the header carries an as-of SHA."

  - rule: "When a PRD's status header or prose disagrees with main, the code wins and the doc is the defect."
    why: "Measured drift in both directions: engine-unified-build-dag.md says 'deferred' for the shipped DEFAULT scheduler; topology-selector-value-type.md says 'deferred' for a landed Type::Selector; the stdlib gap register's '48%' headline has not moved since June while rows closed in bulk; mesh-morphing.md keeps withdrawn '10–100×' claims inline with a dated correction by design. Verify the code, then fix the doc — do not file a code bug from a doc."

  - rule: "Errors must be noisy — never silently swallow logic errors with unwrap_or(Value::Undef), unwrap_or(0.0), unwrap_or(<some default Type>), or similar default-on-error patterns."
    why: "Silent defaults mask bugs. The only accepted exception is sanitize_value converting NaN/Inf to Undef at the stdlib boundary. Any other exception must be discussed in depth. (Type::Real no longer exists — task 4373 deleted it; 'Real' is a resolver spelling for the dimensionless scalar.)"

  - rule: "Tests pin behaviour, never prose or source text. No test may assert on comment/doc/prompt wording, `include_str!` a production source file and match substrings, or grep .ri/.rs comments for a formatting pattern. Do not 'fix' such a test by tightening its regex — delete it and pin the behaviour at the contract site."
    why: "reviewer_comprehensive blocks these (tasks 5205, 5856/593aaeb4f0, 6164, 7664): they false-red on legitimate re-wording, are structurally blind to line-wrapped variants, and certified a false invariant over a corpus with 11 stale cites. Comment-content invariants belong in crates/reify-audit detectors, not per-crate meta-tests. A byte-exact golden encoding test at a wire-format site is the sanctioned way to prove something must NOT exist there."

  - rule: "Cite code by symbol, function, type, named block or §-section, never by file:line, in comments, docs, tests and memories."
    why: "Every audit found most line cites already stale (80 of ~103 stdlib cites wrong; drifts up to 76 lines; self-cites rot within the same diff). Nothing validates them. Task ids, esc- anchors and PRD paths are drift-immune and stay verbatim."

  - rule: "A module that defines a helper covers that helper's core behaviour with its own in-module test; a 'stays clean' assertion that filters diagnostics by code is paired with an unfiltered errors_only(...).is_empty() check right after the compile."
    why: "Delegated coverage silently vanishes when the consumer refactors (task 5657). A code-filtered clean test passes vacuously if the fixture stops compiling, because compile_source_with_stdlib panics only on PARSE errors and lets semantic Errors through (task 5766)."

  - rule: "All task operations route through fused-memory MCP tools with project_root=/home/leo/src/reify — never raw sqlite3 reads or writes on .taskmaster/tasks/tasks.db, never Taskmaster directly. Never commit .task/, tasks.json or tasks.db."
    why: "Raw writes bypass the interceptor (no reconciliation, no candidate_key recompute) and leave the server cache stale; raw reads race its write queue. Task IDs are per-project — a wrong project_root returns an unrelated task, not an error."

  - rule: "OCCT kernel operations run on the dedicated std::thread via the OcctKernelHandle actor — never directly from async context. Gmsh calls hold init::GMSH_LOCK. All Slvs_Solve calls serialize on libslvs's global mutex."
    why: "OCCT, libgmsh and libslvs all carry process-global state. OcctKernel is !Send+!Sync; sync trait methods panic from async context — use the _async variants."

  - rule: "Crate layering is strict and machine-checked: reify-core ← reify-ast ← reify-ir, with reify-syntax producing reify-ast; reify-ast never depends on reify-ir/reify-syntax. 'Meaning never depends on surface syntax.' New crates obey it (reify-builtins depends on reify-core only; reify-compute-contract never touches reify-ast)."
    why: "Enforced by per-crate dag_invariant.rs tests and scripts/assert-crate-dag.sh (B1–B6). The only legal back-reference is the deferred-code pattern — an IR node embedding an unevaluated reify_ast::Expr by value. Naming traps: reify-expr is the expression EVALUATOR, not the AST; there is no reify-types crate; reify-runtime is NOT a scheduler any more (see language-pipeline)."

  - rule: "Geometry type refinement is marker traits on a single Type::Geometry — NOT distinct Solid/Surface/Curve value-types."
    why: "7 marker traits + InferredTraits + a computed GeomDim compose 2D∧Closed∧Planar without a 2^N type plethora (decisions_geometry_traits_not_types). Conformance rejects only statically-known mismatches. plane_*/axis_* constructors live in reify-stdlib eval_builtin — check reify-stdlib before declaring a constructor missing."

  - rule: "Reify grammar has NO implicit method-call syntax `x.foo()` (GR-040) — use `foo(x)`; named args use colons `foo(x: 1)`; enum values are always qualified EnumName.Variant. The explicit trait-qualified form `obj.(Trait::fn)(args)` IS grammar and is not the forbidden form."
    why: "Dot is reserved for qualified enum-variant access and member access. Spec examples using methods are fiction; verbatim ports won't parse."

  - rule: "Kernel-provenance signals belong on `reify build` (which realizes and exports geometry), never on `reify check`. `check` is constraint-only, rejects unknown flags, attaches no solver or compute trampoline — but since task 5748 it DOES realize geometry (realize_for_check, never build()) when a module needs it for RepresentationWithin, geometric GD&T, DFMRule or a geometry-query cell."
    why: "Provenance is a safety signal (silent solid→mesh downgrade) and must surface where geometry is realized for export. 'check touches OCCT' and 'check never surfaces provenance' are both true — they were never in tension. Kernel-less surfaces (an OCCT-less build, or an in-process Engine::new(.., None)) degrade to INDETERMINATE rather than guessing; a doc that attributes an Indeterminate to `reify check` must name the actual surface. `reify eval` DOES wire compute trampolines for @optimized targets; `check --strict` (task 4488) turns Indeterminate into a hard failure; `reify test` and default `check` exit 0 on Indeterminate."

  - rule: "The three tolerance subsystems — kernel mesh-budget tolerance, tolerance stack-up, and GD&T — are distinct and never conflated. DFM is a fourth sibling."
    why: "They model physically different things; each is its own declarative constraint-def surface."

  - rule: "DimensionVector is 10 base quantities — 7 SI + Angle (index 7) + SolidAngle + Money (index 9) — with i16/i16 Rational exponents. Angle is a genuine dimension: sin(5mm) is Undef. SI base units are canonical in every si_value."
    why: "Engineering-motivated; reviewers from physics libraries will question Angle. Money makes cost/DFM tradeoffs dimension-checked like physical quantities. i8 exponents overflow under cross products / sqrt. Unit conversion happens once at compile time; a fn return type is NOT a dimensional checksum (wrong-exponent returns pass) but binary +/- ARE checked — validate physical constants by identity cross-checks."

  - rule: "Value::Undef propagates through arithmetic with quiet-NaN semantics; boolean and/or/implies over Undef use Kleene three-valued logic (Undef and false = false; Undef or true = true), which is deliberately NOT blanket propagation."
    why: "The constraint checker treats Undef inputs as Indeterminate, not Violated. Panicking on undetermined values would crash the incremental engine mid-evaluation."

  - rule: "Structure constructors are PascalCase. Do not introduce snake_case ctor names."
    why: "GR-001 (2026-05-12) collapsed the historical split on PascalCase."

  - rule: "External slicers/tools are integrated as subprocesses, never FFI-linked."
    why: "PrusaSlicer's AGPL stays at a 'mere aggregation' boundary; per-bead geometry is recovered from G-code comments."

  - rule: "Never `git stash` in any reify checkout (park WIP as commits); git rerere stays disabled repo-wide via an explicit `--local false` (never --unset, never a bare `git config rerere.*`); a `git commit` that exits 128/139 may still have landed — `git log -1` before retrying."
    why: "All ~250 lanes are linked worktrees of one shared .git: refs/stash and rr-cache are COMMON paths, so a stash or a rerere resolution leaks across unrelated tasks with a clean `git status` (esc-5785-6, task 5054). Full mechanism: CLAUDE.md §Warm lanes; docs/notes/git-rerere-shared-worktree-hazard.md."

