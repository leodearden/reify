subprojects:
  factory-infra:
    purpose: >
      The verification, git-landing, warm-lane build-cache and legibility
      machinery that lets dark-factory operate reify unattended: one verify.sh
      pipeline invoked identically by git hooks and the orchestrator, hook
      guards that keep main's history sanctioned-only, a pooled CoW warm-lane
      build cache across ~250 linked worktrees, and the landing contract for
      machine-written commits. Merge-gate integrity is review priority #1.

    key_scenarios:
      - "A task branch lands via the merge queue: DF_VERIFY_ROLE=merge forces --scope all --profile both through hooks/pre-merge-commit, release-only tests actually execute, and the main-gate sentinel is marked only on success"
      - "Native-dep absence is caught by scripts/check-manifold-deps.sh BEFORE cargo runs — because absence is otherwise SILENT: build.rs emits a warning and every #[cfg(has_<dep>)] item, the whole test surface included, stops compiling, so the suite reports ZERO tests rather than zero failures (the silent-vacuity rule). Presence is fatal for OCCT/Gmsh/OpenVDB; only OCCT's SONAME is pinned (7.8)"
      - "A docs-only change (docs/, *.md, *.yaml) lands directly on main through hooks/pre-commit → project-checks, which scopes docs to no heavy checks — but a .md under crates/ is CODE for landing purposes (include_str!'d chunks ran a 25k-test gate). TEMPORARY (Leo 2026-09-26): while the train CAS-retry fix is unlanded, route docs through the merge queue on a planning_mode docs-vehicle task instead, because any direct main move under an in-flight verify forces a full re-verify"
      - "Unattended writers (nightly legibility trickle/census) land via hook-gated `git commit --only`, never push, commit as `<writer-id>@automation.reify.invalid`, and a refused commit must not corrupt census-state or leave main dirty — docs/notes/unattended-writers-of-main.md, docs/legibility/landing-contract.md"
      - "A warm lane is reseeded CoW at ACQUIRE under a lane flock that refuses a live consumer; a released lane is thinned unless a live process still references its target/; only the _merge-verify lane's landed-commit target/ may advance the shared base"
      - "A verify-pipeline file changes: the merge worker consults scripts/verify-pipeline-guard.sh requires-full-gate before trusting its config-only trivial-pass"
      - "Claude Code's worktree feature clobbers core.hooksPath on every worktree enter; the hooks symlink + per-worktree config.worktree overrides keep the gate live, and scripts/warm-lane-audit.sh's stash_entries field is the backstop that makes a disarmed guard visible"

    what_working_means:
      - "verify.sh is the single source of truth for test/lint/typecheck; dark-factory-orchestrator.yaml and the hooks invoke it identically and cannot drift"
      - "Every test_*.sh under tests/infra/ has a run-all-classification.manifest row, checked bidirectionally; no Python member is silently undiscovered"
      - "No unsanctioned refs/heads/main move passes hooks/reference-transaction unnoticed (warn-only by default; hard-abort under REIFY_MAIN_GATE_ENFORCE=1)"
      - "rerere is disabled repo-wide with an explicit --local false; scripts/git-rerere-guard.sh check is clean"
      - "A FREE warm lane holds no divergent target/ unless a live process pins it; pool HEADROOM per warm-lane-audit.sh is positive"

    key_decisions:
      - decision: "No rustfmt gate, deliberately"
        why: "The workspace was never formatted (~5913 hunks across 685 files). A crate-wide cargo fmt is an unbounded rewrite that becomes a scope breach; targeted fixes check only touched files with rustfmt --check and rewrite a hunk only inside their own new code."
      - decision: "New tests/infra members are Python stdlib unittest — never pytest — and need a thin test_<name>.sh wrapper to be discovered"
        why: "The gate reaches /usr/bin/python3, where pytest raises ModuleNotFoundError. run_all.sh globs test_*.sh only; a bare .py takes no manifest row and reads as coverage while asserting nothing (scripts/test_legibility_reify_config.py is the live casualty)."
      - decision: "New Python infra tests must not assert a wall-clock upper bound until #7445 lands"
        why: "The flake-class ratchet test_no_new_wallclock_upper_bounds.sh scans *.sh with test-builtin -le/-lt only; assertLess(elapsed, N) is invisible to it. A bound you cannot avoid belongs in a .sh member."
      - decision: "Cross-repo seams follow one pattern: reify ships the primitive, dark-factory wires the invocation"
        why: "Debug-port trigger, cpu governance, reaper sweep, warm-lane seed, verify-pipeline-guard consult. The warm-lane pool-LIFECYCLE half is mid-repatriation to dark-factory under a toolchain boundary (DF 3072 leaf α) — target state, not landed; don't review against the split as if current."
      - decision: "Hook guards are staged warn → enforce → break-glass, not hard gates by default"
        why: "They inherit the core.hooksPath clobber; a disarmed guard is an expected state with its own backstop, not a contradiction of the invariant. The stash guard covers the PUSH direction only — pop/drop fire no hook at all and are closed by rule alone."
      - decision: "OCCT deliberately violates the /opt/reify-deps-first rule: system OCCT 7.8 is listed ahead of gmsh's transitive OCCT 7.9"
        why: "A reify binary loads BOTH; STEP exports carry 'processor 7.8'. Reason about the STEP writer from 7.8 headers. reify-build-utils pins the exact .so filename and materializes a tbb-pin RUNPATH dir so bare ./reify launches resolve oneTBB without LD_LIBRARY_PATH."
      - decision: "Role timeouts are SILENCE bounds, not wall-clock bounds; the lane flock is a reseed mutex, not a liveness oracle"
        why: "A silent cargo call is killed as idle. Liveness is a per-lane live process-reference gate (warm-lane-gc.sh, thin-warm-lane.sh), not the flock."

    known_gaps:
      - what: "Native test_*.py discovery (retiring the .sh-wrapper idiom) and Python-aware wall-clock ratchet grammar"
        why: "Tracked; the wrapper convention is correct today."
        tracking: "#7445"
      - what: "scripts/test_legibility_reify_config.py has no wrapper, no runner, and is red"
        why: "Must be fixed before wrapping or the wrapper lands a red gate member."
        tracking: "#7627"
      - what: "Warm-lane pool-lifecycle repatriation to dark-factory has not landed"
        why: "seed-warm-lane.sh / refresh-warm-base.sh stay reify-side by design (RUSTFLAGS fingerprint, env!()-baked paths); the lifecycle scripts move later."
        tracking: "dark-factory 3072 (leaf α)"
      - what: "git stash pop / non-last drop direction is structurally unguardable by any hook"
        why: "git rewrites the stash reflog, firing no reference-transaction. Push-direction refusal + the audit's stash_entries field is the whole mitigation; a dark-factory startup detector is a possible follow-up, not built."
        tracking: "hooks/reference-transaction refs/stash arm; esc-5785-6"
      - what: "Two legibility-gate branches (codebook-exempt, staged-cited-gate) must land in order and have not"
        why: "Landing staged-cited-gate alone turns a stale citation into a refused trickle commit + dirty main checkout instead of a red merge."
        tracking: "esc-7788-1; dark-factory #5780/#5781"

    exclude:
      - "docs/legibility/confusion-codebook.yaml, docs/legibility/census-state.json, plans/confusion-census-*.md — append-only machine-written legibility artifacts, validated by the gate charter (mention vs use), not by content review"
      - "data/ — generated run, escalation, queue, verify-log and audit-run data, not source"
      - "tests/prd-gate/fixtures/*.ri — deliberately failing capability probes; a rejection is the expected observation"
      - ".worktrees/, .eval-worktrees/, .claude/worktrees/, warm-lane pool dirs, target/ — CoW build caches and live worktree state"
      - "hooks/*.sample — git's stock samples, untracked"

  language-pipeline:
    purpose: >
      The core compilation and evaluation stack. Parses .ri source via
      Tree-sitter, type-checks with a 10-base-quantity dimensional system,
      elaborates into an evaluation graph, and evaluates demand-driven with
      immutable HAMT-backed snapshots and content-hash early cutoff. Since
      task 4362 the default build scheduler is the unified dependency-ordered
      DAG (Kahn worklist + Tarjan-SCC cycle contract); the legacy fixed
      P1…P5 pipeline survives only behind REIFY_BUILD_SCHEDULER=legacy. If
      this breaks, everything breaks. Also home to reify-builtins (the
      builtin signature registry), reify-compute-contract (the OCCT-free
      ComputeFn contract severed from reify-eval), reify-spec-conformance
      (the language-spec fixture corpus) and what remains of reify-runtime
      (commitment / priority-promotion policy only).

    key_scenarios:
      - "A .ri file is parsed, compiled and evaluated: param defaults propagate, let bindings compute in dependency order, constraints report satisfied/violated/indeterminate"
      - "The unified DAG orders the build; a genuine cycle or an unreachable auto surfaces as E_EVAL_CYCLE / E_EVAL_UNRESOLVED rather than a silent Undef"
      - "Incremental re-evaluation after a parameter edit: dirty/demand cone intersection computes the minimal eval set; early cutoff skips unchanged nodes"
      - "Auto parameter resolution: two-phase eval (value eval → constraint solve → re-eval dependents) resolves undetermined params — but only on entry points that attach a solver (build, eval, GUI); check prints Undef for them by design"
      - "Structure-instance runtime: PascalCase ctors evaluate to a typed Value::StructureInstance with resolved cells; ctor field types are conformance-checked"
      - "Kleene boolean evaluation over Undef operands; Undef arithmetic propagates quietly"
      - "Guard-controlled topology: a guard cell's boolean change rebuilds the active set of cells and constraints, not just values"
      - "Purpose activation injects constraints at runtime without recompilation (`reify check --purpose`)"
      - "Builtin dispatch: migrated families (Parse, Analysis) resolve through reify_builtins::lookup; the rest still string-dispatch pending later legs"
      - "A spec clause is cited by anchor ID from a reify-spec-conformance fixture, including chartered must-reject fixtures"
      - "Multi-module compilation via ModuleDag with topological ordering and cycle detection"

    what_working_means:
      - "Parsing a valid .ri file yields a ParsedModule with no errors and correct spans; compiling yields templates with correct cell paths; evaluating yields Value::Scalar with correct SI values and dimension vectors"
      - "Content hashes are stable across re-parses of identical source and differ after any change; edit_param re-evaluates only the dirty-demand intersection"
      - "The crate DAG holds: dag_invariant.rs tests and scripts/assert-crate-dag.sh report B1–B6 clean"
      - "UnifiedDag and legacy schedulers agree on every fixture that has no cycle"
      - "All tests pass for reify-core, reify-ast, reify-ir, reify-syntax, reify-compiler, reify-expr, reify-eval, reify-builtins, reify-compute-contract, reify-spec-conformance, reify-runtime"

    key_decisions:
      - decision: "Three-layer crate split (reify-core / reify-ast / reify-ir) with machine-checked DAG invariants"
        why: "Isolates blast radii and makes 'meaning never depends on surface syntax' a compile-time guarantee. reify-syntax still carries a TRANSIENT `pub use reify_ast::*` re-export awaiting a test-import sweep ('task η') — labelled for removal, not a permanent façade; it has now waited four months."
      - decision: "Unified build DAG ('Option A', engine_fixpoint::run_unified_pass) is the DEFAULT; legacy is a kill-switch"
        why: "Designed in a 44-agent red-teamed session (docs/design/engine-unified-build-dag-option-a.md), cut over by task 4362. Its PRD header still reads 'deferred' — the code wins. Engine::build() is from-source (calls eval, full export); build_snapshot() operates on an existing snapshot and returns Option<BuildResult>."
      - decision: "Custom incremental engine instead of Salsa; immutable im-rs HAMT snapshots with O(1) clone"
        why: "docs/research/salsa-fit-gap-analysis.md — the snapshot model, two-phase resolution and topology-changing guards don't fit Salsa. NodeCache clone intentionally drops warm_state."
      - decision: "reify-runtime's async ConcurrentScheduler / ConcurrentEvalAdapter were DELETED as dead code (task 5065, 2026-07-18)"
        why: "Zero production callers. The crate is now commitment.rs + priority_promotion.rs + warm_startable_assert.rs, consumed by reify-ir, reify-cli dev and the kernels' warm_register sites. Do not flag the missing scheduler as a regression, and do not resurrect it without a consumer. WarmStatePool lives in reify-eval; its drain_events are journaled and consumed by the GUI's EngineSession (task 3582)."
      - decision: "Type::Real was deleted (task 4373); Real is a resolver spelling of the dimensionless scalar"
        why: "Canonicalisation is complete, not partial — there is one dimensionless cell."
      - decision: "reify-builtins is an enum-keyed registry (BuiltinRow/BuiltinId) that holds no Value and no fn pointers, depends on reify-core only, and has migrated only the α seed"
        why: "Single source of truth for name→arity→slots→result-type→dispatch-kind, replacing first-arg-fallback typing. Its own docs name the still-string-dispatched sites in reify-expr awaiting legs β…ω; don't assume registry authority elsewhere yet. Its anti-drift claim is evidenced by a one-time mutate-and-revert, not a standing test."
      - decision: "reify-compute-contract is severed reify-eval, re-exported at the original paths"
        why: "Lets non-OCCT engines and the FEA e2e crate share the ComputeFn/ElasticResult contract without pulling OCCT. Internal split, not new public surface; its bincode header is byte-pinned by a golden test."
      - decision: "reify-spec-conformance is a third, distinct conformance thing"
        why: "reify-compiler/src/conformance/ is struct-ctor/GD&T conformance; reify-kernel-conformance is the kernel-pair matrix; reify-spec-conformance is the language-spec ('Ring 1') fixture corpus, deliberately OCCT-free and hand-synced with scripts/occt-touching-crates.txt. Its tree contains deliberately broken .ri files by design."
      - decision: "Trait conformance is nominal, not structural; structure and occurrence compile to the same template differentiated by EntityKind"
