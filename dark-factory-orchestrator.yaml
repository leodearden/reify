# Reify orchestrator configuration
# Rust + Tauri/TypeScript (GUI) project

# Concurrency
# 24→48 (2026-06-23, Leo via escalation-watcher, esc-4743-43): reverted to 48 to
# relieve warm-lane task-pool exhaustion (warm_lane_pool.task_pool_size derives
# from this cap). Leo's rationale: the PSI/token admission-control guards added
# since the 2026-06-04 cut (compile_gate, psi_gate, agent cpu-admit, held-slot
# semaphore) now backstop the oversubscription that caused the original livelock.
# NOTE (corrected 2026-06-29, /deb root-cause): the original in-memory lane-leak
# (esc-4743-43: release bound only to DONE+on-main) was FIXED by dark-factory 1881
# (broadened terminal release + status-keyed reconciler) and 1912-1914 (branch-ref
# decouple). Both are LIVE and confirmed working — the pool cycles (0 exhaustion events
# since the 2026-06-27 restart; 36 acquires / 58 releases; release_lane_for_terminal_task
# firing). The earlier "true cause is a lane-leak / stuck-ASSIGNED bug" claim is STALE: a
# FREE lane retains its last task's branch ref (intended branch-decouple artifact), which
# looks like a stuck assignment in `git worktree list` but is not. Two residual issues
# remain, NEITHER a saturating leak: (a) ACUTE — a `git clean` TOCTOU race against reify's
# async target.reseed-trash.<pid> dir during _reset_warm_lane hard-faults a dispatch
# (this was the actual 2026-06-29 task-4892 block; reify 4896 relocates the trash,
# dark-factory 1931 excludes it + tolerates the benign ENOENT, 1932 makes a transient
# acquire-fault retryable instead of BLOCK); (b) LATENT — the terminal-lane reconciler
# reclaims only done/cancelled, so lanes pinned to blocked/non-dispatched tasks are freed
# only lazily on the next acquire (dark-factory 1933 adds a reclaim-on-exhaustion safety
# valve). `spare_warm_lanes` below is the interim headroom margin. The stale
# `warm_lane_pool.enabled: false` that gated off the invariant-6 cold-fallback was removed
# 2026-06-23.
# History: 48→24 on 2026-06-04 because 48 concurrent tasks on a 32-thread box
# livelocked the SERIAL merge queue (post-merge verifies timed out exit 124 from
# 20:06-22:00, main froze 2h at full CPU burn; 24 left the merge verify ~half the
# box). Re-cut toward 24 if the merge-latency livelock recurs.
max_concurrent_tasks: 48
max_per_module: 1
# lock_depth 4→10 (Leo 2026-06-18): make module locks effectively file-granular. At
# depth 4 a file path DEEPER than 4 components (e.g. crates/reify-eval/src/compute_targets/
# form_find.rs) coarsened to its 4-comp ancestor dir lock (crates/reify-eval/src/
# compute_targets), serializing the whole compute_targets/ hot anchor (5 files). Empirical
# max real path depth = 6, so depth 10 is pure headroom — identical lock granularity to 6
# for every current path, no path coarsens. SAFE: correctness rests on BRE (acquire-before-
# edit) + full-workspace merge-verify, NOT lock coarseness; finer locks only shift more
# weight onto BRE re-pends + merge-verify RED-requeue (accepted cost). Orthogonal to the
# declaration-honesty guard (docs/prds/task-lock-charter-lifecycle.md): raising depth does
# NOT fix bare directory strings (≤depth, untouched by truncation); that guard does NOT fix
# deep-file coarsening. The residual shared-dispatch-registry contention (compute_targets/
# mod.rs, engine_build match family) needs data-driven dispatch tables, not lock depth.
lock_depth: 10

# TEMP (Leo 2026-06-18): bumped the per-task verify timeout 1800 (package default) -> 3600 for cold-cache
# verify-timeout relief until the Phase 6 warm-lane CoW pool (#4665) is live. REVERT at #4665.
# See docs/prds/warm-lane-pool-cow-seeding.md. (cold default verify_cold_command_timeout_secs=5400 unchanged.)
# 2026-06-19 (Leo): further bumped 3600 -> 7200 alongside the test-semaphore re-tune (N=2 + WAIT=3600
# in verify_env below). The slot-acquire WAIT (3600) counts against this command budget, so WAIT must
# stay < this value while DF does not implement clock-stop: a task that acquires the slot late still
# gets ~3600s for nextest and exits cleanly (exit-75 → BLOCKED, pre-seam) rather than exit-124 hard
# timeout mid-test. Post-seam (dark_factory:1916, task 4838): the @@REIFY_CLOCK_*@@ marker span is
# excluded from this budget, so WAIT can safely flip to unlimited (task 4838). NB the cold default
# (5400) is now < this warm budget; if cold-cache verifies under saturation start hitting exit-124,
# add verify_cold_command_timeout_secs >= 7200.
verify_command_timeout_secs: 7200
# merge_verify_cold_command_timeout_secs (task #5383; sibling task #5382 delivers the
# RELEASE inner nextest budget REIFY_VERIFY_TEST_TIMEOUT_RELEASE=90m in scripts/verify.sh
# and deliberately does NOT lift verify_command_timeout_secs above — that key bounds only
# the non-merge path, which verify.sh runs --profile debug, so no non-merge path runs the
# debug+release passes cold together): the merge path (DF_VERIFY_ROLE=merge) is NOT bounded
# by verify_command_timeout_secs above.
# dark-factory orchestrator/src/orchestrator/verify.py's
# `_resolve_verify_timeout` resolves the cold merge-verify OUTER wall via a
# cascade whose FIRST branch returns this key when set (the is_merge_verify
# branch), overriding dark-factory defaults.yaml's 7200s default. 180m (10800s)
# covers the cold OCCT/OpenVDB/gmsh/manifold native-kernel compile that
# precedes nextest on a cold cache, and is sized above the
# debug(60m=3600s)+release(90m=5400s) = 9000s inner nextest budgets it must not
# preempt (see the model note below). Only ever widens the wall versus the 7200s
# default it overrides.
# esc-5382-1 amendment: that cold native-kernel compile is now explicitly
# budgeted as REIFY_VERIFY_PREBUILD_TIMEOUT (45m), the merge-path
# `cargo build --release -p {reify-audit,reify-cli}` pre-builds that run BEFORE
# both nextest passes (the former fixed 10m ceiling SIGTERM'd reify-cli
# mid-`Compiling reify-runtime` with zero failing assertions).
#
# WHAT THIS WALL MODELS — read before "fixing" any margin arithmetic here.
# This wall bounds the EXPECTED cold merge-verify duration. It is NOT, and has
# never been, the sum of the inner per-step GNU-`timeout` ceilings. Rendering
# the command this wall actually bounds (`DF_VERIFY_ROLE=merge scripts/verify.sh
# all --profile both --scope all --print-plan`) yields inner ceilings summing to
# ~2x this wall, and did so before this task landed (clippy 45m x2 and check 30m
# predate it). Inner ceilings are per-step SIGTERM backstops for a PATHOLOGICAL
# step, not a budget allocation: in a healthy run every step finishes far below
# its ceiling, so the ceilings do not sum into anything meaningful. There is
# therefore no "remaining margin" to defend here, and no inner budget is capped
# by 10800 minus the others — an earlier revision of this comment claimed a
# 300s margin and was wrong on both the model and the arithmetic.
#
# What tests/infra/test_occt_flock_gate.sh T10 guards is accordingly NOT a
# worst case but a NECESSARY-CONDITION lower bound over a deliberately chosen
# SUBSET: the two terminal nextest passes, debug(3600s) + release(5400s) =
# 9000s <= 10800s. Rationale for that subset: those two passes run back-to-back
# at the very end of the plan, so if their inner budgets ever summed past this
# wall the release inner budget would be unreachable BY CONSTRUCTION — the wall
# would always fire first — which is exactly the false-timeout class
# (esc-5370-2) this budget split exists to remove. The pre-build is deliberately
# EXCLUDED from that subset: its cost is transferred FROM the release nextest
# pass (which then runs against a warm release cone) rather than added to it, so
# folding it in would double-count the same cold native-kernel compile.
merge_verify_cold_command_timeout_secs: 10800
# Verify kill-tree hardening (merge-gate-health W1b, 2026-07-19 survey): run each verify
# in a systemd df-verify-*.scope so the whole subtree is enumerable/killable — eliminates
# the GNU-timeout setpgid pgroup-escape strands that gut the _merge-verify worktree after
# restarts (44/48 restart-collateral instances; DF verify.py:2846-2849 documents the escape).
# Mechanism shipped DF-side (verify.py:2890-2911); default was False for reify only by config.
# Companion DF startup scope-sweep: dark_factory task 2829.
verify_use_cgroup_scope: true
# Clock-stop seam — ACTIVATED 2026-06-26 via task 4838.
# dark_factory:1916 deployed; @@REIFY_CLOCK_*@@ span excluded from
# verify_command_timeout_secs (continuous wait no longer counts against this budget).
# Markers default to @@REIFY_CLOCK_{STOP,HEARTBEAT,START}@@ in DF defaults.yaml
# (byte-match reify's lib_clock_stop.sh emitter — no marker override needed).
# 2026-07-08 (task 5156, Leo-approved verify-flakiness survey follow-up): bumped
# 180 -> 600. The 180s backstop false-killed verifies whose clock-stop span was
# followed by a long SILENT native-crate compile/link with no heartbeat (32
# escalations across ~12 tasks 06-27..07-06; worst observed false-kill at wall
# time 329.9s, 0 assertion failures). 600 gives ~1.8x margin over that worst case;
# a genuinely wedged wait is now caught in 10min instead of 3, which is
# acceptable since live waits heartbeat every 30s and the 7200s
# verify_command_timeout_secs outer wall still bounds everything. Durable fix
# (per-test slow-timeout attribution so this can be tightened again) is task 5141.
verify_clock_stop_enabled: true
verify_clock_stop_heartbeat_idle_max: 600

# Verification commands — thin delegations to scripts/verify.sh, the single
# source of truth shared with the git hooks (hooks/project-checks +
# hooks/pre-merge-commit). All the logic lives in verify.sh: a single
# `cargo nextest run --workspace` pass (OCCT crates folded into the pool via
# the nextest occt test-group max-threads=4; task 4451), the release-sensitive
# crate nextest pass, the sccache/jobserver/OCCT LD_LIBRARY_PATH env, the
# per-invocation timeout budgets, the tree-sitter generate prereq, and the
# npm/infra steps. `verify.sh --print-plan` emits the exact ordered command
# list it will run; the infra drift tests assert against that oracle.
# Authoritative OCCT crate list: scripts/occt-touching-crates.txt
# (shared via scripts/occt-scope-lib.sh). See `scripts/verify.sh --help`.
#
# --scope branch narrows per-task verification to files changed since
# merge-base(main, HEAD) (committed + uncommitted task work). This keeps
# per-task TDD iterations fast: a docs-only task runs no cargo, a
# frontend-only task skips the Rust pipeline, etc.
#
# The merge path (DF_VERIFY_ROLE=merge) keeps full scope: hooks/pre-merge-commit
# uses --scope all explicitly, and the orchestrator merge pipeline does not
# invoke test_command / lint_command below.
#
# No --profile here: verify.sh derives the profile from DF_VERIFY_ROLE (task 4078).
# Per-task verifies run with DF_VERIFY_ROLE=task => profile=debug (fast feedback).
# The orchestrator merge path injects DF_VERIFY_ROLE=merge => profile=both,
# exercising release-only tests (the 4055 sweep test, 4 large-DOF Euler tests,
# and the cfg(debug_assertions)-gated buckling/eigensolve tests in
# reify-solver-elastic) without slowing every per-task TDD iteration.
# hooks/pre-merge-commit pins --profile both explicitly for the local manual-merge
# gate (git merge on main) and is unchanged.
#
# DF_VERIFY_ROLE=merge also exempts the run from the held-slot test-run semaphore
# (scripts/lib_test_semaphore.sh test_semaphore_acquire) in addition to the
# psi_gate() bypass. The merge gate never waits behind a task slot.
#
# PREMISE CORRECTION (PRD verify-admission-wait-clock-stop §2, task 4837):
# DF does NOT requeue a verify exit-75 — _classify_failure falls it through to
# unknown_test_failure → debugfix loop → BLOCKED (the true mechanism behind task
# 4800 and the esc-3891-45/esc-4673-31/esc-4552 cluster).
#
# Real fix: both admission gates (semaphore + PSI gate) use a continuous
# in-process blocking wait with @@REIFY_CLOCK_{STOP,HEARTBEAT,START}@@ markers
# emitted to stderr. dark_factory:1916 (task 4838) consumes these markers to
# exclude the wait span from verify_command_timeout_secs. REIFY_TEST_SEMAPHORE_WAIT
# and REIFY_PSI_GATE_MAX_WAIT accept "unlimited" to activate the continuous wait.
# CLOCK-STOP SEAM ACTIVATED 2026-06-26 (task 4838): WAIT=unlimited on both gates;
# @@REIFY_CLOCK_*@@ span excluded from verify_command_timeout_secs by dark_factory:1916.
test_command: "./scripts/verify.sh test --scope branch --include-infra"
lint_command: "./scripts/verify.sh lint --scope branch --include-infra"
# type_check_command is a passing no-op (task 4063).
# Rationale: lint_command's `cargo clippy --workspace --all-targets -- -D warnings` is a
# STRICT SUPERSET of `cargo check --workspace --tests` — clippy runs the full compiler
# frontend and reports every type error cargo check would, plus lint warnings. The
# orchestrator invokes test_command / lint_command / type_check_command as THREE SEPARATE
# verify.sh processes; verify.sh's own intra-process clippy-vs-cargo-check dedup (the
# DO_TYPECHECK && !DO_LINT guard at verify.sh:351) does NOT bridge across these separate
# invocations. So the standalone `verify.sh typecheck` pass was pure redundant compile
# (~20 min cargo check --workspace --tests) on every task iteration. No-op'd here.
#
# ACCEPTED COST: type errors now fail the LINT (clippy) phase rather than a distinct
# typecheck phase, so per-phase failure attribution loses the "type errors" bucket.
# Acceptable: clippy is the stricter signal and catches everything cargo check does.
# verify.sh's `typecheck` action remains a valid standalone/manual entry point unchanged.
type_check_command: "true"

# Run test/lint/type sequentially in one verify invocation.
# Rust workspaces take an advisory lock on target/.cargo-lock, so the three
# concurrent cargo subcommands serialize anyway — parallelism just wastes CPU.
concurrent_verify: false

# Merge-role lint-first ordering (rider 1, docs/prds/merge-gate-riders.md task β / §3,
# §6 K1; DF module-config knob shipped by task α, dark_factory:2832). Precondition
# (K1): takes effect only when concurrent_verify: false (above) ∧ role=merge — under
# that precondition DF's verify.py reorders the sequential verify to lint → test →
# type and short-circuits the test+type legs as CheckRun.skipped when lint fails.
# Survey attribution (docs/notes/merge-verify-cpu-survey-2026-07.md): lint p/c=60 vs
# release nextest p/c=21 — this catches the lint-red failure class (~4.8% of merge
# failures) after ~4 min instead of after the ~50-min test phase. Task-role and
# background-role verifies are unaffected (DF scopes the reorder to role=merge only);
# the ordering/short-circuit mechanism itself is entirely DF-side. Peer module-config
# bool of concurrent_verify above, NOT a verify_env entry. Reify-side seam guard:
# tests/infra/test_merge_role_lint_first_seam.sh.
sequential_lint_first: true

# Env injected into verify subprocesses (merged on top of os.environ).
# sccache caches rustc output across worktrees; CARGO_INCREMENTAL=0 is required
# because incremental and sccache are mutually exclusive.
verify_env:
  REIFY_RUN_ALL_EXCLUDE_HOST_INFRA: "1"
  REIFY_GATE_EXCLUDE_HEAVY: "1"
  # Durable FLAKY-ledger path (merge-gate-health W5a, 2026-07-19). Without this the
  # Phase-2.5 ledger defaults to the RUNNING checkout's data/verify-logs/ — i.e. the
  # _merge-verify lane, wiped by git clean on every reseed, so the ledger (and DF 2358's
  # chronic-flake auto-filer) could never accumulate at the tier where flakes matter.
  REIFY_RUN_ALL_FLAKY_LEDGER: "/home/leo/src/reify/data/verify-logs/flaky-ledger.jsonl"
  # Durable content-skip state-ledger path (merge-gate-riders δ / task 5276, PRD
  # docs/prds/merge-gate-riders.md §4.3). Activates the merge-tier content-addressed
  # per-member SKIP engine landed INERT by γ (task 5273): run_all.sh's _ra_skip_engine
  # stays a no-op until this names a state file (two-key + state-path gate). MUST be an
  # absolute MAIN-checkout path (not an in-lane relative default) for the SAME amnesia
  # reason as the FLAKY_LEDGER above — an in-lane path lives in the _merge-verify warm
  # lane, wiped by git clean on every reseed, so the keys-only ledger could never
  # accumulate the per-member green shas across merges. The .json extension is cosmetic:
  # γ's on-disk schema is whitespace-delimited plain text (_ra_skip_read_state), never
  # JSON-parsed, and the file is git-ignored (data/verify-logs/) so it is never tracked.
  REIFY_RUN_ALL_SKIP_STATE: "/home/leo/src/reify/data/verify-logs/run-all-skip-state.json"
  # Sweep-gated delta-conditional release-pass skip (merge-gate-riders ζ / task
  # 5280, PRD docs/prds/merge-gate-riders.md §5). When DF_VERIFY_ROLE=merge and
  # the merge delta's reverse compile closure does not intersect
  # scripts/release-sensitive-crates.txt, verify.sh's _RELEASE_DELTA_SKIP
  # decision block (verify.sh:1160-1177) omits the ~17-min release nextest pass
  # and emits the plan marker "RELEASE-PASS: skipped (delta-clean)" instead
  # (verify.sh:1575-1576). Role=background NEVER skips (verify.sh S4) — the
  # main-tip background sweep re-runs the full release-sensitive set on cadence
  # as the backstop. COVERAGE IS CONDITIONAL ON THAT SWEEP BACKSTOP, NEVER
  # ABSOLUTE: this knob was activated only after task 5280's pre-1 hard
  # pre-flight re-verified (a) the sweep is green-on-cadence and (b) a red
  # sweep alerts/escalates instead of silently retrying env_transient forever
  # (post dark_factory:2821 + dark_factory:2831; PRD §5.3). Pre-flip evidence
  # recorded on task 5280 via esc-5280-7.
  REIFY_RELEASE_DELTA_SKIP: "1"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  # Toolchain-cache UNIFICATION with the sandboxed agents (task 5836). MUST stay
  # byte-identical to the role_env_overrides `&sandbox_cache_env` CARGO_HOME below
  # — a warm lane's target/ is written by the AGENT and then re-read by VERIFY, and
  # cargo's per-unit fingerprint embeds the registry source path, so any divergence
  # makes each side dirty the other's units. /tmp is not a free choice: it is the one
  # host-global writable root landlock grants the agent, so the agent side cannot
  # move and verify is the side that must meet it. Enforced from outside by
  # tests/infra/test_sandbox_cache_writability_seam.sh block (D), which reads BOTH
  # values out of this file and requires equality for every redirected role.
  # NOT mirrored: npm_config_cache — see block (E) of that guard.
  CARGO_HOME: /tmp/reify-agent-cargo-home
  # CARGO_MAKEFLAGS is owned solely by scripts/verify.sh apply_env() (single source,
  # contract C3 / task 4518 δ). It is NOT injected here; apply_env selects the role
  # FIFO at runtime (merge→/tmp/reify-jobserver-merge, task→/tmp/reify-jobserver-task).
  # Test-run semaphore knobs (REIFY_TEST_SEMAPHORE_*): tuned up from the safe
  # defaults (N=1, WAIT=1800s; scripts/lib_test_semaphore.sh) to relieve
  # sustained test-slot starvation under concurrent-verify oversubscription
  # (esc-3891-45 / esc-4673-31 / esc-4552 cluster: many code-complete tasks hit
  # exit-75 acquire timeouts). See docs/prds/test-run-concurrency-semaphore.md §5
  # for the historical knob contract (§4/§6/§7 exit-75→requeue claim is superseded
  # by docs/prds/verify-admission-wait-clock-stop.md; DF does NOT requeue exit-75).
  # 2→3 (Leo, 2026-06-25): N=2 still starved out task 4800 (and the exit-75
  # cluster) because the held slot spans the *entire* `cargo nextest run`
  # (test-binary compile+link, NOT just execution), and that compile crawls under
  # the merge-favored 8-token task jobserver pool (task_baseline=nproc//4) whenever
  # a merge verify is running. Two slots then cling for tens of minutes while ~5+
  # task verifies wait the full WAIT and exit-75. N=3 = up to 3 concurrent
  # full-workspace nextests (OCCT/manifold/openvdb heavy) — watch host RSS for OOM
  # (125G host; merge verifies run concurrently and bypass the semaphore).
  # CLOCK-STOP SEAM ACTIVATED 2026-06-26 (task 4837/4838):
  # Both admission gates now use a continuous blocking wait with
  # @@REIFY_CLOCK_{STOP,HEARTBEAT,START}@@ markers emitted to stderr;
  # dark_factory:1916 excludes this wait span from verify_command_timeout_secs.
  # WAIT=unlimited is safe post-seam: the @@REIFY_CLOCK_*@@ span is EXCLUDED
  # from verify_command_timeout_secs, so the sequential-budget constraint
  # (pre-seam: sum ≈5700 must stay < 7200) no longer applies to these waits.
  # A genuinely-wedged wait (no heartbeat within 180s idle-max) is still killed.
  # 3→2 (Leo, 2026-06-27 design-recheck): drop back to N=2. The 2→3 bump above was
  # to relieve exit-75 slot starvation — but that starvation is now handled
  # structurally by the clock-stop seam (WAIT=unlimited + @@REIFY_CLOCK_*@@): a
  # slot-starved task WAITS gracefully instead of exit-75→BLOCKED, so N's starvation
  # downside is gone. Meanwhile MEMORY is the binding constraint under load (mem PSI
  # full≈28%, 161 GiB swap on the 125 GiB host): N=3 = up to 3 concurrent
  # OCCT/manifold/openvdb-heavy nextests (≈24 OCCT threads × ~2 GiB each) over-commits
  # RAM (3×48≈144 GiB > 125), blowing the task-4503 headroom basis (proven at N=2:
  # 2×48≈96 GiB < 125). N=2 restores that headroom. Paired with the new memory-PSI
  # admission gate (task 4861) and the pending 4839 revert (task 4862 — build back
  # inside the slot).
  # 2→1 (Leo, 2026-08-19): back to the lib/PRD default. The knob was only ever
  # tuned ABOVE 1 to relieve exit-75 slot-starvation (the esc-3891-45/4673-31/4552
  # cluster, see the head of this block). That justification is spent: the
  # clock-stop seam (tasks 4837/4838, both done) turned a slot-starved wait into a
  # graceful in-process hold excluded from verify_command_timeout_secs, which the
  # 3→2 note above already recorded as "N's starvation downside is gone" — it just
  # stopped at 2 rather than carrying the same reasoning down to 1.
  # Three things now argue FOR 1:
  #  (a) N=1 is the design point, not a fallback. lib_test_semaphore.sh defaults to
  #      1, and docs/prds/test-run-concurrency-semaphore.md §5 D3 calls it "the
  #      throughput-optimal point for a startup-dominated suite (wide single runs
  #      amortize per-test init best) and the conservative host-load point
  #      (1 task ≈ 1× nproc, +merge ≈ 2×)".
  #  (b) N=2 was quietly violating the occt headroom basis. .config/nextest.toml
  #      states it as "bounds concurrent verify runs to ≤2 (1 task slot at default
  #      N=1 + 1 exempt merge); worst case 2 × 24 OCCT × ~2 GiB = 96 GiB < 125 GiB".
  #      The 3→2 note's own "proven at N=2: 2×48≈96 GiB" arithmetic counts 2 runs
  #      TOTAL and silently drops the exempt merge that the 2→3 note above had
  #      explicitly flagged — so the real N=2 worst case is 3 × 48 ≈ 144 GiB > 125.
  #      N=1 is the value that makes the documented basis true.
  #  (c) Task 4862 made this slot the memory bound ON PURPOSE. verify.sh's
  #      @@SEMAPHORE_ACQUIRE@@ block: "the held slot's whole-block serialization is
  #      the only implicit bound on concurrent RSS-heavy link waves" (reify test
  #      binaries statically link OCCT/OpenVDB/gmsh/manifold, ~1-3 GiB RSS per
  #      link). Lowering N strengthens exactly the mechanism 4862 chose.
  # ACCEPTED COST: task-role test phases now serialize host-wide (1 task + 1 exempt
  # merge). The wait is graceful, but a waiting task still occupies a warm lane and
  # an agent slot — so the signal to revisit is LANE OCCUPANCY / queue depth, not
  # exit-75 (which the clock-stop seam has already made unreachable here).
  # Nothing pins this value: every semaphore test (test_test_run_semaphore.sh,
  # test_verify_semaphore_e2e.sh) sets its own N explicitly rather than reading it.
  # PARITY REQUIREMENT (task 6393) — these three rows MUST equal the owning
  # script's :- fallback default, and tests/infra/test_verify_admission_knob_
  # parity.sh fails if they drift. Retune BOTH sides together, never one alone.
  #   REIFY_TEST_SEMAPHORE_CONCURRENCY / _WAIT -> scripts/lib_test_semaphore.sh
  #   REIFY_PSI_GATE_MAX_WAIT                  -> scripts/verify.sh psi_gate()
  # WHY: this block is injected ONLY by the orchestrator, into the verify
  # subprocesses IT spawns. A manual `verify.sh` run (the /unblock full gate,
  # a hand-run gate, a fixture) sees NONE of it and falls back to the in-repo
  # default -- so a divergence splits the fleet into two populations with
  # different admission behaviour on ONE host-global lock. Both halves of that
  # bit us on 2026-08-19: WAIT had been `unlimited` here but 1800 in the lib
  # since the 2026-06-27 seam deploy, so a manual gate burned a finite deadline
  # and exited 75 after ~55min of completed compile; and CONCURRENCY was 2 here
  # but 1 in the lib, so that same manual run polled only <lock>.slot-1 and
  # could never take .slot-2. N is the slot-file COUNT -- mutual exclusion is
  # only coherent while every participant agrees on it.
  # These rows are now REDUNDANT-BUT-CONFIRMING (they restate the in-repo
  # default). Keep them: the parity guard reads this block as one of its two
  # sides, and deleting them would make it vacuous on the yaml side.
  REIFY_TEST_SEMAPHORE_CONCURRENCY: "1"
  REIFY_TEST_SEMAPHORE_WAIT: "unlimited"
  REIFY_PSI_GATE_MAX_WAIT: "unlimited"

# Agent inner-loop jobserver wiring (dark_factory:1745). Injects CARGO_MAKEFLAGS
# into architect/implementer/debugger subprocesses so the cargo build/test/metadata
# calls the agents run DURING their TDD/plan turns draw from the shared task-pool
# FIFO instead of each running at private -j(nproc). This is a SECOND oversubscription
# source, distinct from the verify-phase wiring above: verify_env/verify.sh govern the
# verify cargo; this governs the AGENT cargo. Without it, ~24 task lanes' uncoordinated
# inner-loop rustc sustained load 104-137 on this 32-core host and starved agent CLI
# spawns pre-first-turn (the df:1745 / df:1739 0-turn wedge). JobserverConfig defaults
# enabled:false, so reify MUST opt in here — the dark-factory task could not edit this
# reify-owned file (its docstring assumed this block; it had been missing).
# Graceful degradation: agent_env() guards on `[ -p task_fifo ]` (mirrors verify.sh:431),
# so when reify-jobserver.service is down the FIFO is absent and agents fall back to the
# private pool. This therefore does NOT substitute for jobserver+canary durability; it
# only bounds agent cargo while the pool is healthy.
jobserver:
  enabled: true
  task_fifo: /tmp/reify-jobserver-task  # task-role FIFO; matches verify.sh + scripts/jobserver-balancer.py

# CPU governance — agent-launch CPU-time-share + PSI-admission config (#4633).
#
# Reify SHIPS the primitives:
#   α  scripts/cpu-admit.sh         — PSI-admission core (verify + agent paths)
#   β  scripts/agent-bin/cargo      — per-command PSI shim for agents (task 4631)
#   γ  scripts/cpu-governed-exec.sh — cgroup cpu.weight placement wrapper (task 4632)
#
# Dark-factory's ζ WIRES the agent-launch path by reading these values to:
#   1. Wrap each spawned agent in `cpu-governed-exec.sh --role <task|merge>` (γ).
#   2. Set DF_AGENT_CPU_GOVERN=<value below> in the agent environment to activate
#      the β agent-bin/cargo PSI shim inside the agent.
#
# The reify orchestrator's own Pydantic config model uses extra='ignore', so this
# unknown top-level block is tolerated at startup and is INERT until ζ reads it.
# Empirical evidence for extra='ignore': the orchestrator already runs tolerating
# similarly unknown top-level keys — 'fairness:', 'merge_train_former_enabled',
# 'merge_train_coalesce_enabled' — none of which caused a crash-loop when first
# added; extra='forbid' would have rejected them.  To confirm from dark-factory
# source: grep the ProjectConfig Pydantic model for model_config / class Config
# and verify extra='ignore' (not 'forbid').
# It is the single source of truth for knob defaults; knob NAMES here MUST match
# the env vars the scripts read, and knob VALUES must match the :-fallback defaults
# in those scripts (tests/infra/test_cpu_governance_config.sh cross-checks both).
cpu_governance:
  enabled: true
  weights:
    task: 100   # REIFY_CPU_GOVERN_W_TASK (scripts/cpu-governed-exec.sh) — task agents get weight 100
    merge: 300  # REIFY_CPU_GOVERN_W_MERGE (scripts/cpu-governed-exec.sh) — ≈3:1 merge:task, mirrors jobserver baseline
  agent_admit:
    enabled: true
    threshold: 50  # REIFY_CPU_ADMIT_AGENT_THRESHOLD (scripts/agent-bin/cargo) — avg10 % PSI ceiling for heavy cargo subcommands
  DF_AGENT_CPU_GOVERN: 1  # reify-owned value dark-factory ζ reads to enable the agent-launch spawn prefix
  # fleet_load_detector (task 5135): host-aggregate loadavg oversubscription
  # DETECTOR (scripts/fleet-load-detector.sh) — observes ALL concurrently-
  # dispatched lanes via host-global /proc/loadavg alone, no per-lane
  # enumeration needed. Knob VALUES below MUST match the script's :-fallback
  # defaults (cross-checked by tests/infra/test_fleet_load_detector.sh Block I,
  # kept self-contained rather than enlarging test_cpu_governance_config.sh).
  # A second knob, avg10_threshold (a PSI `some avg10 >= 80` arm), lived here
  # and was DROPPED by task 5985 — rationale and supporting measurements in the
  # scripts/fleet-load-detector.sh header, which is the canonical record. Block
  # I now pins that key's ABSENCE, so reintroducing it here fails the suite.
  # `enabled` is DF-consumed (not grep-checked against a reify script, exactly
  # like DF_AGENT_CPU_GOVERN above) — dark-factory L3b (out of scope for reify;
  # docs/prds/run-all-pool-contention-tiering-fix.md §9) reads this block to
  # wire the periodic invocation + dispatch-admission cap/escalation action.
  # dark-factory-orchestrator.yaml loads once at startup, so a config edit
  # needs commit-then-restart to take effect on the DF side (deploy-time
  # concern, not verified here).
  fleet_load_detector:
    enabled: true
    ratio_threshold: 4.0  # REIFY_FLEET_LOAD_RATIO_THRESHOLD (scripts/fleet-load-detector.sh)

# ── Warm-lane CoW pool (Phase 6, task ε #4663) ───────────────────────────────
# reify ships the primitives: scripts/{provision-warm-lane-fs,seed-warm-lane,
# refresh-warm-base,warm-lane-preflight}.sh.  Dark-factory ζ (#1788 task-dispatch),
# ν (#1820 re-wire to D10), and η (#1789 merge-speculation, gated on Lever C) wire
# the consumers by reading these knobs + the §9.5 lifecycle contract documented in
# CLAUDE.md "Warm-lane CoW pool" and docs/prds/warm-lane-pool-cow-seeding.md §9.3/§9.5.
# This block is LIVE: DF ζ task-dispatch wiring now reads it (pool ACTIVATED
# 2026-06-20, #4665 — see `warm_lane_pool: true` in the worktree-base section below).
# The stale `enabled: false` was removed 2026-06-23 (esc-4743-43): with ζ reading
# the block, enabled:false was a split-brain that gated off the invariant-6 cold-
# fallback, so acquire_lane hard-requeued on pool exhaustion instead of falling back
# to a cold worktree — wedging task dispatch fleet-wide.
# Knob VALUES must match owning-script defaults and the cited REIFY_* NAME must appear
# in the owning script (cross-checked by tests/infra/test_warm_lane_pool_config.sh).
warm_lane_pool:
  task_pool_size_source: max_concurrent_tasks  # D9: DERIVED from the max_concurrent_tasks cap above, read once at startup — NOT a duplicated constant
  merge_spec_pool_size_source: _MERGE_AHEAD_BOUND  # K merge-spec slots (=1 serial today; grows with Lever C)
  substrate:
    image_path: /media/leo/data_lv_1/leo/reify-warm-lanes.img  # provision-warm-lane-fs.sh --img / IMG= default
    size_gib: 4096                             # provision-warm-lane-fs.sh --size-gib / SIZE_GIB= default
    mount_env: REIFY_WARM_LANE_MOUNT           # mount-dir override env provision-warm-lane-fs.sh reads
  # sizing (β, task #5173) — resident-divergent disk-budget formula. The budget
  # itself is a RECOMPUTED quantity, never a frozen GiB/lane-count constant (P4/D8):
  #   resident_divergent_budget_gib = floor( (image_free_gib − base_gib − 2×base_gib_flip_reserve) / safety )
  #     image_free_gib, base_gib, base_gib_flip_reserve : GiB — LIVE df/du measurements, recomputed
  #       each time, NEVER frozen into config or a test. base_gib_flip_reserve ≈ one base generation's
  #       footprint; the leading 2× reserves old+new generations resident during a
  #       refresh-warm-base.sh flip.
  #     safety : dimensionless factor > 1, applied as a DIVISOR (a haircut on free headroom), NOT a
  #       subtractive GiB reserve — declared below as sizing.safety_divisor.
  #     result : resident_divergent_budget_gib is a GiB ceiling (NOT a lane count).
  #   effective_N (task) = max_concurrent_tasks + spare_warm_lanes (both above)
  #   K (merge-spec)     = _MERGE_AHEAD_BOUND (== merge_spec_pool_size_source above)
  #   ADVISORY relation the audit/admission assert: measured_resident_divergent_gib ≤ resident_divergent_budget_gib
  #   NOTE: declarative only as of task #5173 — no code in this repo yet computes
  #   resident_divergent_budget_gib or reads sizing.safety_divisor; the ADVISORY
  #   relation above is meant to be asserted by the future ζ end-to-end
  #   integration-gate task (§5/§9 DAG in the doc below), not by any landed code
  #   today. Don't assume this knob is live before that lands.
  #   Worked example — ILLUSTRATIVE ONLY (D8), a live 2026-07-11 snapshot, NOT a pinned value:
  #     image_free_gib≈462, base_gib≈108, base_gib_flip_reserve≈108, safety=1.5
  #     → floor( (462 − 108 − 2×108) / 1.5 ) = floor(138 / 1.5) = 92 GiB budget
  #   Full derivation: docs/prds/warm-lane-pool-sizing-lifecycle.md §9.2
  sizing:
    safety_divisor: 1.5  # the tunable divisor (>1) — the ONLY real policy knob here; every other
                          # quantity in the formula above is live-measured, never frozen (P4)
  defrag_extent_threshold: 64                  # refresh-warm-base.sh --frag-threshold / FRAG_THRESHOLD= default
  # Disk-pressure admission knobs (task 5175, PRD warm-lane-pool-sizing-lifecycle.md
  # §9.4) for scripts/warm-lane-disk-guard.sh. hard = space-safety ε (#4716):
  # below-floor is EX_TEMPFAIL 75 (requeue). soft = proactive throttle ε (#5175):
  # below-floor (but still above hard) is exit 3, consumed by dark-factory's θ
  # dispatch throttle to back off admission BEFORE the hard floor is ever hit.
  # soft > hard on both axes is a hard invariant (E1) enforced by `check --soft`
  # itself (exit 2 if violated). Values cross-checked against the script's `:-`
  # fallback defaults by tests/infra/test_warm_lane_pool_config.sh (B7).
  min_free_gib: 50                # REIFY_WARM_LANE_DISK_GUARD_MIN_FREE_GIB (hard floor, exit 75) (scripts/warm-lane-disk-guard.sh)
  min_free_inodes: 500000         # REIFY_WARM_LANE_DISK_GUARD_MIN_FREE_INODES (hard floor, exit 75) (scripts/warm-lane-disk-guard.sh)
  soft_free_gib: 500              # REIFY_WARM_LANE_DISK_GUARD_SOFT_FREE_GIB (soft throttle floor, exit 3; §13 Q1 tuning) (scripts/warm-lane-disk-guard.sh)
  soft_free_inodes: 5000000       # REIFY_WARM_LANE_DISK_GUARD_SOFT_FREE_INODES (soft throttle floor, exit 3) (scripts/warm-lane-disk-guard.sh)

# A′ coupling-tolerant merge train former — enabled per the s(N) go/no-go gate
# (reify esc-4455-16: GO at N=3; s(3)=0.962 ≫ 1/3, observed coupling-failure 0/104).
# Batches line-stackable merge-ready tasks into ONE full-scope merge verify to relieve
# the serial-queue backlog. Correctness is the same gate as single merges (the train tip
# is verified by verify.sh --scope all before advance). df tasks 1704-1708 landed the code.
merge_train_former_enabled: true
merge_train_coalesce_enabled: true  # dark_factory:1722; user-authorized 2026-06-10
merge_train_max_members: 3  # already the default; explicit per GO-N3

# Variable-depth speculative verify placement (task 2359) — ACTIVATE the deep
# probe (operator decision, 2026-07-19). Reify is the primary consumer: the K=2
# multi-host queue whose queues actually go deep, and the source of the 2340
# calibration (p_good≈0.97, N*≈20). probe_fraction=0.5: half of second-slot
# dispatch rounds target a deeper already-built speculative stack (probe_depths
# default [2,3,5,8]) instead of the adjacent depth-1 stack, producing genuine
# depth≥2 merge_verify records (labelled by task 2340's depth field) so
# scripts/analyze_speculation_depth.py can print the deep P(pass|depth) curve that
# validates/refutes N*≈20. suppress_flake_rate=0.40 lifts the thrash guard above
# reify's ~0.33 per-attempt verify fail rate so the probe actually fires (the 0.30
# default sat at/below the flake floor and self-suppressed).
# NOTE: 0.5 is ~5x the 2359 design-suggested bound (≤0.1); a failed deep probe
# skips the safe depth-1 item, so this trades throughput for curve data. Green-tier
# hot-reloadable (RELOADABLE_FIELDS) — live via reload_config, no restart;
# probe_fraction=0.0 reverts byte-identically.
# DEACTIVATED 2026-07-23 (operator decision): the probe CANNOT produce genuine
# depth≥2 records under K=2 — build-ahead is capped at speculation_depth, so
# probe_depths 3/5/8 never pass select_probe_depth's availability guard, and a
# firing d=2 probe is attribution-only (ProbePlacement Phase-1 limitation) with
# an off-by-one label: it relabels an ordinary 2-item adjacent verify as depth=2,
# corrupting analyze_speculation_depth.py's depth calibration. Its 5 collected
# events (all 2026-07-22) are 2-item trees, not the 3-item trees the depth=2
# label implies — exclude label≥2 events from calibration. Deep P(pass|d) is
# being measured instead by the offline replay study (reify-replay-study unit).
speculation_probe:
  probe_fraction: 0.0
  suppress_flake_rate: 0.40

# Per-role USD budgets. architect 15 -> 25 (2026-08-19, Leo approved, esc-6090-3).
#
# Same failure class as the reviewer 5 -> 12 bump in dark-factory defaults.yaml:
# a budget-exhausted run burns the FULL ceiling, yields nothing, and then costs a
# human triage cycle — so a ceiling that sits barely above the largest legitimate
# run is a net spend INCREASE, not a saving.
#
# Evidence (reify runs.db invocations/events, role=architect):
#   - since 2026-08-01: n=504, mean $4.45, p50 $3.72, p95 $10.64, max $15.79.
#     $25 is ~2.3x p95 — a runaway guard normal operation never touches, so this
#     raises the ceiling for ~0.6% of runs and typical spend not at all.
#   - budget exhaustions all-time: 18. They cluster at ~$12 (Apr-Jul, when the
#     ceiling WAS $12); after the 12 -> 15 raise only three recurred — 4370
#     ($16.71), 5208 ($17.17), 6090 ($15.79). This is the second raise for the
#     same mode, and the first one measurably worked.
#   - worst overrun ever observed is $2.17, so $25 leaves ~44% headroom over it.
#
# Trigger: task 6090 (Direction ruling, 5 work items / 13 files) died at
# cost_usd=15.79 / turns=68 — ONE call short of commit_planning, with a complete
# 15-step plan that was then lost with its reclaimed lane. Dollars were binding
# there, not turns.
#
# Load-once config, but budgets.* is on the code-owned green-tier hot-reload
# allowlist (dark-factory config.py RELOADABLE_FIELDS, _submodel_leaf_paths(
# 'budgets', BudgetsConfig)), so this takes effect via the escalation MCP's
# reload_config — no orchestrator restart required.
#
# implementer 10 -> 25 (2026-08-20, Leo approved, esc-5495-3). The same
# per-call-ceiling-below-the-true-cost-of-the-call family, now the TIGHTEST
# remaining ceiling in the table. Evidence (reify runs.db invocation_end,
# role=implementer, 30d to 2026-08-20):
#   - successful runs cost p50 $2.99, p90 $8.26, p95 $9.20, p99 $9.88,
#     max $9.99 against a $10.00 ceiling. The cap sits INSIDE the 99th
#     percentile of NORMAL SUCCESSFUL operation, which makes it a throttle,
#     not a runaway guard — and that "max $9.99" is CENSORED BY THE CAP, so
#     true demand is unknown and certainly higher.
#   - 27 invocations died at error_max_budget_usd ($10.01-$10.98), burning
#     $273.07 for zero output, then retrying. Two of them on 2026-08-20.
#   - the routing policy rules (`large-plan-modules`, `large-plan-steps`)
#     already grant big implementer runs 120 turns instead of 80, but they do
#     NOT raise the dollar ceiling — so precisely the runs judged to need more
#     turns are the ones that die on dollars. 813 of 1176 dispatches take that
#     turn-bumped path.
# $25 is ~2.7x p95 and matches the architect's ceiling, whose p95 ($10.64) is
# the same order — a runaway guard normal operation never touches. Sized for
# reify only; whether the fleet-wide default (10.0, defaults.yaml) wants the
# same treatment is a dark-factory question, deliberately not decided here.
budgets:
  architect: 25.0
  implementer: 25.0

# Per-role turn budgets. Raising the architect budget is a direct response to
# silent max_turns exits on large-scope tasks (e.g. reify 1749): the architect
# now has headroom to verify premises and produce a plan without the CLI
# truncating mid-tool-call.
#
# reviewer 30 -> 45 (2026-08-07, Leo approved, esc-5905-3): the same failure
# mode, now measured on the reviewer. REMOVED 2026-08-20 (Leo approved,
# esc-5495-3) — dark-factory raised the FLEET default to 60 on 2026-08-17
# (defaults.yaml:374, commit 0156097916), so this project-local 45 stopped
# being a raise and became a CAP BELOW THE FLEET BASELINE: reify was silently
# opting out of a fleet-wide fix. Measured while it was still live: reviewer
# successes ran p90=42, p95=43 against the 45 wall, and the wall fired 4 times
# in 3 days (turns=46, one past the cap) burning $8.35/$8.09/$9.08/$10.41 —
# firing at the p90-p95 of normal successful operation, i.e. a throttle again.
# Deleting the key rather than restating 60 is deliberate: it means reify
# tracks future fleet re-baselines instead of shadowing them. The commentary
# below is retained because it documents WHY a reviewer override is spelled
# `reviewer` — read it before ever adding one back.
#
# THE KEY IS THE COLLAPSED `reviewer`, NOT `reviewer_comprehensive`. routing.py's
# _config_key() maps every role whose name starts with "reviewer" to the single
# `reviewer` config key ("byte-equivalence, invariant 3"), so TurnsConfig has no
# per-specialization reviewer field at all — a `reviewer_comprehensive:` key here
# is silently DROPPED by pydantic extra=ignore (caught by the config-key census
# as esc-config-unknown-keys-startup-2 on the first attempt at this change).
# Consequence: this necessarily raises EVERY reviewer specialization; it cannot
# be scoped to one. That is acceptable because reviewer_comprehensive is the only
# reviewer active in this project.
# NOTE the sibling agent_env block below DOES key on `reviewer_comprehensive` —
# the two namespaces use different role vocabularies. Do not copy one to the other.
# Evidence (esc-5905-3, task 5905): 4 of 5 reviewer_comprehensive runs died at
# maxTurns=30 (turnCount=31) on a 13-file/+432-131 diff, each leaving $2.3-2.9
# of its $5 budget UNSPENT — turns were binding, not dollars. The single run
# that completed needed nearly the whole 30. Worse, its successful verdict
# (ISSUES_FOUND, 0 blocking) was then destroyed by the pre-respawn
# clear_verdict(), so the gate reported a bogus ERROR. Recurrence: same class
# in esc-5481-8 (task 5481) and esc-5891-3/5/6 (task 5891) — see curator gate
# esc-6066-1.
#
# architect 120 -> 180 (2026-08-19, Leo approved, esc-6090-3): the COMPANION to
# the budgets.architect 15 -> 25 raise above. Two points, both measured:
#   (1) Turns are ALREADY independently binding on the architect, exactly as they
#       were on the reviewer: three runs hit error_max_turns since 2026-08-01
#       (6095 $9.62, 5685 $11.42, 5777 $9.71) — each died at the 120-turn wall
#       with $3.5-5.4 of its $15 budget UNSPENT. Turns were binding, not dollars.
#   (2) Raising the dollar ceiling ALONE would just move task 6090's death from
#       the budget wall to the turn wall: it spent $15.79 over 68 turns, so
#       reaching $25 at that rate needs ~108 turns — inside 120, but with no
#       margin, and later turns cost more as context grows.
# Sizing mirrors the budget raise: architect turns since 2026-08-01 are p50=48,
# p95=100, max=155 (n=509), so the old 120 sat barely above p95 while 155 already
# overran it. 180 is ~1.8x p95 and clears the observed max — a runaway guard,
# not a working limit.
#
# Load-once config, but max_turns.* is on the code-owned green-tier hot-reload
# allowlist (dark-factory config.py RELOADABLE_FIELDS, _submodel_leaf_paths(
# 'max_turns', TurnsConfig)), so this takes effect via the escalation MCP's
# reload_config — no orchestrator restart required.
max_turns:
  architect: 180

# Per-role agent wall-clock timeout overrides (task 5157, 2026-07-08, Leo
# approved — verify-flakiness survey follow-up, esc-4827 class).
#
# Root cause (established by /deb; see the DF fix task "Working-regime
# progress-extended deadline + truthful ceiling-kill reporting", which
# SUPERSEDES this stopgap once landed): dark-factory kills agent runs at an
# ABSOLUTE per-role wall-clock ceiling regardless of progress
# (defaults.yaml timeouts: implementer/debugger=1200s, unblock_auto.
# timeout_seconds=600s). Reify's compile-heavy iterations routinely need
# >20min — verify alone is budgeted verify_command_timeout_secs=7200s above
# — so productive sessions with 26-100 transcript turns were killed mid-run
# and misreported as "error_empty_output, 0 turns": 200 such kills across
# 72 reify tasks since 2026-06-09, exhausting max_execute_iterations and
# landing complete work in BLOCKED/L2 (task 4827).
#
# implementer/debugger 1200 -> 7800 (verify's real 7200s budget + 600s
# headroom — see the 2026-07-09 amendment below); unblock_auto.
# timeout_seconds 600 -> 1800. Genuine startup wedges are still caught by
# the separate startup_grace_secs (120s, unchanged) — this only lengthens
# the leash on runs that have already proven liveness.
#
# 2026-07-09 review amendment (task 5157): two corrections from the first
# landing of this override.
# (1) implementer/debugger was originally set to 3600 with this comment
#     claiming it "matches reify's own verify_command_timeout_secs
#     budget" — that budget was actually bumped 3600 -> 7200 back on
#     2026-06-19 (see the verify_command_timeout_secs comment above), so
#     the cited figure was stale. 3600 left implementer/debugger UNDER the
#     real verify ceiling rather than equal to it: a verify call running
#     anywhere in the 3600-7200s range would still hit the role ceiling
#     first, reproducing the exact misreported-kill symptom this task
#     exists to fix. Corrected to 7800 so a verify call that runs right up
#     to its own timeout still has room to be reported before the role
#     ceiling also fires, instead of racing it.
# (2) architect is intentionally NOT covered by this override:
#     defaults.yaml already gives architect a 2400s ceiling (2x
#     implementer/debugger's pre-amendment 1200s default), architect
#     doesn't run the compile-heavy verify commands that are this task's
#     documented root cause, and it's separately bounded by reify's own
#     max_turns.architect=120 above (stale cite: 180 since 2026-08-19, see
#     the max_turns block). Revisit if architect sessions start
#     showing the same 0-turn misreported-kill signature.
#
# 2026-09-01 amendment (task 7182, esc-5469-10, Leo approved): the (2)
# revisit trigger fired, and its rationale is falsified for reify —
# architects here DO run compile-heavy commands during planning premise
# verification (esc-5469-6: cargo build + two full test suites inside an
# architect run). Fleet data since 2026-07-01: 2450 architect successes, 44
# legitimately past 2400s (max 5331s), 4 timeout kills — each discarding the
# entire plan product (--print emits stdout only at process end, so a
# SIGTERM yields nothing; DF task 2360). Semantics, source-verified: a
# timeouts.<role> value is NOT a total-wall-clock cap. It feeds the
# working-regime watchdog as the transcript-SILENCE bound
# (idle_bound = max(working_idle_secs, timeouts.<role>),
# cli_invoke.py:3851-3852) — a single long synchronous tool call (cold
# cargo test) with no new assistant turns reads as "idle" and is killed at
# that bound. Total runtime is capped independently by
# invocation_timeout=7200 (config.py:4397, RED-tier/restart-only), so any
# per-role value >= 7200 (including the 7800s above) effectively means
# "absolute cap governs". architect: 7200 makes the silence bound
# coincide with the cap — the honest maximum.
#
# Hot-reload note (corrects the stale "Load-once config" claim that stood
# here): timeouts.* is on the code-owned green-tier allowlist
# (dark-factory config.py RELOADABLE_FIELDS via
# _submodel_leaf_paths('timeouts', TimeoutsConfig)), so this block takes
# effect via the escalation MCP's reload_config — no orchestrator restart
# required. Always read the returned applied/restart_required dispositions.
timeouts:
  implementer: 7800
  debugger: 7800
  architect: 7200
  # 2026-09-03 incident (task 6644 / esc-6644-3, Leo approved): the PRE-turn-1
  # startup grace, NOT a silence bound. The three values above feed the
  # WORKING-regime watchdog and only latch once an assistant turn is seen
  # (cli_invoke.py:3813/:3852); until then this separate, much shorter bound
  # governs (cli_invoke.py:3829: `not seen_turn and live_turns == 0 and
  # elapsed >= startup_grace_secs`), so architect: 7200 is inert against it.
  #
  # WHY RAISED 120 -> 450. An upstream claude-opus-5 degradation (HTTP 500 from
  # ~13:24 UTC escalating to 529 Overloaded) starved agents of a first
  # transcript turn; the 120s grace then SIGTERMed them MID-RETRY. Measured
  # blast radius: 86 kills / 25 tasks / 2 projects / 3 roles in one 2.5h window,
  # 100% opus (sonnet 0/17, null-model 0/39) — against a base rate of 0-6/day,
  # with a structurally identical precedent burst on 2026-08-24 (60 events).
  # The kill is worse than the delay it prevents: it lands BEFORE the CLI can
  # surface `API Error: 529`, so no api_error_status is ever recorded, which
  # simultaneously defeats the scheduler's transient-requeue lane
  # (scheduler.py:465, matches only `agent API error: HTTP \d{3}`) and DF task
  # 3316's 5xx-requeue fix. A task 6644 sibling steward that outlived the grace
  # did surface the 529 — after 209s. 450 clears that observed retry span with
  # margin, and is chosen for robustness under CPU starvation: a first turn can
  # also be legitimately slow when the box is oversubscribed, and killing a
  # healthy-but-starved agent costs a whole plan (--print emits stdout only at
  # process end, so a SIGTERM yields nothing; DF task 2360).
  #
  # COST OF BEING WRONG is bounded and small: a genuine from-source-build / uv /
  # MCP-startup wedge — the case this grace exists to catch — now burns 450s
  # instead of 120s before the kill. That is cheap against the alternative
  # observed here, which is a terminal BLOCKED task plus an L2 escalation plus a
  # human unblock session, because the planning path has no retry for this shape
  # (_ARCHITECT_TRANSIENT_RETRY_KINDS, workflow.py:299-303, excludes TIMED_OUT).
  #
  # Green-tier: timeouts.startup_grace_secs is in RELOADABLE_FIELDS via
  # _submodel_leaf_paths('timeouts', TimeoutsConfig) — verified directly, not
  # assumed. Applies via the escalation MCP's reload_config, no restart.
  startup_grace_secs: 450

unblock_auto:
  timeout_seconds: 1800

# Scheduler v2 (eager parks, cross-tier preemption, owner-state GC sweep) is
# UNCONDITIONAL in dark-factory since 2026-05-30 — there is no flag to set.
# The former `fairness.scheduler_v2` knob was real and load-bearing for 17 days
# (2026-05-13 -> 05-30), then retired: DF 29b85d256b dropped the gate,
# 44ee41c83a removed the field, b8f3f0800a stripped it from defaults, and
# test_scheduler.py::test_scheduler_v2_field_removed now pins its absence.
# Reify gets v2 behaviour regardless. Removed 2026-07-29 (Leo) — it had been
# inert for ~2 months and read as a live knob. The only real fairness tunable
# left is `fairness.skip_threshold` (per-tier; unset here, so package defaults
# apply).

# Starvation watchdog — raise the wall-clock TIME threshold from the 1800s (30min)
# package default to 24h (Leo, 2026-07-03). Rationale: _skip_count increments ~1/tick
# (~15s), so the 50-skip count threshold is reached in well under an hour of normal
# broad-footprint lock contention (e.g. the reify-eval cluster) — not a real stall.
# Firing an INFO/L2 starvation escalation that fast is noise; a genuine wedge shows as
# 24h+ continuous eligibility. enabled/skip_threshold kept explicit so a shallow config
# merge can't silently disable the watchdog or reset the count threshold. Loads at next
# orchestrator restart (dark-factory-orchestrator.yaml is load-once, no hot-reload).
starvation_watchdog:
  enabled: true
  skip_threshold: 50
  idle_secs: 86400.0

# Dispatch-admission gate (PsiAdmissionConfig; DF tasks 2327/2328). PROVISIONAL
# TUNING, Leo 2026-08-03 — green-tier hot-reloadable, so retune via
# mcp__escalation__reload_config without a restart.
#
# cpu_some_avg10: the shipped default 85.0 has NEVER fired on this host. Measured
# CPU PSI `some` avg10, two 1 Hz samples: 2026-07-31 (load ~85) min 5.5 / med 46.3
# / max 68.9; 2026-08-03 (load ~190) min 62.2 / med 66.8 / max 74.1. The
# distribution SLIDES with load rather than spreading, so every value below 62 is
# a total gate on a busy day and every value above 69 is dead on a quiet one.
# Fraction of ticks the gate would hold — 55: 22.2%/100%, 60: 13.9%/100%,
# 65: 1.9%/68.1%, 70: 0.0%/13.5%, 75: 0%/0%. 70 is the only value inert when
# quiet yet engaged when busy. NOTE CPU PSI `full` is always 0.00 by kernel
# definition (something is always runnable) — only `some` is usable for CPU.
#
# min_inflight_floor: raised 1 -> 3. The gate defers NEW dispatch while saturated;
# in-flight drains only as tasks finish, so the floor is "always allow dispatch
# below N", a safety net rather than a target. It is PER-ORCHESTRATOR and seven
# orchestrator services run here, so 3 is up to 21 guaranteed in the worst case —
# though five of the seven draw 0.18 cores combined, making the realistic figure ~6.
#
# mem_some_avg10 (15.0), mem_full_avg10 (3.0) and io_some_avg10 (40.0) are LEFT AT
# DEFAULTS deliberately: mem_full=3.0 is exactly the operator's P1 target expressed
# as a threshold, and both memory axes are correctly specified as hard trips that
# should fire only when P1 is actually breached (2026-08-03: mem full med 0.6,
# max 1.9 -> fires 0%; mem some max 2.9 -> fires 0%).
#
# DURABLE FIX PENDING: a fixed CPU-PSI threshold is fragile because the variable
# tracks load instead of discriminating it. The runqueue ratio keeps a stable
# meaning (2.4x quiet vs 7.1x busy) and reify already ships the detector
# (scripts/fleet-load-detector.sh); dark_factory:3590 adds the consumer axis.
psi_admission:
  cpu_some_avg10: 70.0
  min_inflight_floor: 3

# ── Lever C (multi-host post-merge verify) — ENABLED 2026-06-10 ───────────────
# leo-laptop is a second verify host. Parity-proven 5/5 (dark-factory
# docs/verdict-parity-report.md, 2026-06-10); the operator enable path landed via
# df task 1716 (merge 26894cceec). Schema RECONCILED to the landed
# VerifyRunnerConfig + verify_drift_check_every_n_lands — the staged proposal's
# `drift_check_every_n_lands` key would have been silently dropped (extra='ignore').
# K = 1 + enabled runners = 2 (LocalRunner trust-anchor on the workstation +
# leo-laptop). Fail-safe: an unreachable laptop falls back to local, never stalls.
verify_runners:
  - name: laptop
    ssh_host: leo-laptop
    git_remote: leo-laptop
    config_path: /home/leo/.config/orchestrator/reify-laptop.yaml
    enabled: true
verify_drift_check_every_n_lands: 20
#
# verify_cross_check_remote_green: DISABLED 2026-08-21 (Leo) as an interim
# mitigation for dark_factory:4579. The task-2822 per-land cross-check re-verifies
# every non-trivial remote green with a full LOCAL verify, inside the merge
# worker's awaited verify_task. That local leg is invisible to merge_queue's
# in-flight no-progress detector (its content-mtime probe is gated behind
# `if lease.is_local:` while the lease is remote), so the 1800s budget SIGKILLs a
# healthy cross-check every time and 3 strikes finalize the request 'blocked'
# with a false "repeated dead/hung in-flight verify".
# MEASURED: 13 confirmed cross-check starts since 2026-07-20 -> ZERO verdicts;
# laptop-attributed lands went 57 (5 weeks pre-2822) -> 1 (month post-2822), and
# that one was a 4s trivial pass which the `not verify.trivial` guard skips.
# Specimen: mr-945466ca / task 6393, three passing ~17.4-min remote verifies
# discarded 2026-08-20.
# TRADE-OFF, EYES OPEN: this reverts to the PRE-2822 safety posture — a single
# host's green decides a land, with verify_drift_check_every_n_lands (20) above as
# the only standing fidelity guarantee. That is the configuration in which #5120
# landed a red commit off a laptop false green. Accepted because the cross-check
# is currently contributing zero verdicts anyway, so no real corroboration is
# being given up, while the false 'blocked' verdicts and the wasted ~47 min per
# remote green are real.
# REVERT THIS (back to true) once dark_factory:4579 lands and reify redeploys.
verify_cross_check_remote_green: false

# Pre-merge rebase-and-reverify: run it ONCE and never repeat it (Leo, 2026-09-06,
# applied to reify after the same ruling on dark-factory). workflow.py's merge
# phase rebases the task branch onto main and runs a full task-role scoped
# verify (admission-gated) BEFORE submitting to the merge queue; the stock loop
# repeats that whole cycle up to max_pre_merge_retries times whenever main moved
# during the verify. MEASURED on the shared workstation 2026-09-06: the
# "main moved during pre-merge rebase, retrying" line fired 29 times in one day
# for dark-factory alone, each retry a 40-90 min verify under load. With 1 the
# loop runs one rebase+verify; if main moved meanwhile the task submits anyway
# with pre_rebased=False and the merge queue's own rebase + post-merge verify
# (which happens regardless) is the one that lands it. NOT in RELOADABLE_FIELDS
# -- takes effect at the next orchestrator restart. Follow-up lever (dark_factory
# task 5098, the dispatch/speculation policy PRD): whether the pre-merge verify
# should run at all when the queue re-verifies on landing.
max_pre_merge_retries: 1
#
# sccache shared backend (κ): both hosts share a redis cache so the laptop free-rides
# the workstation's warm compilation artifacts. ENABLED 2026-06-10 alongside the C enable.
# Requires the workstation sccache server to be (re)started with this backend (the running
# server's backend is fixed at start). Correctness: sccache is input-hashed (caches
# compilation, not verdicts); the drift detector (every 20 lands) is the standing fidelity
# guarantee for this env change (the D6 parity was proven pre-sccache).
sccache:
  enabled: true
  backend_env:
    SCCACHE_REDIS: redis://leo-workstation.tailb08a6b.ts.net:6380
# ──────────────────────────────────────────────────────────────────────────────

# Trailing-24h spend ceiling. Default $200 was a backstop from before the
# multi-account failover landed — with Anthropic's per-account caps as the
# real spend governor, the orch-level dollar guard just trips during normal
# operation. Raised to effectively-disabled. The watcher ceiling
# (watcher_daily_cost_ceiling_usd, default $50) ALSO tripped during the
# 2026-06-20 warm-lane-outage AFK window: cost_ceiling_watcher_exceeded ->
# pause_scheduler, which halted BOTH task dispatch AND the L1 auto-watcher for
# hours. Per-account caps are the real governor, so this guard only false-trips
# during normal long operation. Raised to effectively-disabled too (Leo: "it's
# never run away, just let it work").
orch_daily_cost_ceiling_usd: 10000.0
watcher_daily_cost_ceiling_usd: 10000.0

# Usage cap / multi-account failover
# 7 automation accounts (B→C→D→E→F→G→H); A reserved for INTERACTIVE use only.
# Evals have NO dedicated account — they draw on this same pool and must be
# robust to cap/429 events (ruling 2026-08-30, task 4741). Authoritative pool
# list: config/usage-accounts.yaml, which here is a symlink to dark-factory's.
# When one account hits its cap, UsageGate rotates to the next in list order.
usage_cap:
  enabled: true
  wait_for_reset: true
  probe_interval_secs: 300
  max_probe_interval_secs: 1800
  accounts_file: "${USAGE_ACCOUNTS_FILE:/home/leo/src/reify/config/usage-accounts.yaml}"

# Fused memory HTTP server (systemd service on port 8002)
fused_memory:
  url: "http://127.0.0.1:8002"
  project_id: "reify"
  server_command: []

# Sandbox (landlock: kernel-enforced whole-filesystem read-only except each
# task's own writable scope; see PRD os-sandbox-worktree-containment, task γ6)
sandbox:
  enabled: true
  backend: landlock

# Sandbox companion (task γ6a): toolchain-cache redirect. Covers 7 of the 9
# dispatch roles in DF's ROLES registry (roles.py, the `ROLES` dict) —
# implementer, debugger, simple_task, architect, reviewer_comprehensive,
# judge, merger. NOT covered: steward, deep_reviewer.
#   merger was added by task 6275, which re-evaluated an exclusion whose
#   rationale task 5836 had INVERTED (5836 moved verify_env.CARGO_HOME onto
#   /tmp, the very divergence the exclusion existed to prevent) and resolved
#   it by redirecting merger rather than restoring the exclusion.
#   That is the conclusion only. The full re-analysis — why ADD beat
#   restore-the-exclusion, the roles.py cites showing the exposure is
#   reachable rather than theoretical, and merger's own measured exposure —
#   lives in ONE place, the header of
#   tests/infra/test_sandbox_cache_writability_seam.sh (SECOND COUPLING). Do
#   not restate it here; the two copies drifted once already, and repairing
#   that drift is what #6275 had to spend a commit on.
#   The covered/uncovered split above is no longer prose-only: that suite's
#   block (C) pins it mechanically (KNOWN_DISPATCH_ROLES minus
#   CACHE_REDIRECT_ROLES == UNCOVERED_DISPATCH_ROLES), so adding or removing
#   a role here without updating both sides now fails a test.
#   EFFECT IS NOT UNIFORM, and no entry here is merely "pending the DF-side
#   sandboxed=True flip": workflow.py:_build_agent_env merges
#   role_env_overrides.get(role.name, {}) LAST for EVERY role, sandboxed or
#   not. Per role, as of tasks 5858 and 6275:
#     implementer / debugger / simple_task — roles.py sandboxed=True TODAY;
#       the redirect is what keeps them building at all.
#     architect — NOT sandboxed yet, but has unrestricted Bash
#       (roles.py, ARCHITECT.allowed_tools), so this entry is LIVE from the
#       next orchestrator restart: it moves the architect's ad-hoc cargo/npm
#       off the warm ~/.cargo (1.3G) / ~/.npm (6.0G) onto the shared /tmp
#       pair. Accepted because that /tmp cache is already warmed by the three
#       sandboxed roles above (so the architect inherits a warm cache, not a
#       cold one), and its exposure to the tmpfiles age-deletion gap below is
#       exactly the one implementer already carries.
#     merger — NOT sandboxed either, but likewise has unrestricted Bash
#       (roles.py, MERGER.allowed_tools) and a system prompt that directs it
#       to run tests after resolving a conflict, so this entry is LIVE from
#       the next orchestrator restart, on the conflict-resolution path.
#       Accepted on exactly the architect's grounds (the /tmp pair is already
#       warm, so merger inherits a warm cache rather than paying a cold
#       start) and carrying exactly the same tmpfiles age-deletion
#       exposure.
#     reviewer_comprehensive / judge — read-only tool grants
#       (roles.py, _READ_ONLY_TOOLS; Bash scoped to `git:*`), so neither
#       can invoke cargo or npm at all. Genuinely inert today AND after a
#       sandboxed=True flip; kept as defense-in-depth against a future
#       tool-grant widening, NOT because either would otherwise die on a
#       cargo write.
#   The key is `reviewer_comprehensive`, NOT the collapsed `reviewer` (which
#   validates silently against DF's KNOWN_ROLE_NAMES yet delivers nothing).
#   The full coupling analysis — that trap, why `judge` is safe despite
#   workflow.py's "do not add 'judge' to role_env_overrides" comment, and
#   what this seam still cannot observe — lives in
#   ONE place, the header of
#   tests/infra/test_sandbox_cache_writability_seam.sh (the file whose
#   assertions enforce it). Do not restate it here; the two copies drifted
#   once already.
#   WHY: compute_write_set (DF-owned, orchestrator/agents/write_set.py)
#   grants worktree + <base>/.task-meta/<name> + main .git carve-outs +
#   ~/.cache/uv + ~/.claude/fleet + /tmp + /dev, and NOTHING under
#   ~/.cargo or ~/.npm; without this redirect a sandboxed agent that
#   adds/bumps a dependency dies on an opaque EACCES mid-build (reproduced
#   on this host: `cargo fetch` exit 101 — Permission denied (os error 13)
#   opening ~/.cargo/registry/cache/index.crates.io-*/hex-literal-0.4.1.crate;
#   `npm install` exit 1 — ~/.npm/_logs unwritable). Warm paths still
#   succeed, so this bites exactly on dependency-adding / cold-cache tasks.
#   Upstream fix (add ~/.cargo + ~/.npm carve-outs to compute_write_set
#   directly, which would retire this whole redirect): dark_factory:3162.
#   WHY THIS LEVER: role_env_overrides is merged LAST by DF's
#   workflow.py:_build_agent_env for every role. verify_env (above) is the
#   WRONG surface for THIS problem — verify subprocesses are not sandboxed,
#   so setting CARGO_HOME there would not stop a sandboxed AGENT dying on an
#   unwritable ~/.cargo. (verify_env does now carry the same CARGO_HOME, but
#   for the unrelated task-5836 reason recorded above: fingerprint agreement
#   over the shared warm target/, not write access.)
#   WHY /tmp: it is the one host-global writable root in the write set, so
#   the two dirs are shared across warm lanes and warm ONCE rather than
#   per-lane; cargo's own .package-cache flock serializes concurrent access
#   exactly as it already does for the shared ~/.cargo today (no new
#   contention).
#   KNOWN GAPS (tracked, not yet fixed — ticket tkt_0RRSYZX0Y446V2HSW0GHHNRYYH):
#     - COST is worse than "one-time": /usr/lib/tmpfiles.d/tmp.conf on this
#       host reads `D /tmp 1777 root root 30d`, confirmed to empty /tmp at
#       EVERY boot, not just on rare wipes — so the first dependency-
#       touching agent run after every reboot re-downloads the crates.io
#       index + dep tree on a live task's critical path, and a second full
#       copy of ~/.cargo (1.3G measured) / ~/.npm (6.0G measured) now
#       accumulates permanently under /tmp alongside the originals.
#     - The same tmpfiles rule also age-deletes /tmp CONTENTS while the
#       orchestrator stays up, which can partially gut a populated cargo
#       registry (source files removed under registry/src/<crate>/ while
#       that crate's .cargo-ok marker survives) or npm's cacache store,
#       producing missing-source build failures that don't look like a
#       cache problem and surface only after long uptime.
#     - Mirroring CARGO_HOME into verify_env was once deferred here on
#       blast-radius grounds. That deferral is REVERSED as of task 5836:
#       verify_env above now carries the same CARGO_HOME. The original
#       weighing was not wrong, it was INCOMPLETE — it compared the /tmp
#       double-copy DISK cost against the merge gate's blast radius and
#       never weighed FINGERPRINT INVALIDATION at all, because nobody had
#       measured it yet. Measured since: cargo's per-unit Fingerprint
#       embeds the registry source path ("Dirty <crate>: the path to the
#       source changed"), so a CARGO_HOME split dirties all 685 registry
#       deps in Cargo.lock and cascades into every workspace crate that
#       depends on them. And because `-C metadata` is CARGO_HOME-
#       INDEPENDENT, both homes write the SAME .fingerprint file and
#       overwrite each other — so the thrash is BIDIRECTIONAL and
#       recurring (measured a->b->a, dirty each time), not a one-time
#       switching cost. That also rules out "just warm two caches": one
#       target/ holds exactly one fingerprint set per unit.
#       Seeding cannot substitute for agreement: this was never an mtime
#       problem (extracted sources carry cargo's canonical fixed stamp and
#       already match across both homes), so task 5729's cache seeding
#       fixes cold START and leaves fingerprint IDENTITY untouched.
#       Scope: CARGO_HOME only. npm_config_cache is deliberately NOT
#       mirrored — npm has no path-keyed fingerprint equivalent, so
#       widening the merge gate to it would buy nothing; that absence is
#       pinned by block (E) of the seam guard so any future change arrives
#       with its own evidence.
#       Accepted cost: the current warm base was built under ~/.cargo, so
#       the FIRST merge-verify after the activating restart pays ONE full
#       cold rebuild to establish a /tmp-pathed base, which
#       refresh-warm-base.sh then promotes normally. Steady state removes
#       two full dependency-tree rebuilds per sandboxed task.
#       Restart-tier, so this lands INERT and the operator picks when that
#       one-time cost is paid.
#       Full analysis lives in the seam-guard header, not here.
#   XDG_CACHE_HOME (task 5909): compute_write_set() grants ~/.cache/uv but
#   NOTHING under ~/.cache/tree-sitter, so a sandboxed role's grammar probe
#   dies writing ~/.cache/tree-sitter/lock (the failure behind tasks
#   5894/5904/5897 — test_prd_capability_check.sh, test_prd_gate_corpus.sh,
#   test_prd_gate_compiler_type_hygiene.sh).
#     WHY THIS VARIABLE: tree-sitter 0.26.8 (on PATH at
#     /home/leo/.cargo/bin/tree-sitter) exposes no tree-sitter-specific
#     cache-dir env var, so XDG_CACHE_HOME is the only lever — MEASURED on
#     this host to relocate its lib/ + lock/ dirs and to create the whole
#     tree when the root is absent (no provisioning step needed).
#     UPSTREAM: cross-repo task 5896 adds the ~/.cache/tree-sitter
#     carve-out to compute_write_set() directly; landing it retires this
#     leg of the redirect (same shape as dark_factory:3162 above for
#     ~/.cargo/~/.npm).
#     DELIBERATELY NOT SEEDED: unlike CARGO_HOME/npm_config_cache, this dir
#     gets no pre-seed and no tmpfiles `x` age-clean exclusion in
#     scripts/setup-agent-cache-redirect.sh — the tree-sitter cache is
#     DERIVED and self-healing (a missing lib/*.so is simply recompiled
#     from grammar source), so neither fix the seeder exists to provide
#     applies. Adding a third seeder destination would also turn
#     tests/infra/test_agent_cache_redirect.sh's G2/G3 ("exactly two
#     destination dirs", "conf paths == seeder destinations") red for no
#     benefit — do not "complete the pattern" here.
#   UV_CACHE_DIR (task 5909, COUNTER-redirect, NOT another /tmp redirect):
#   XDG_CACHE_HOME above is a GENERAL variable and uv honours it too;
#   compute_write_set() row 7 already grants ~/.cache/uv — 159G measured
#   on this host, the LARGEST single entry under ~/.cache — so without this
#   pin the XDG_CACHE_HOME redirect would silently move uv's cache OFF its
#   own grant and into /tmp, where this block's KNOWN GAPS tmpfiles rule
#   (`D /tmp 1777 root root 30d`) both wipes at boot and age-deletes
#   contents mid-uptime — the same partial-gutting hazard already
#   documented above for the cargo registry, on a cache that currently has
#   a working grant. Pinning UV_CACHE_DIR (uv's highest-precedence cache
#   override) back at its granted path contains that collateral.
#   Deliberately NOT pinning SCCACHE_DIR even though ~/.cache/sccache
#   exists and would also follow the XDG redirect: ~/.cache/sccache is NOT
#   in compute_write_set(), so a sandboxed role cannot write it today
#   regardless — pinning it back at ~/.cache/sccache would name an
#   UNGRANTED path and be strictly worse than letting it follow the
#   redirect. (sccache is a client/server daemon; storage lives with the
#   already-running server, which this yaml points at a redis backend via
#   sccache.backend_env.)
#   PER-ROLE EFFECT OF THIS PAIR (task 5909, count updated by 6275; the
#   anchor now feeds SEVEN roles, not the three it fed when these two keys
#   were written): both keys ride the shared `&sandbox_cache_env` anchor, so
#   they reach every aliased role — including any role added to the alias
#   list later, which is how `merger` picked this pair up without 6275
#   naming either key.
#   The split is NOT the same as the CARGO_HOME/npm_config_cache split
#   recorded above, so it is recorded separately rather than by reference:
#     implementer / debugger / simple_task — load-bearing, the whole point:
#       without the redirect their grammar probe dies on ~/.cache/tree-sitter.
#     architect — LIVE from the next restart (unrestricted Bash), and unlike
#       the cargo/npm pair it lands COLD: /tmp/reify-agent-xdg-cache is
#       DELIBERATELY NOT SEEDED (see above), so the architect does not
#       inherit a warm shared cache the way it does for ~/.cargo/~/.npm — it
#       trades a warm ~/.cache for an empty one. ACCEPTED: every dir this
#       moves is derived and self-healing, and the one entry that is both
#       large and genuinely granted (~/.cache/uv) is pinned back by
#       UV_CACHE_DIR above.
#     merger — LIVE from the next restart on the conflict-resolution path,
#       and COLD for exactly the architect's reason: it rides the same
#       unseeded /tmp/reify-agent-xdg-cache. Accepted on the same grounds
#       (every dir moved is derived and self-healing, and ~/.cache/uv is
#       pinned back by UV_CACHE_DIR), and the cold start is cheaper here
#       than for architect because merger dispatches on ~1% of invocations
#       — see the seam guard's MEASURED EXPOSURE note.
#     reviewer_comprehensive / judge — inert, same read-only tool grants that
#       make their CARGO_HOME/npm_config_cache entries inert.
#   BONUS, not a regression: because XDG_CACHE_HOME is general rather than
#   tree-sitter-specific, the redirect also relocates ~/.cache/claude-cli-nodejs
#   (26G) and ~/.cache/reify, NEITHER of which is in compute_write_set()
#   either — so for the sandboxed three it widens the writable cache surface
#   past the one dir that motivated it.
#   Restart-tier: inert until the orchestrator restarts (companion task
#   γ6b; XDG_CACHE_HOME/UV_CACHE_DIR ride the same tier — config loads once
#   at startup, no hot-reload). Reify-side seam guard:
#   tests/infra/test_sandbox_cache_writability_seam.sh.
role_env_overrides:
  implementer: &sandbox_cache_env
    CARGO_HOME: /tmp/reify-agent-cargo-home
    npm_config_cache: /tmp/reify-agent-npm-cache
    XDG_CACHE_HOME: /tmp/reify-agent-xdg-cache
    # Counter-redirect, not a /tmp target on purpose: pins uv back at its
    # own compute_write_set ~/.cache/uv grant so it does not silently
    # follow XDG_CACHE_HOME above into /tmp's tmpfiles 30d wipe/age-clean.
    # See the UV_CACHE_DIR paragraph above. Hardcoded absolute path
    # (role_env_overrides values are not known to undergo env
    # interpolation) — do not write $HOME/${HOME} here.
    UV_CACHE_DIR: /home/leo/.cache/uv
  debugger: *sandbox_cache_env
  simple_task: *sandbox_cache_env
  architect: *sandbox_cache_env
  reviewer_comprehensive: *sandbox_cache_env
  judge: *sandbox_cache_env
  merger: *sandbox_cache_env

# Escalation
escalation:
  queue_dir: "data/escalations"
  port: 8100

# Git
git:
  main_branch: "main"
  branch_prefix: "task/"
  remote: "origin"
  worktree_dir: ".worktrees"
  # Persistent warm merge-verify worktree (dark_factory:1692 = warmer-builds PRD κ).
  # Reuse a FIXED .worktrees/_merge-verify with target/ retained across the serial
  # (_MERGE_AHEAD_BOUND=1) merge-verify attempts → ~90→~25-35m typical, -60-80% CPU-s.
  # Activated 2026-06-10 (deb red-main-livelock follow-up). Trivially revertible (set false).
  persistent_merge_worktree: true
  # Merge-speculation warm-lane pool (PRD §9.5 B9 / dark-factory η #1789). The
  # persistent _merge-verify above only warms the SINGLE serial head; under Lever C
  # (K = 1 + enabled_verify_runners = 2) the speculative/gate_reverify verifies fell
  # through acquire_spec_lane's cold fallback to throwaway _merge-<hash> worktrees
  # (empty target/ → full ~2h cold build), monopolising both merge hosts and backing
  # the queue up (deb 2026-07-01). Enabling this routes those verifies to K CoW-seeded
  # _spec-{0..K-1} warm lanes instead. K is ONE sizing source, not two: the same
  # _MERGE_AHEAD_BOUND already declared by warm_lane_pool.merge_spec_pool_size_source
  # above — harness.py's `_speculation_k` reads that one value; it is not a second,
  # independent knob. Cold-fallback-safe (inv.6) and trivially revertible (set false =
  # byte-identical to prior behaviour). Prereqs met: warm_lane_pool live (#4665), Lever C on.
  merge_spec_warm_lane_pool: true
  # Off-lane detective (PRD §10 inv.6b): periodically re-verify a landed commit COLD and
  # compare test-level vs the warm result; divergence fires a born-at-L2 alarm naming the
  # commit + diverging tests. Cadence left at dark-factory defaults (every 40 lands OR nightly).
  warm_verify_shadow_compare: true
  # Offline deep-test lane (coverage-gap closure, 2026-07-19 merge-verify CPU survey —
  # docs/notes/merge-verify-cpu-survey-2026-07.md §Coverage gaps; PRD docs/prds/merge-gate-health.md
  # context). Before this the offline worker (DF offline_lane.py) had NEVER run: unconditionally-
  # #[ignore]d convergence tests ran NOWHERE and the host-infra cold lane (run_all --scope
  # host-infra, 4 tests) never executed. Post-merge-triggered, single-flight, idle-priority
  # (scripts/run-offline-deep.sh). Trivially revertible (set false / remove keys).
  persistent_offline_deep_worktree: true
  offline_lane_enabled: true
  offline_lane_infra_enabled: true
  # Main-gate sanction handshake (task 4367 step 1; dark_factory:1678 wired the
  # orchestrator side). advance_main runs main_gate_mark_command BEFORE its CAS
  # update-ref, so the reify reference-transaction hook records the orchestrator
  # merge worker's ~28 landings/day as `sanctioned` (not UNSANCTIONED) in
  # reify-main-gate.log. The sentinel path matches hooks/main-gate-lib.sh.
  # Enforcement stays OFF (warn-only) — this only populates the re-observe
  # window (4367 step 3); the durable ENFORCE flip is 4367 step 4.
  main_gate_mark_command: 'touch "$(git rev-parse --git-common-dir)/reify-main-gate-ok"'
  main_gate_unmark_command: 'rm -f "$(git rev-parse --git-common-dir)/reify-main-gate-ok"'
  # Warm-lane base location (DA3/DA4, task 4696 R3).
  # The gen-dir base lives at an XFS sibling of worktrees/ so DF's worktree prune
  # never touches it (it is OUTSIDE worktree_base).  Mount /home/leo/src/warm-lanes
  # is provision-warm-lane-fs.sh's _default_mount for project_root=/home/leo/src/reify.
  # ACTIVATED 2026-06-20 (#4665 deploy): worktree_base relocated onto the XFS reflink
  # mount (.worktrees → /home/leo/src/warm-lanes/worktrees, a symlink; DA1/DA2), the gen-dir
  # base lives at the XFS sibling below, and the pool is enabled. NOTE: verify_command_timeout_secs
  # is intentionally LEFT at 7200 here — it is reverted to the 1800 default only after a warm
  # first-verify is confirmed (the base self-seeds via refresh_warm_base over the first merge cycle).
  warm_lane_base_target_dir: "/home/leo/src/warm-lanes/base/target"
  warm_lane_pool: true   # #4665: enable the warm-lane CoW pool (task-dispatch lanes on XFS reflink)
  # spare_warm_lanes (moved here 2026-07-22, reify task 5358): effective warm task-lane pool
  # N = max_concurrent_tasks + spare_warm_lanes. This field lives on GitConfig
  # (dark-factory config.py GitConfig.spare_warm_lanes; harness reads
  # config.git.spare_warm_lanes) — the previous TOP-LEVEL placement was silently
  # dropped by OrchestratorConfig(extra='ignore'), so the +8 spare was phantom
  # since 2026-06-29 (pool was 48, not 56). Sized per the warm-lane pool sizing PRD
  # (docs/prds/warm-lane-pool-sizing-lifecycle.md). Read once at startup.
  spare_warm_lanes: 8
  # DF-1933 reclaim-on-exhaustion safety valve: on pool exhaustion, steals the
  # oldest non-dispatched non-terminal lane (with WIP-commit preservation) instead
  # of hard-faulting to the inv.6 cold-fallback. Enabled after the 2026-07-22
  # warm_lane_pool_exhausted cap-out storm (reify task 5358 / esc-5277-12).
  warm_lane_reclaim_on_exhaustion: true
  # DF-2879 prewarm knob: Harness.run() eagerly materializes the full effective_N
  # pool on disk at startup (worktree add + CoW seed per missing lane), so the
  # spare_warm_lanes headroom above actually exists on disk instead of being a
  # phantom that lazy lowest-numbered-first acquire never demands. Fail-open,
  # idempotent, consulted once at startup.
  warm_lane_prewarm: true

# Unknown-config-key census allowlist (dark-factory task 2989, filed as reify
# task 5733 follow-up from escalation agent-followup-2989). 2989 adds a
# raw-YAML-vs-OrchestratorConfig-schema walk that files a born-at-L2 critical
# escalation listing every unknown top-level/nested key, added after the
# 2026-07-22 warm-lane exhaustion incident (reify task 5358) where a misplaced
# top-level `spare_warm_lanes` silently no-opped under Pydantic extra='ignore'
# instead of landing on GitConfig. Matching semantics (fnmatch.fnmatchcase over
# the dotted path) are documented at ConfigKeyCensusConfig.ignore in
# dark-factory's orchestrator/src/orchestrator/config.py (task 2989) — not
# restated here since none of the entries below use a glob.
#
# Every entry below is a DELIBERATE reify-owned knob, not a typo or dead
# config; see each key's own in-line documentation above (the cpu_governance:,
# fairness:, and warm_lane_pool: blocks) for what it does and who consumes it.
# cpu_governance's four reify-owned sub-keys are listed individually rather
# than globbed as 'cpu_governance.*', because that namespace is mixed-consumer
# — cpu_governance.enabled IS a real dark-factory CpuGovernConfig field and
# must keep surfacing as unknown if it is ever renamed or removed.
#
# Do NOT "fix" warm_lane_pool by moving it under git: — the census's shadow
# hint suggesting git.warm_lane_pool is a coincidental name collision;
# GitConfig.warm_lane_pool is an unrelated bool (already set correctly at
# git.warm_lane_pool: true above), and feeding this dict to that bool field
# would hard-fail config validation.
#
# This block is inert until 2989 merges (currently tolerated as another
# unknown top-level key under extra='ignore'); once merged, config_key_census
# is green-tier reloadable, so no restart is required to pick it up.
config_key_census:
  ignore:
    - 'cpu_governance.weights'
    - 'cpu_governance.agent_admit'
    - 'cpu_governance.DF_AGENT_CPU_GOVERN'
    - 'cpu_governance.fleet_load_detector'
    - 'warm_lane_pool'

# Project root (absolute path)
project_root: "/home/leo/src/reify"
